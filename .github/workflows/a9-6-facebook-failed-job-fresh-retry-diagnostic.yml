name: A9.6 Facebook FAILED Job Fresh Retry Diagnostic

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/triggers/a9-6-facebook-failed-job-fresh-retry-diagnostic.txt

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  FACEBOOK_URL: https://www.facebook.com/reel/1114235920664408
  FAILED_JOB_ID: KRCM_1e99b074-fdf6-4144-9278-0e66e9a79713

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read service, exact job, and one free preflight only
        id: diag
        shell: bash
        run: |
          set +e
          service_http=unknown
          service_name=unknown
          service_branch=unknown
          latest_live_sha=unknown
          token_http=unknown
          job_http=unknown
          job_id=unknown
          status=unknown
          source_url=unknown
          language_hint=unknown
          credits=unknown
          uncertain=unknown
          reused=unknown
          error_code=none
          preflight_http=skipped
          balance=unknown
          estimated=unknown
          after=unknown
          consent=unknown
          can_continue=unknown

          if [[ -n "${RENDER_API_KEY:-}" ]]; then
            echo "::add-mask::$RENDER_API_KEY"
            service_http="$(curl -sS --max-time 30 -o /tmp/service.json -w '%{http_code}' \
              "${RENDER_API_BASE}/services/${SERVICE_ID}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}" || true)"
            service_name="$(jq -r '.name // "unknown"' /tmp/service.json 2>/dev/null)"
            service_branch="$(jq -r '.branch // "unknown"' /tmp/service.json 2>/dev/null)"

            curl -sS --max-time 30 -o /tmp/deploys.json \
              "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys?limit=10" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}" >/dev/null 2>&1 || true
            latest_live_sha="$(jq -r '[.[] | (.deploy // .) | select(.status == "live")][0] | (.commit.id // .commitId // "unknown")' /tmp/deploys.json 2>/dev/null)"

            token_http="$(curl -sS --max-time 30 -o /tmp/env.json -w '%{http_code}' \
              "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}" || true)"
            token="$(jq -r '(.envVar.value // .value // empty)' /tmp/env.json 2>/dev/null)"
            if [[ "$token_http" == 200 && -n "$token" ]]; then
              echo "::add-mask::$token"
              job_http="$(curl -sS --max-time 45 -o /tmp/job.json -w '%{http_code}' \
                "${BETA_BASE_URL}/api/v1/media/managed/transcriptions/${FAILED_JOB_ID}" \
                -H 'Accept: application/json' \
                -H "Authorization: Bearer ${token}" || true)"
              if [[ "$job_http" == 200 ]]; then
                job_id="$(jq -r '.job_id // "unknown"' /tmp/job.json)"
                status="$(jq -r '.status // "unknown"' /tmp/job.json)"
                source_url="$(jq -r '.source_url // "unknown"' /tmp/job.json)"
                language_hint="$(jq -r '.language_hint // "unknown"' /tmp/job.json)"
                credits="$(jq -r '.credits_charged // "unknown"' /tmp/job.json)"
                uncertain="$(jq -r 'if has("credit_charge_uncertain") then (.credit_charge_uncertain|tostring) else "unknown" end' /tmp/job.json)"
                reused="$(jq -r 'if has("reused") then (.reused|tostring) else "unknown" end' /tmp/job.json)"
                error_code="$(jq -r '.error.code // "none"' /tmp/job.json)"
              fi

              payload="$(jq -nc --arg url "$FACEBOOK_URL" '{url:$url,language_hint:"auto"}')"
              preflight_http="$(curl -sS --max-time 90 -o /tmp/preflight.json -w '%{http_code}' \
                -X POST "${BETA_BASE_URL}/api/v1/media/managed/preflight" \
                -H 'Accept: application/json' \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer ${token}" \
                --data "$payload" || true)"
              if [[ "$preflight_http" == 200 ]]; then
                balance="$(jq -r '.credits_available // "unknown"' /tmp/preflight.json)"
                estimated="$(jq -r '.estimated_credits // "unknown"' /tmp/preflight.json)"
                after="$(jq -r '.credits_after_estimate // "unknown"' /tmp/preflight.json)"
                consent="$(jq -r 'if has("consent_required") then (.consent_required|tostring) else "unknown" end' /tmp/preflight.json)"
                can_continue="$(jq -r 'if has("can_continue") then (.can_continue|tostring) else "unknown" end' /tmp/preflight.json)"
              fi
            fi
          fi

          for kv in \
            "service_http=$service_http" \
            "service_name=$service_name" \
            "service_branch=$service_branch" \
            "latest_live_sha=$latest_live_sha" \
            "token_http=$token_http" \
            "job_http=$job_http" \
            "job_id=$job_id" \
            "status=$status" \
            "source_url=$source_url" \
            "language_hint=$language_hint" \
            "credits=$credits" \
            "uncertain=$uncertain" \
            "reused=$reused" \
            "error_code=$error_code" \
            "preflight_http=$preflight_http" \
            "balance=$balance" \
            "estimated=$estimated" \
            "after=$after" \
            "consent=$consent" \
            "can_continue=$can_continue"; do
            echo "$kv" >> "$GITHUB_OUTPUT"
          done
          exit 0

      - name: Report safe diagnostic
        if: always()
        env:
          SERVICE_HTTP: ${{ steps.diag.outputs.service_http }}
          SERVICE_NAME_ACTUAL: ${{ steps.diag.outputs.service_name }}
          SERVICE_BRANCH_ACTUAL: ${{ steps.diag.outputs.service_branch }}
          LIVE_SHA: ${{ steps.diag.outputs.latest_live_sha }}
          TOKEN_HTTP: ${{ steps.diag.outputs.token_http }}
          JOB_HTTP: ${{ steps.diag.outputs.job_http }}
          JOB_ID: ${{ steps.diag.outputs.job_id }}
          STATUS: ${{ steps.diag.outputs.status }}
          SOURCE_URL: ${{ steps.diag.outputs.source_url }}
          LANGUAGE_HINT: ${{ steps.diag.outputs.language_hint }}
          CREDITS: ${{ steps.diag.outputs.credits }}
          UNCERTAIN: ${{ steps.diag.outputs.uncertain }}
          REUSED: ${{ steps.diag.outputs.reused }}
          ERROR_CODE: ${{ steps.diag.outputs.error_code }}
          PREFLIGHT_HTTP: ${{ steps.diag.outputs.preflight_http }}
          BALANCE: ${{ steps.diag.outputs.balance }}
          ESTIMATED: ${{ steps.diag.outputs.estimated }}
          AFTER: ${{ steps.diag.outputs.after }}
          CONSENT: ${{ steps.diag.outputs.consent }}
          CAN_CONTINUE: ${{ steps.diag.outputs.can_continue }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 FAILED-job fresh retry safe diagnostic: service_http=\`${SERVICE_HTTP:-unknown}\`, service=\`${SERVICE_NAME_ACTUAL:-unknown}\`, branch=\`${SERVICE_BRANCH_ACTUAL:-unknown}\`, latest_live_sha=\`${LIVE_SHA:-unknown}\`; token_http=\`${TOKEN_HTTP:-unknown}\`; job_http=\`${JOB_HTTP:-unknown}\`, job=\`${JOB_ID:-unknown}\`, status=\`${STATUS:-unknown}\`, source_url=\`${SOURCE_URL:-unknown}\`, language_hint=\`${LANGUAGE_HINT:-unknown}\`, credits=\`${CREDITS:-unknown}\`, charge_uncertain=\`${UNCERTAIN:-unknown}\`, reused=\`${REUSED:-unknown}\`, error=\`${ERROR_CODE:-none}\`; preflight_http=\`${PREFLIGHT_HTTP:-unknown}\`, balance=\`${BALANCE:-unknown}\`, estimated=\`${ESTIMATED:-unknown}\`, expected_after=\`${AFTER:-unknown}\`, consent_required=\`${CONSENT:-unknown}\`, can_continue=\`${CAN_CONTINUE:-unknown}\`. Read-only backend checks plus one free preflight only. No native/transcript start, metadata, AI, production, main, or merge action was executed."
