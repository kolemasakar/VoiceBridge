name: A9.7-I Facebook E2E Request-Log Diagnostic

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-current-ai-runtime-log-diagnostic.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      RENDER_API_BASE: https://api.render.com/v1
      VOICEBRIDGE_SERVICE_ID: srv-da1kic5bedkc73d6fk60
      COBALT_SERVICE_ID: srv-da5ggq6k1f9s738j8d8g
      WINDOW_START: 2026-08-23T17:00:00Z
      WINDOW_END: 2026-08-23T17:20:00Z
    steps:
      - name: Read Render HTTP request logs only
        id: requests
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          echo "::add-mask::$RENDER_API_KEY"

          read_requests() {
            local service_id="$1"
            local prefix="$2"
            local service_json="/tmp/${prefix}_service.json"
            local logs_json="/tmp/${prefix}_requests.json"
            local safe_txt="/tmp/${prefix}_requests_safe.txt"
            local service_code
            service_code="$(curl -sS -o "$service_json" -w '%{http_code}' \
              "${RENDER_API_BASE}/services/${service_id}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$service_code" == 200 ]]
            local owner_id
            owner_id="$(jq -r '.ownerId // .owner.id // empty' "$service_json")"
            test -n "$owner_id"
            local logs_code
            logs_code="$(curl -sS -G -o "$logs_json" -w '%{http_code}' \
              "${RENDER_API_BASE}/logs" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              --data-urlencode "ownerId=${owner_id}" \
              --data-urlencode "resource=${service_id}" \
              --data-urlencode "type=request" \
              --data-urlencode "startTime=${WINDOW_START}" \
              --data-urlencode "endTime=${WINDOW_END}" \
              --data-urlencode "direction=forward" \
              --data-urlencode "limit=100")"
            echo "${prefix}_request_logs_code=$logs_code" >> "$GITHUB_OUTPUT"
            if [[ "$logs_code" != 200 ]]; then
              printf 'request_logs_http_%s\n' "$logs_code" > "$safe_txt"
              return
            fi
            jq -c '
              .. | objects |
              select((.method? != null) or (.statusCode? != null) or (.path? != null) or (.labels?.method? != null) or (.labels?.statusCode? != null) or (.labels?.path? != null)) |
              {timestamp:(.timestamp // .time // null), method:(.method // .labels.method // null), status:(.statusCode // .labels.statusCode // null), path:(.path // .labels.path // null), host:(.host // .labels.host // null), message:(.message // .text // null)}
            ' "$logs_json" | tail -n 50 > "$safe_txt" || true
            [[ -s "$safe_txt" ]] || printf 'no_request_log_records\n' > "$safe_txt"
          }

          read_requests "$VOICEBRIDGE_SERVICE_ID" voicebridge
          read_requests "$COBALT_SERVICE_ID" cobalt
          vb="$(tr '\n' '|' < /tmp/voicebridge_requests_safe.txt | sed 's/`/_/g' | head -c 6000)"
          cb="$(tr '\n' '|' < /tmp/cobalt_requests_safe.txt | sed 's/`/_/g' | head -c 6000)"
          echo "voicebridge_requests=$vb" >> "$GITHUB_OUTPUT"
          echo "cobalt_requests=$cb" >> "$GITHUB_OUTPUT"

      - name: Report request-log diagnostic
        env:
          VB_CODE: ${{ steps.requests.outputs.voicebridge_request_logs_code }}
          CB_CODE: ${{ steps.requests.outputs.cobalt_request_logs_code }}
          VB: ${{ steps.requests.outputs.voicebridge_requests }}
          CB: ${{ steps.requests.outputs.cobalt_requests }}
        shell: bash
        run: |
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.7-I E2E Render request-log diagnostic: VoiceBridge request logs HTTP=\`${VB_CODE}\`, records=\`${VB}\`; Cobalt request logs HTTP=\`${CB_CODE}\`, records=\`${CB}\`. Render logs API reads only; no media/provider endpoint, deploy, env mutation, or retry was executed."
