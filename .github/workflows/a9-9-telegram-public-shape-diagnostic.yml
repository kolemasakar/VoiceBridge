name: A9.9 Telegram Public Shape Diagnostic

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-9-telegram-public-shape-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Find fresh public Telegram video target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html as html_lib
          import re
          import urllib.request
          from urllib.parse import urlparse

          targets = [f"https://t.me/techcrimes/{post_id}" for post_id in range(12095, 12111)]

          for source in targets:
              embed = source + "?embed=1&single=1"
              req = urllib.request.Request(
                  embed,
                  headers={
                      "Accept": "text/html,application/xhtml+xml",
                      "User-Agent": "VoiceBridge-KRC-Media-Beta/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read(2 * 1024 * 1024)
                      page = raw.decode("utf-8", "replace")
                      status = response.status
              except Exception as exc:
                  print(f"target={source} fetch_error={type(exc).__name__}")
                  continue

              channel, post_id = source.rstrip("/").split("/")[-2:]
              exact = bool(re.search(rf'data-post=[\"\']{re.escape(channel)}/{re.escape(post_id)}[\"\']', page, re.I))
              video_tags = re.findall(r'<video\b([^>]*)>', page, re.I)
              src_hosts = []
              for attrs in video_tags:
                  match = re.search(r'\bsrc\s*=\s*([\"\'])(.*?)\1', attrs, re.I)
                  if match:
                      parsed = urlparse(html_lib.unescape(match.group(2)))
                      src_hosts.append((parsed.hostname or '').lower())
              duration_match = re.search(
                  r'<time\b[^>]*class=[\"\'][^\"\']*(?:message_video_duration|js-message_video_duration)[^\"\']*[\"\'][^>]*>([^<]*)</time>',
                  page,
                  re.I,
              )
              duration = duration_match.group(1).strip() if duration_match else "none"
              text_match = re.search(r'<div\b[^>]*class=[\"\'][^\"\']*tgme_widget_message_text[^\"\']*[\"\'][^>]*>([\s\S]*?)</div>', page, re.I)
              text = ""
              if text_match:
                  text = re.sub(r'<[^>]+>', ' ', text_match.group(1))
                  text = html_lib.unescape(re.sub(r'\s+', ' ', text)).strip()[:120]
              print(
                  f"target={source} http={status} exact={str(exact).lower()} "
                  f"video_tags={len(video_tags)} duration={duration} hosts={src_hosts} text={text!r}"
              )
          PY
