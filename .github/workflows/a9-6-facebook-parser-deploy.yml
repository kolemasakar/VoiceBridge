name: A9.6 Facebook Parser Deploy

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-parser-deploy.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  CODE_SHA: f6b32c2a03425deaecadd10fc902671d62eaab5d
  FACEBOOK_URL: https://www.facebook.com/reel/1114235920664408

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Deploy exact parser fix to isolated beta
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          echo "::add-mask::$RENDER_API_KEY"

          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]]
          [[ "$(jq -r '.name // empty' "$tmp")" == "$SERVICE_NAME" ]]
          [[ "$(jq -r '.branch // empty' "$tmp")" == "$REQUIRED_BRANCH" ]]
          rm -f "$tmp"

          payload="$(jq -nc --arg commitId "$CODE_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}" --data "$payload")"
          [[ "$code" == 201 || "$code" == 202 ]]
          deploy_id="$(jq -r '(.deploy // .).id // empty' "$tmp")"
          rm -f "$tmp"
          test -n "$deploy_id"

          for i in $(seq 1 90); do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${deploy_id}" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == 200 ]]
            status="$(jq -r '(.deploy // .).status // "unknown"' "$tmp")"
            commit="$(jq -r '(.deploy // .).commit.id // (.deploy // .).commitId // "unknown"' "$tmp")"
            rm -f "$tmp"
            if [[ "$status" == "live" ]]; then
              [[ "$commit" == "$CODE_SHA" ]]
              echo "live_sha=$commit" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            case "$status" in build_failed|update_failed|canceled|deactivated) exit 1;; esac
            sleep 5
          done
          exit 1

      - name: Verify live state without provider start
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]]
          token="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
          rm -f "$tmp"
          test -n "$token"
          echo "::add-mask::$token"

          cap_code="$(curl -sS --max-time 60 -o /tmp/cap.json -w '%{http_code}' "${BETA_BASE_URL}/api/v1/media/managed" -H 'Accept: application/json' -H "Authorization: Bearer ${token}")"
          [[ "$cap_code" == 200 ]]
          jq -e '.configured == true and .facebook_ai_fallback == true and .automatic_ai_fallback == false' /tmp/cap.json >/dev/null

          payload="$(jq -nc --arg url "$FACEBOOK_URL" '{url:$url,language_hint:"auto"}')"
          lookup_code="$(curl -sS --max-time 60 -o /tmp/lookup.json -w '%{http_code}' -X POST "${BETA_BASE_URL}/api/v1/media/managed/lookup" -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer ${token}" --data "$payload")"
          [[ "$lookup_code" == 200 ]]
          jq -e '.status == "FAILED" and .provider_mode == "generate" and .error.code == "MANAGED_PROVIDER_TRANSCRIPT_INVALID" and .media_duration_seconds == 22 and .ai_credit_ceiling == 2' /tmp/lookup.json >/dev/null

      - name: Report isolated parser deploy
        if: always()
        env:
          LIVE_SHA: ${{ steps.deploy.outputs.live_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then
            gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook nested-result parser isolated deploy: **PASS**. Exact code \`${LIVE_SHA}\` is live on \`${SERVICE_NAME}\` only. Existing Facebook job remains safely \`FAILED\` after the already-spent AI attempt; no retry, transcript start, metadata request, or AI request was executed. Production/main were not targeted."
          else
            gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook nested-result parser isolated deploy: **FAILURE**. No retry, transcript start, metadata request, or AI request was executed. Production/main were not targeted."
          fi
