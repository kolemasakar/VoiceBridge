name: A9.6 Facebook Parser Render Diagnostic

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-parser-render-diagnostic.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      RENDER_API_BASE: https://api.render.com/v1
      SERVICE_ID: srv-da1kic5bedkc73d6fk60
      SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
      REQUIRED_BRANCH: agent/krc-media-transcript
      BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
      EXPECTED_SHA: b88e710526d3cc7feaa982368fdab584ee096389
    steps:
      - name: Inspect isolated Render target only
        id: inspect
        shell: bash
        run: |
          set +e
          test -n "${RENDER_API_KEY:-}" || exit 2
          echo "::add-mask::$RENDER_API_KEY"

          service_http="$(curl -sS -o /tmp/service.json -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          service_name="$(jq -r '.name // "unknown"' /tmp/service.json 2>/dev/null)"
          service_branch="$(jq -r '.branch // "unknown"' /tmp/service.json 2>/dev/null)"

          deploy_http="$(curl -sS -o /tmp/deploys.json -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys?limit=5" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          latest_status="$(jq -r '.[0].deploy.status // .[0].status // "unknown"' /tmp/deploys.json 2>/dev/null)"
          latest_sha="$(jq -r '.[0].deploy.commit.id // .[0].commit.id // .[0].deploy.commitId // .[0].commitId // "unknown"' /tmp/deploys.json 2>/dev/null)"
          expected_status="$(jq -r --arg sha "$EXPECTED_SHA" '[.[] | select((.deploy.commit.id // .commit.id // .deploy.commitId // .commitId // "") == $sha)][0] | (.deploy.status // .status // "not_found")' /tmp/deploys.json 2>/dev/null)"

          health_http="$(curl -sS --max-time 30 -o /tmp/health.json -w '%{http_code}' \
            "${BETA_BASE_URL}/health" || true)"
          health_value="$(jq -r '.status // .ok // "unknown"' /tmp/health.json 2>/dev/null)"

          token_http="$(curl -sS -o /tmp/token.json -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          action_token="$(jq -r '(.envVar.value // .value // empty)' /tmp/token.json 2>/dev/null)"
          capability_http=unknown
          facebook_capability=unknown
          if [[ "$token_http" == 200 && -n "$action_token" ]]; then
            echo "::add-mask::$action_token"
            capability_http="$(curl -sS --max-time 60 -o /tmp/capability.json -w '%{http_code}' \
              "${BETA_BASE_URL}/api/v1/media/managed" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${action_token}" || true)"
            if [[ "$capability_http" == 200 ]]; then
              facebook_capability="$(jq -r '(.facebook_ai_fallback == true and .configured == true)' /tmp/capability.json 2>/dev/null)"
            fi
          fi

          echo "service_http=$service_http" >> "$GITHUB_OUTPUT"
          echo "service_name=$service_name" >> "$GITHUB_OUTPUT"
          echo "service_branch=$service_branch" >> "$GITHUB_OUTPUT"
          echo "deploy_http=$deploy_http" >> "$GITHUB_OUTPUT"
          echo "latest_status=$latest_status" >> "$GITHUB_OUTPUT"
          echo "latest_sha=$latest_sha" >> "$GITHUB_OUTPUT"
          echo "expected_status=$expected_status" >> "$GITHUB_OUTPUT"
          echo "health_http=$health_http" >> "$GITHUB_OUTPUT"
          echo "health_value=$health_value" >> "$GITHUB_OUTPUT"
          echo "token_http=$token_http" >> "$GITHUB_OUTPUT"
          echo "capability_http=$capability_http" >> "$GITHUB_OUTPUT"
          echo "facebook_capability=$facebook_capability" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report diagnostic
        env:
          SERVICE_HTTP: ${{ steps.inspect.outputs.service_http }}
          SERVICE_NAME_ACTUAL: ${{ steps.inspect.outputs.service_name }}
          SERVICE_BRANCH_ACTUAL: ${{ steps.inspect.outputs.service_branch }}
          DEPLOY_HTTP: ${{ steps.inspect.outputs.deploy_http }}
          LATEST_STATUS: ${{ steps.inspect.outputs.latest_status }}
          LATEST_SHA: ${{ steps.inspect.outputs.latest_sha }}
          EXPECTED_STATUS: ${{ steps.inspect.outputs.expected_status }}
          HEALTH_HTTP: ${{ steps.inspect.outputs.health_http }}
          HEALTH_VALUE: ${{ steps.inspect.outputs.health_value }}
          TOKEN_HTTP: ${{ steps.inspect.outputs.token_http }}
          CAPABILITY_HTTP: ${{ steps.inspect.outputs.capability_http }}
          FACEBOOK_CAPABILITY: ${{ steps.inspect.outputs.facebook_capability }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook current Render connectivity diagnostic: service_http=\`${SERVICE_HTTP}\`, service=\`${SERVICE_NAME_ACTUAL}\`, branch=\`${SERVICE_BRANCH_ACTUAL}\`, deploy_http=\`${DEPLOY_HTTP}\`, latest_status=\`${LATEST_STATUS}\`, latest_sha=\`${LATEST_SHA}\`, expected_hardening_sha_status=\`${EXPECTED_STATUS}\`, health_http=\`${HEALTH_HTTP}\`, health=\`${HEALTH_VALUE}\`, token_http=\`${TOKEN_HTTP}\`, managed_capability_http=\`${CAPABILITY_HTTP}\`, facebook_capability_ok=\`${FACEBOOK_CAPABILITY}\`. Render/service/capability reads only; no Supadata account/preflight/transcript/metadata/AI endpoint was called. Production/main were not targeted."

