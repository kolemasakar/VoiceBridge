name: A9.6 Facebook Parser Authenticated Health

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-parser-auth-health.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      RENDER_API_BASE: https://api.render.com/v1
      SERVICE_ID: srv-da1kic5bedkc73d6fk60
      BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
      EXPECTED_SHA: f6b32c2a03425deaecadd10fc902671d62eaab5d
    steps:
      - name: Verify authenticated isolated health and capability
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          echo "::add-mask::$RENDER_API_KEY"
          curl -sS "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" \
            -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/env.json
          action_token="$(jq -r '(.envVar.value // .value // empty)' /tmp/env.json)"
          test -n "$action_token"
          echo "::add-mask::$action_token"
          curl -sS "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys?limit=1" \
            -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/deploys.json
          status="$(jq -r '.[0].deploy.status // .[0].status // "unknown"' /tmp/deploys.json)"
          sha="$(jq -r '.[0].deploy.commit.id // .[0].commit.id // .[0].deploy.commitId // .[0].commitId // "unknown"' /tmp/deploys.json)"
          health_http="$(curl -sS --max-time 30 -o /tmp/health.json -w '%{http_code}' "${BETA_BASE_URL}/health" -H "Authorization: Bearer ${action_token}")"
          cap_http="$(curl -sS --max-time 30 -o /tmp/cap.json -w '%{http_code}' "${BETA_BASE_URL}/api/v1/media/managed" -H 'Accept: application/json' -H "Authorization: Bearer ${action_token}")"
          health_ok=false
          cap_ok=false
          if [[ "$health_http" == 200 ]]; then health_ok=true; fi
          if [[ "$cap_http" == 200 ]] && jq -e '.configured == true and .facebook_ai_fallback == true and .facebook_ai_requires_duration_metadata == true and .automatic_ai_fallback == false' /tmp/cap.json >/dev/null; then cap_ok=true; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "health_http=$health_http" >> "$GITHUB_OUTPUT"
          echo "health_ok=$health_ok" >> "$GITHUB_OUTPUT"
          echo "cap_http=$cap_http" >> "$GITHUB_OUTPUT"
          echo "cap_ok=$cap_ok" >> "$GITHUB_OUTPUT"

      - name: Report verified state
        env:
          STATUS: ${{ steps.verify.outputs.status }}
          SHA: ${{ steps.verify.outputs.sha }}
          HEALTH_HTTP: ${{ steps.verify.outputs.health_http }}
          HEALTH_OK: ${{ steps.verify.outputs.health_ok }}
          CAP_HTTP: ${{ steps.verify.outputs.cap_http }}
          CAP_OK: ${{ steps.verify.outputs.cap_ok }}
        shell: bash
        run: |
          set -euo pipefail
          result=FAIL
          if [[ "$STATUS" == live && "$SHA" == "$EXPECTED_SHA" && "$HEALTH_OK" == true && "$CAP_OK" == true ]]; then result=PASS; fi
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook parser authenticated isolated verification: **${result}**. deploy_status=\`${STATUS}\`, sha=\`${SHA}\`, health_http=\`${HEALTH_HTTP}\`, capability_http=\`${CAP_HTTP}\`, facebook_capability_ok=\`${CAP_OK}\`. Authenticated service reads only; no Supadata account/preflight/transcript/metadata/AI endpoint was called. Production/main were not targeted."
