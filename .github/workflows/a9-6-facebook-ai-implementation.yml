name: A9.6 Facebook AI Implementation

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-ai-implementation.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/krc-media-transcript
          fetch-depth: 0

      - name: Apply Facebook AI patch
        run: python scripts/a9_6_facebook_ai_patch.py

      - name: Build and test cloud service
        working-directory: src/cloud
        run: |
          npm ci
          npm run check

      - name: Commit implementation to feature branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloud/src/supadata_provider.ts src/cloud/src/managed_media_service.ts src/cloud/src/managed_media_http.ts src/cloud/tests/managed_media_facebook.test.ts src/cloud/tests/managed_media_http.test.ts
          git diff --cached --check
          git commit -m "A9.6: add consent-gated Facebook AI fallback"
          git push origin HEAD:agent/krc-media-transcript
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report implementation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook AI fallback implementation: **PASS**. Feature commit: \`${PATCH_SHA}\`. Flow is native unavailable -> separate 1-credit metadata-duration consent -> duration-derived AI hard cap -> separate AI consent. Cloud build/tests passed. No metadata or AI provider request was executed. Production/main were not targeted."
          else
            gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook AI fallback implementation: **FAIL**. No metadata or AI provider request was authorized. Production/main were not targeted."
          fi
