name: A9.6 Facebook AI Implementation

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-ai-implementation.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/krc-media-transcript
          fetch-depth: 0

      - name: Apply Facebook metadata-duration and dynamic AI cap patch
        shell: bash
        run: |
          python - <<'PY'
