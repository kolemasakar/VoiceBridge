              return text.replace(old, new, 1)

          # Provider: metadata quote/duration + duration-derived AI ceiling.
          path = Path("src/cloud/src/supadata_provider.ts")
          s = path.read_text()
          s = replace_once(
              s,
              'const NATIVE_TRANSCRIPT_CREDITS = 1;\n',
              'const NATIVE_TRANSCRIPT_CREDITS = 1;\nexport const METADATA_CREDITS = 1;\n',
              'provider metadata constant'
          )
          marker = '''export interface SupadataGenerateCreditQuote {
  provider: "supadata";
  mode: "generate";
'''
