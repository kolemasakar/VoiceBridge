name: A9.6 Facebook AI Implementation

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-ai-implementation.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/krc-media-transcript
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/cloud/package-lock.json

      - name: Apply Facebook AI patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/a9_6_facebook_ai_patch.py > /tmp/fb-patch.log 2>&1
          code=$?
          if [[ $code -eq 0 ]]; then
            python scripts/a9_6_facebook_ai_compat_patch.py >> /tmp/fb-patch.log 2>&1
            code=$?
          fi
          if [[ $code -eq 0 ]]; then
            python scripts/a9_6_facebook_ai_test_patch.py >> /tmp/fb-patch.log 2>&1
            code=$?
          fi
          cat /tmp/fb-patch.log
          exit $code

      - name: Build and test cloud service
        id: test
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        working-directory: src/cloud
        shell: bash
        run: |
          set +e
          npm ci > /tmp/fb-test.log 2>&1
          code=$?
          if [[ $code -eq 0 ]]; then
            npm run check >> /tmp/fb-test.log 2>&1
            code=$?
          fi
          cat /tmp/fb-test.log
          exit $code

      - name: Commit implementation to feature branch
        id: commit
        if: steps.patch.outcome == 'success' && steps.test.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloud/src/supadata_provider.ts src/cloud/src/managed_media_service.ts src/cloud/src/managed_media_http.ts src/cloud/tests/managed_media_facebook.test.ts src/cloud/tests/managed_media_http.test.ts src/cloud/tests/managed_media_service.test.ts
          git diff --cached --check
          git commit -m "A9.6: add consent-gated Facebook AI fallback"
          git push origin HEAD:agent/krc-media-transcript
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report implementation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_SHA: ${{ steps.commit.outputs.sha }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PATCH_OUTCOME" == "success" && "$TEST_OUTCOME" == "success" && -n "${PATCH_SHA:-}" ]]; then
            gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook AI fallback implementation: **PASS**. Feature commit: \`${PATCH_SHA}\`. Flow is native unavailable -> separate 1-credit metadata-duration consent -> duration-derived AI hard cap -> separate AI consent. Cloud build/tests passed under Node 24. No metadata or AI provider request was executed. Production/main were not targeted."
          else
            if [[ "$PATCH_OUTCOME" != "success" ]]; then
              diag="$(tail -n 20 /tmp/fb-patch.log 2>/dev/null || true)"
              phase="patch"
            else
              diag="$(tail -n 30 /tmp/fb-test.log 2>/dev/null || true)"
              phase="test"
            fi
            [[ ${#diag} -le 5000 ]] || diag="${diag:0:5000}"
            body=$(printf 'A9.6 Facebook AI fallback implementation: **FAIL** at `%s`. Safe diagnostic:\n```text\n%s\n```\nNo metadata or AI provider request was authorized. Production/main were not targeted.' "$phase" "$diag")
            gh pr comment 28 --repo kolemasakar/VoiceBridge --body "$body"
          fi

# retrigger after regression fixes
