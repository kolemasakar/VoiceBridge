name: A9.6 Facebook Native Acceptance

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-native-acceptance.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: a9-6-facebook-native-acceptance
  cancel-in-progress: false

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  FACEBOOK_URL: https://www.facebook.com/reel/1114235920664408
  REQUIRED_AVAILABLE_BEFORE: "90"
  REQUIRED_AVAILABLE_AFTER_NATIVE: "89"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enforce isolated target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          echo "::add-mask::$RENDER_API_KEY"
          [[ "$GITHUB_REF_NAME" == "$REQUIRED_BRANCH" ]]
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]]
          name="$(jq -r '.name // empty' "$tmp")"
          branch="$(jq -r '.branch // empty' "$tmp")"
          rm -f "$tmp"
          [[ "$name" == "$SERVICE_NAME" ]]
          [[ "$branch" == "$REQUIRED_BRANCH" ]]

      - name: Deploy exact feature-branch commit to isolated beta
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg commitId "$GITHUB_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            -X POST "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            --data "$payload")"
          [[ "$code" == 201 || "$code" == 202 ]]
          deploy_id="$(jq -r '(.deploy // .).id // empty' "$tmp")"
          rm -f "$tmp"
          test -n "$deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for isolated deploy
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == 200 ]]
            status="$(jq -r '(.deploy // .).status // "unknown"' "$tmp")"
            commit="$(jq -r '(.deploy // .).commit.id // (.deploy // .).commitId // "unknown"' "$tmp")"
            rm -f "$tmp"
            case "$status" in
              live)
                [[ "$commit" == "$GITHUB_SHA" ]]
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                exit 1
                ;;
            esac
            sleep 5
          done
          exit 1

      - name: Read and mask Action bearer
        id: action
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]]
          token="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
          rm -f "$tmp"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Recheck exact approved one-credit native quote
        id: quote
        env:
          ACTION_TOKEN: ${{ steps.action.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg url "$FACEBOOK_URL" '{url:$url,language_hint:"auto"}')"
          code="$(curl -sS --max-time 90 -o /tmp/facebook-quote.json -w '%{http_code}' \
            -X POST "${BETA_BASE_URL}/api/v1/media/managed/preflight" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${ACTION_TOKEN}" \
            --data "$payload")"
          [[ "$code" == 200 ]]
          jq -e '
            .provider == "supadata" and
            .mode == "native" and
            .estimated_credits == 1 and
            .consent_required == true and
            .can_continue == true and
            (.source_url | startswith("https://www.facebook.com/reel/"))
          ' /tmp/facebook-quote.json >/dev/null
          available="$(jq -r '.credits_available' /tmp/facebook-quote.json)"
          after="$(jq -r '.credits_after_estimate' /tmp/facebook-quote.json)"
          [[ "$available" == "$REQUIRED_AVAILABLE_BEFORE" ]]
          [[ "$after" == "$REQUIRED_AVAILABLE_AFTER_NATIVE" ]]
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

      - name: Execute exactly one newly approved Facebook native start
        id: native
        env:
          ACTION_TOKEN: ${{ steps.action.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg url "$FACEBOOK_URL" '{url:$url,language_hint:"auto",credit_consent:{provider:"supadata",mode:"native",max_credits:1}}')"
          code="$(curl -sS --max-time 180 -o /tmp/facebook-native.json -w '%{http_code}' \
            -X POST "${BETA_BASE_URL}/api/v1/media/managed/transcriptions" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${ACTION_TOKEN}" \
            --data "$payload")"
          [[ "$code" == 200 ]]
          jq -e '
            (.status == "COMPLETED" or .status == "AWAITING_AI_CONSENT") and
            .provider == "supadata" and
            .provider_mode == "native" and
            .credits_charged == 1 and
            .credit_charge_uncertain == false and
            .reused == false
          ' /tmp/facebook-native.json >/dev/null
          status="$(jq -r '.status' /tmp/facebook-native.json)"
          segments="$(jq -r '.segment_count' /tmp/facebook-native.json)"
          language="$(jq -r '.detected_language // "none"' /tmp/facebook-native.json)"
          job_id="$(jq -r '.job_id' /tmp/facebook-native.json)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "segments=$segments" >> "$GITHUB_OUTPUT"
          echo "language=$language" >> "$GITHUB_OUTPUT"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Verify completed transcript page when native succeeds
        if: steps.native.outputs.status == 'COMPLETED'
        env:
          ACTION_TOKEN: ${{ steps.action.outputs.token }}
          JOB_ID: ${{ steps.native.outputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 90 -o /tmp/facebook-segments.json -w '%{http_code}' \
            "${BETA_BASE_URL}/api/v1/media/managed/transcriptions/${JOB_ID}/segments?cursor=0&limit=50" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${ACTION_TOKEN}")"
          [[ "$code" == 200 ]]
          jq -e '.status == "COMPLETED" and (.segments | length) > 0' /tmp/facebook-segments.json >/dev/null

      - name: Verify metadata consent gate when native is unavailable
        id: metadata_quote
        if: steps.native.outputs.status == 'AWAITING_AI_CONSENT'
        env:
          ACTION_TOKEN: ${{ steps.action.outputs.token }}
          JOB_ID: ${{ steps.native.outputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 90 -o /tmp/facebook-metadata-quote.json -w '%{http_code}' \
            "${BETA_BASE_URL}/api/v1/media/managed/transcriptions/${JOB_ID}/facebook-ai-estimate-preflight" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${ACTION_TOKEN}")"
          [[ "$code" == 200 ]]
          jq -e '
            .provider == "supadata" and
            .mode == "metadata" and
            .purpose == "facebook_ai_duration" and
            .estimated_credits == 1 and
            .consent_required == true and
            .can_continue == true
          ' /tmp/facebook-metadata-quote.json >/dev/null
          available="$(jq -r '.credits_available' /tmp/facebook-metadata-quote.json)"
          after="$(jq -r '.credits_after_estimate' /tmp/facebook-metadata-quote.json)"
          [[ "$available" == "$REQUIRED_AVAILABLE_AFTER_NATIVE" ]]
          [[ "$after" -eq $((available - 1)) ]]
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

      - name: Report Facebook native acceptance
        if: always()
        env:
          AVAILABLE: ${{ steps.quote.outputs.available }}
          NATIVE_AFTER: ${{ steps.quote.outputs.after }}
          STATUS: ${{ steps.native.outputs.status }}
          SEGMENTS: ${{ steps.native.outputs.segments }}
          LANGUAGE: ${{ steps.native.outputs.language }}
          META_AVAILABLE: ${{ steps.metadata_quote.outputs.available }}
          META_AFTER: ${{ steps.metadata_quote.outputs.after }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then
            body="A9.6 Facebook fresh native acceptance: **SUCCESS**. User explicitly approved exactly one new native request with hard maximum \`1\` credit. Isolated target only. Native balance quote \`${AVAILABLE}\` -> \`${NATIVE_AFTER}\`; result status=\`${STATUS}\`, detected_language=\`${LANGUAGE}\`, segments=\`${SEGMENTS}\`, credits_charged=\`1\`, reused=\`false\`. If native was unavailable, metadata preflight only returned balance \`${META_AVAILABLE}\` -> \`${META_AFTER}\`; no metadata start or AI start request was executed. Production/main were not targeted."
          else
            body="A9.6 Facebook fresh native acceptance: **FAILURE**. Authorization was limited to exactly one new native request with hard maximum \`1\` credit. No metadata start or AI start request was authorized by this workflow. Production/main were not targeted."
          fi
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "$body"
