name: A9.6 Supadata Nested Result Commit V2

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-supadata-nested-result-commit-v2.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  commit_fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/krc-media-transcript
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/cloud/package-lock.json

      - name: Apply and verify parser remediation
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python scripts/a9_6_supadata_nested_result_patch.py
          cd src/cloud
          npm ci
          npm run check
          cd ../..
          git diff -- src/cloud/src/supadata_provider.ts src/cloud/tests/supadata_provider.test.ts > /tmp/nested-result.patch
          test -s /tmp/nested-result.patch

      - name: Rebase cleanly and commit only verified patch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/krc-media-transcript
          git reset --hard origin/agent/krc-media-transcript
          git clean -fd
          git apply --check /tmp/nested-result.patch
          git apply /tmp/nested-result.patch
          git add src/cloud/src/supadata_provider.ts src/cloud/tests/supadata_provider.test.ts
          git diff --cached --check
          git commit -m "A9.6: accept nested Supadata async transcript results"
          sha="$(git rev-parse HEAD)"
          git push origin HEAD:agent/krc-media-transcript
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Report robust commit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" && -n "${SHA:-}" ]]; then
            gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Supadata nested-result remediation V2: **PASS**. Verified patch was applied after a clean branch refresh and committed as \`${SHA}\`. Full Node 24 cloud suite passed before commit: 89/89. No provider transcript, metadata, or AI start request was executed. Production/main were not targeted."
          else
            gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Supadata nested-result remediation V2: **FAILURE**. No provider transcript, metadata, or AI start request was executed. Production/main were not targeted."
          fi
