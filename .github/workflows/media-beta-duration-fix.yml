name: MEDIA BETA Duration Fix

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/media-beta-duration-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/krc-media-transcript
          fetch-depth: 0

      - name: Fix MediaRecorder WebM duration handling
        shell: bash
        env:
          PATCH_B64:  
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloud/src/media_client_ingest.ts
          git commit -m "Fix browser WebM duration handling"
          git push origin HEAD:agent/krc-media-transcript
