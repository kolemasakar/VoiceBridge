name: A9.6 Facebook Parser Full Log Diagnostic

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-parser-full-log-diagnostic.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      RENDER_API_BASE: https://api.render.com/v1
      SERVICE_ID: srv-da1kic5bedkc73d6fk60
      FAILURE_START: 2026-08-21T08:10:00Z
      FAILURE_END: 2026-08-21T08:25:30Z
    steps:
      - name: Read all isolated deploy-window logs
        id: logs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          echo "::add-mask::$RENDER_API_KEY"
          curl -sS "${RENDER_API_BASE}/services/${SERVICE_ID}" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/service.json
          owner_id="$(jq -r '.ownerId // .owner.id // empty' /tmp/service.json)"
          test -n "$owner_id"
          code="$(curl -sS -G -o /tmp/logs.json -w '%{http_code}' \
            "${RENDER_API_BASE}/logs" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            --data-urlencode "ownerId=${owner_id}" \
            --data-urlencode "resource=${SERVICE_ID}" \
            --data-urlencode "startTime=${FAILURE_START}" \
            --data-urlencode "endTime=${FAILURE_END}" \
            --data-urlencode "direction=forward" \
            --data-urlencode "limit=100")"
          [[ "$code" == 200 ]]
          jq -r '.. | objects | (.message? // .text? // empty) | strings' /tmp/logs.json | tail -n 50 > /tmp/messages.txt || true
          sed -E \
            -e 's/\x1B\[[0-9;]*[mK]//g' \
            -e 's/(Bearer[[:space:]]+)[A-Za-z0-9._~+\/-]+/\1<redacted>/Ig' \
            -e 's/((token|secret|password|api[_-]?key|key)[=:][[:space:]]*)[^[:space:]]+/\1<redacted>/Ig' \
            -e 's#(postgres(ql)?://)[^@[:space:]]+@#\1<redacted>@#Ig' \
            /tmp/messages.txt | head -c 7000 > /tmp/safe.txt
          diag="$(cat /tmp/safe.txt | tr '\n' '|' | sed 's/`/_/g')"
          [[ -n "$diag" ]] || diag="no_message_fields_found"
          echo "diag=$diag" >> "$GITHUB_OUTPUT"

      - name: Report safe full log excerpt
        env:
          DIAG: ${{ steps.logs.outputs.diag }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook parser full deploy-window diagnostic: safe_excerpt=\`${DIAG}\`. Read-only isolated Render logs only; no Supadata or billable media endpoint was called. Production/main were not targeted."
