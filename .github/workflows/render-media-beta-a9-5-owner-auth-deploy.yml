name: Render MEDIA BETA A9.5 Owner Auth Deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/render-media-beta-a9-5-owner-auth-deploy.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: render-media-beta-a9-5-owner-auth-deploy
  cancel-in-progress: false

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  CODE_SHA: 970d7cc5819a623ec1d3cc7a70aceb44bfe311b9
  PROBE_URL: https://www.youtube.com/watch?v=IzYyKRx7Qwg

jobs:
  deploy-and-preflight:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify isolated target and deploy exact CI-green commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          echo "::add-mask::$RENDER_API_KEY"
          current_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          [[ "$current_branch" == "$REQUIRED_BRANCH" ]]

          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]]
          [[ "$(jq -r '.name // empty' "$tmp")" == "$SERVICE_NAME" ]]
          [[ "$(jq -r '.branch // empty' "$tmp")" == "$REQUIRED_BRANCH" ]]
          rm -f "$tmp"

          payload="$(jq -nc --arg commitId "$CODE_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            -X POST "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            --data "$payload")"
          [[ "$code" == 201 || "$code" == 202 ]]
          deploy_id="$(jq -r '(.deploy // .).id // empty' "$tmp")"
          rm -f "$tmp"
          test -n "$deploy_id"

          for i in $(seq 1 90); do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${deploy_id}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == 200 ]]
            status="$(jq -r '(.deploy // .).status // "unknown"' "$tmp")"
            commit="$(jq -r '(.deploy // .).commit.id // (.deploy // .).commitId // "unknown"' "$tmp")"
            rm -f "$tmp"
            if [[ "$status" == live ]]; then
              [[ "$commit" == "$CODE_SHA" ]]
              exit 0
            fi
            case "$status" in build_failed|update_failed|canceled|deactivated) exit 1 ;; esac
            sleep 5
          done
          exit 1

      - name: Verify health and bearer-only owner preflight
        shell: bash
        run: |
          set -euo pipefail
          get_env() {
            key="$1"; tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/${key}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == 200 ]] || { rm -f "$tmp"; return 1; }
            jq -r '(.envVar.value // .value // empty)' "$tmp"
            rm -f "$tmp"
          }

          health_code="$(curl -sS --max-time 60 -o /tmp/health.json -w '%{http_code}' \
            "${BETA_BASE_URL}/api/v1/health")"
          [[ "$health_code" == 200 ]]
          [[ "$(jq -r '.status // empty' /tmp/health.json)" == ok ]]

          action_token="$(get_env KRC_MEDIA_ACTION_TOKEN)"
          test -n "$action_token"
          echo "::add-mask::$action_token"

          cap_code="$(curl -sS --max-time 60 -o /tmp/cap.json -w '%{http_code}' \
            "${BETA_BASE_URL}/api/v1/media/managed" \
            -H "Authorization: Bearer ${action_token}")"
          [[ "$cap_code" == 200 ]]
          jq -e '.configured == true and .user_beta_access_code_required == false and .owner_access_injected_server_side == true and .credit_preflight_required == true and .automatic_ai_fallback == false' /tmp/cap.json >/dev/null

          payload="$(jq -nc --arg url "$PROBE_URL" '{url:$url,language_hint:"ru"}')"
          preflight_code="$(curl -sS --max-time 60 -o /tmp/preflight.json -w '%{http_code}' \
            -X POST "${BETA_BASE_URL}/api/v1/media/managed/preflight" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${action_token}" \
            --data "$payload")"
          [[ "$preflight_code" == 200 ]]
          jq -e '.provider == "supadata" and .mode == "native" and .estimated_credits == 1 and .consent_required == true' /tmp/preflight.json >/dev/null
          available="$(jq -r '.credits_available' /tmp/preflight.json)"
          after="$(jq -r '.credits_after_estimate' /tmp/preflight.json)"

          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.5 owner-auth zero-client preflight: **SUCCESS**. Live code: \`${CODE_SHA}\`; isolated target only; health: \`ok\`; user beta access code required: \`false\`; server owner admission: \`true\`; provider: \`supadata/native\`; estimated cost: \`1\`; credits available: \`${available}\`; estimated after: \`${after}\`. This acceptance called managed capability/preflight only; it did **not** call the transcript endpoint and spent no transcript credit. Production/main were not targeted."
