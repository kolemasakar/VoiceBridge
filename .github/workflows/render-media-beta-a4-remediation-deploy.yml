name: Render MEDIA BETA A4 Remediation Deploy
# A4 remediation: final created_at continuity restart regression.

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/render-media-beta-a4-remediation-deploy.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  patch-validate-deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: srv-da1kic5bedkc73d6fk60
      HEALTH_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com/api/v1/health
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/krc-media-transcript
          fetch-depth: 0

      - name: Patch live created_at projections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/cloud/src/media_client_http.ts')
          text = path.read_text(encoding='utf-8')

          old = '''    const externalJob = externalizeJob(liveJob, externalJobId);\n    const segments = externalJob.status === "COMPLETED"'''
          new = '''    const externalJob = {\n      ...externalizeJob(liveJob, externalJobId),\n      created_at: record.job.created_at\n    };\n    const segments = externalJob.status === "COMPLETED"'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('saveLiveSnapshot projection target not found')

          old = '''        const externalJob = externalizeJob(job, externalJobId);\n        if (record) {\n          await saveRecord({\n            ...record,\n            job: externalJob,\n            internalJobId: null,'''
          new = '''        const externalJob = record\n          ? {\n              ...externalizeJob(job, externalJobId),\n              created_at: record.job.created_at\n            }\n          : externalizeJob(job, externalJobId);\n        if (record) {\n          await saveRecord({\n            ...record,\n            job: externalJob,\n            internalJobId: null,'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('captions projection target not found')

          old = '''        const externalJob = externalizeJob(job, externalJobId);\n        if (record) {\n          await saveRecord({\n            ...record,\n            job: externalJob,\n            internalJobId: liveJobId === externalJobId ? null : liveJobId,'''
          new = '''        const externalJob = record\n          ? {\n              ...externalizeJob(job, externalJobId),\n              created_at: record.job.created_at\n            }\n          : externalizeJob(job, externalJobId);\n        if (record) {\n          await saveRecord({\n            ...record,\n            job: externalJob,\n            internalJobId: liveJobId === externalJobId ? null : liveJobId,'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('audio projection target not found')

          path.write_text(text, encoding='utf-8')
          PY

          cat > src/cloud/tests/media_client_created_at_projection_contract.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import { join } from "node:path";
          import { test } from "node:test";

          test("live durable job projections preserve external created_at", async () => {
            const source = await readFile(
              join(process.cwd(), "src", "media_client_http.ts"),
              "utf8"
            );
            const matches = source.match(/created_at: record\.job\.created_at/g) ?? [];
            assert.ok(matches.length >= 3);
          });
          EOF

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/cloud/package-lock.json

      - name: Validate cloud patch
        working-directory: src/cloud
        run: npm ci && npm run check

      - name: Commit projection fix
        id: code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cloud/src/media_client_http.ts src/cloud/tests/media_client_created_at_projection_contract.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve MEDIA BETA created_at in live projections'
            git push origin HEAD:agent/krc-media-transcript
          fi
          code_sha="$(git rev-parse HEAD)"
          echo "code_sha=$code_sha" >> "$GITHUB_OUTPUT"
          echo "Validated code commit: $code_sha"

      - name: Trigger isolated beta deploy
        id: deploy
        env:
          CODE_SHA: ${{ steps.code.outputs.code_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}" || { echo 'RENDER_API_KEY missing' >&2; exit 1; }
          payload="$(jq -nc --arg commitId "$CODE_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            --data "$payload")"
          [[ "$code" == 201 || "$code" == 202 ]] || { echo "Deploy request failed HTTP $code" >&2; cat "$tmp" >&2; rm -f "$tmp"; exit 1; }
          id="$(jq -r '(.deploy // .).id // empty' "$tmp")"
          rm -f "$tmp"
          test -n "$id" || { echo 'Deploy id missing' >&2; exit 1; }
          echo "deploy_id=$id" >> "$GITHUB_OUTPUT"
          echo "Beta deploy accepted: $id"
          echo "Code commit: $CODE_SHA"

      - name: Wait for beta deploy
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == 200 ]] || { rm -f "$tmp"; echo "Deploy status HTTP $code" >&2; exit 1; }
            status="$(jq -r '(.deploy // .).status // "unknown"' "$tmp")"
            rm -f "$tmp"
            echo "Deploy status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 5
          done
          echo 'Timed out waiting for deploy' >&2
          exit 1

      - name: Verify beta health
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 3 --retry-delay 3 --max-time 60 -o /tmp/health.json -w '%{http_code}' "$HEALTH_URL")"
          echo "Beta health HTTP: $code"
          [[ "$code" == 200 ]]
          jq -e '.status == "ok" and .capabilities.media_transcript.configured == true and .capabilities.media_client_ingest.durable_store == "postgres"' /tmp/health.json >/dev/null
          echo 'Beta health/durable store: PASS'

      - name: Report isolated remediation to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_STATUS: ${{ job.status }}
          CODE_SHA: ${{ steps.code.outputs.code_sha }}
        shell: bash
        run: |
          set -euo pipefail
          code_sha="${CODE_SHA:-not-created}"
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "MEDIA BETA A4 created_at HTTP projection remediation: **${WORKFLOW_STATUS^^}**. Code commit: \`${code_sha}\`. Target: \`voicebridge-krc-media-beta-kolemasakar\`. Production was not targeted."
