name: KRC MEDIA Consent Credit Quota Hardening
on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/krc-media-consent-credit-quota-hardening.yml
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: krc_media_quota_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d krc_media_quota_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/krc-media-transcript"
          git merge-base --is-ancestor ea65c5f7c7b4d079500601af07bace920ad7eb80 HEAD
          test -f scripts/krc_media_consent_credit_quota_hardening.py
      - name: Prepare hardening
        shell: bash
        run: |
          set -euo pipefail
          python scripts/krc_media_consent_credit_quota_hardening.py
          sed -i 's/download_url: "https:\/\/example.oaiusercontent.com\/file-quota"/download_link: "https:\/\/example.oaiusercontent.com\/file-quota"/' src/cloud/tests/managed_media_consent_credit_quota.test.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run full cloud validation
        working-directory: src/cloud
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
      - name: Validate PostgreSQL 18 durable quota ledger
        working-directory: src/cloud
        env:
          KRC_QUOTA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/krc_media_quota_test?sslmode=disable
        shell: bash
        run: |
          set -euo pipefail
          server_version="$(psql "$KRC_QUOTA_TEST_DATABASE_URL" -Atc 'show server_version_num')"
          test "$server_version" -ge 180000
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { ManagedMediaPersistentStore } from './dist/src/managed_media_persistence.js';
          const url = process.env.KRC_QUOTA_TEST_DATABASE_URL;
          const store = new ManagedMediaPersistentStore(url);
          await store.ready();
          const day = '2026-08-29';
          assert.deepEqual(
            await store.reserveSttSeconds('KRCM_quota-a', day, 40, 60),
            { allowed: true, used_seconds: 40, remaining_seconds: 20 }
          );
          assert.deepEqual(
            await store.reserveSttSeconds('KRCM_quota-a', day, 40, 60),
            { allowed: true, used_seconds: 40, remaining_seconds: 20 }
          );
          assert.deepEqual(
            await store.reserveSttSeconds('KRCM_quota-b', day, 21, 60),
            { allowed: false, used_seconds: 40, remaining_seconds: 20 }
          );
          assert.deepEqual(
            await store.reserveSttSeconds('KRCM_quota-b', day, 20, 60),
            { allowed: true, used_seconds: 60, remaining_seconds: 0 }
          );
          const nextDay = '2026-08-30';
          const concurrent = await Promise.all([
            store.reserveSttSeconds('KRCM_quota-c', nextDay, 40, 60),
            store.reserveSttSeconds('KRCM_quota-d', nextDay, 40, 60)
          ]);
          assert.equal(concurrent.filter((item) => item.allowed).length, 1);
          assert.equal(concurrent.filter((item) => !item.allowed).length, 1);
          assert.ok(concurrent.every((item) => item.used_seconds === 40));
          console.log('DURABLE_STT_QUOTA_LEDGER=PASS');
          NODE
          test "$(psql "$KRC_QUOTA_TEST_DATABASE_URL" -Atc "select coalesce(sum(seconds),0) from krc_media_stt_charges where day_utc='2026-08-29'::date")" = 60
          test "$(psql "$KRC_QUOTA_TEST_DATABASE_URL" -Atc "select coalesce(sum(seconds),0) from krc_media_stt_charges where day_utc='2026-08-30'::date")" = 40
      - name: Commit accepted hardening and remove temporary harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/krc-media-consent-credit-quota-hardening.yml
          git rm scripts/krc_media_consent_credit_quota_hardening.py
          git add src/cloud/src/media_beta.ts src/cloud/src/managed_media_service.ts src/cloud/src/managed_media_persistence.ts src/cloud/src/facebook_managed_pipeline.ts src/cloud/src/telegram_managed_pipeline.ts src/cloud/src/attachment_managed_pipeline.ts src/cloud/tests/managed_media_consent_credit_quota.test.ts
          git commit -m "Harden managed media consent credit and durable quota boundaries"
          git push origin HEAD:agent/krc-media-transcript
