name: A9.6 Facebook AI Post-Failure Diagnostic

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-ai-post-failure-diagnostic.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  FACEBOOK_URL: https://www.facebook.com/reel/1114235920664408

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read isolated state only
        id: diag
        shell: bash
        run: |
          set +e
          rc=0
          reason="none"
          balance="unknown"
          status="unknown"
          provider_mode="unknown"
          credits="unknown"
          uncertain="unknown"
          segments="unknown"
          chars="unknown"
          metadata="unknown"
          duration="unknown"
          ceiling="unknown"
          error_code="none"

          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            rc=1; reason="render_key_missing"
          else
            echo "::add-mask::$RENDER_API_KEY"
          fi

          if [[ $rc -eq 0 ]]; then
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
            name="$(jq -r '.name // empty' "$tmp" 2>/dev/null)"
            branch="$(jq -r '.branch // empty' "$tmp" 2>/dev/null)"
            rm -f "$tmp"
            if [[ "$code" != 200 || "$name" != "$SERVICE_NAME" || "$branch" != "$REQUIRED_BRANCH" ]]; then rc=1; reason="isolation_guard_failed"; fi
          fi

          if [[ $rc -eq 0 ]]; then
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
            token="$(jq -r '(.envVar.value // .value // empty)' "$tmp" 2>/dev/null)"
            rm -f "$tmp"
            if [[ "$code" != 200 || -z "$token" ]]; then rc=1; reason="action_token_lookup_failed"; else echo "::add-mask::$token"; fi
          fi

          if [[ $rc -eq 0 ]]; then
            payload="$(jq -nc --arg url "$FACEBOOK_URL" '{url:$url,language_hint:"auto"}')"
            code="$(curl -sS --max-time 60 -o /tmp/free.json -w '%{http_code}' -X POST "${BETA_BASE_URL}/api/v1/media/managed/preflight" -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer ${token}" --data "$payload")"
            if [[ "$code" == 200 ]]; then
              balance="$(jq -r '.credits_available // "unknown"' /tmp/free.json)"
            else
              rc=1; reason="free_preflight_failed"
            fi
          fi

          if [[ $rc -eq 0 ]]; then
            payload="$(jq -nc --arg url "$FACEBOOK_URL" '{url:$url,language_hint:"auto"}')"
            code="$(curl -sS --max-time 60 -o /tmp/lookup.json -w '%{http_code}' -X POST "${BETA_BASE_URL}/api/v1/media/managed/lookup" -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer ${token}" --data "$payload")"
            if [[ "$code" == 200 ]]; then
              status="$(jq -r '.status // "unknown"' /tmp/lookup.json)"
              provider_mode="$(jq -r '.provider_mode // "unknown"' /tmp/lookup.json)"
              credits="$(jq -r '.credits_charged // "unknown"' /tmp/lookup.json)"
              uncertain="$(jq -r '.credit_charge_uncertain // "unknown"' /tmp/lookup.json)"
              segments="$(jq -r '.segment_count // "unknown"' /tmp/lookup.json)"
              chars="$(jq -r '.transcript_characters // "unknown"' /tmp/lookup.json)"
              metadata="$(jq -r '.metadata_credits_charged // "unknown"' /tmp/lookup.json)"
              duration="$(jq -r '.media_duration_seconds // "unknown"' /tmp/lookup.json)"
              ceiling="$(jq -r '.ai_credit_ceiling // "unknown"' /tmp/lookup.json)"
              error_code="$(jq -r '.error.code // "none"' /tmp/lookup.json)"
            else
              rc=1; reason="managed_lookup_failed"
            fi
          fi

          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "balance=$balance" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "provider_mode=$provider_mode" >> "$GITHUB_OUTPUT"
          echo "credits=$credits" >> "$GITHUB_OUTPUT"
          echo "uncertain=$uncertain" >> "$GITHUB_OUTPUT"
          echo "segments=$segments" >> "$GITHUB_OUTPUT"
          echo "chars=$chars" >> "$GITHUB_OUTPUT"
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "ceiling=$ceiling" >> "$GITHUB_OUTPUT"
          echo "error_code=$error_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report safe diagnostic
        env:
          RC: ${{ steps.diag.outputs.rc }}
          REASON: ${{ steps.diag.outputs.reason }}
          BALANCE: ${{ steps.diag.outputs.balance }}
          STATUS: ${{ steps.diag.outputs.status }}
          PROVIDER_MODE: ${{ steps.diag.outputs.provider_mode }}
          CREDITS: ${{ steps.diag.outputs.credits }}
          UNCERTAIN: ${{ steps.diag.outputs.uncertain }}
          SEGMENTS: ${{ steps.diag.outputs.segments }}
          CHARS: ${{ steps.diag.outputs.chars }}
          METADATA: ${{ steps.diag.outputs.metadata }}
          DURATION: ${{ steps.diag.outputs.duration }}
          CEILING: ${{ steps.diag.outputs.ceiling }}
          ERROR_CODE: ${{ steps.diag.outputs.error_code }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook AI post-failure diagnostic: rc=\`${RC}\`, reason=\`${REASON}\`, provider_balance=\`${BALANCE}\`, status=\`${STATUS}\`, provider_mode=\`${PROVIDER_MODE}\`, cumulative_credits=\`${CREDITS}\`, credit_charge_uncertain=\`${UNCERTAIN}\`, segments=\`${SEGMENTS}\`, transcript_characters=\`${CHARS}\`, metadata_credits=\`${METADATA}\`, duration_seconds=\`${DURATION}\`, ai_credit_ceiling=\`${CEILING}\`, error_code=\`${ERROR_CODE}\`. Read-only lookup plus free preflight only; no transcript, metadata, or AI start request was executed. Production/main were not targeted."
