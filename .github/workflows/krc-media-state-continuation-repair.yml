name: KRC MEDIA State Continuation Repair
on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/krc-media-state-continuation-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch continuation guards
        shell: bash
        run: |
          set -euo pipefail
          test -f src/cloud/tests/managed_media_state_continuation_negative_matrix.test.ts
          python - <<'PY'
          from pathlib import Path
          p = Path('src/cloud/src/managed_media_service.ts')
          s = p.read_text()
          needle = '      record.job.provider_mode !== "facebook_retrieval_stt" ||\n      record.job.status !== "AWAITING_RETRIEVAL_CONSENT"'
          replacement = '      managedMediaPlatform(record.job.source_url) !== "facebook" ||\n      record.job.provider_mode !== "facebook_retrieval_stt" ||\n      record.job.status !== "AWAITING_RETRIEVAL_CONSENT"'
          if s.count(needle) != 2:
              raise SystemExit(f'unexpected Facebook guard count: {s.count(needle)}')
          s = s.replace(needle, replacement)
          retry = '        retryTarget.job.status !== "FAILED" ||\n        retryTarget.job.source_url !== sourceUrl ||\n        retryTarget.job.language_hint !== input.language_hint'
          retry_new = '        retryTarget.job.status !== "FAILED" ||\n        retryTarget.job.provider_mode !== "native" ||\n        retryTarget.job.source_url !== sourceUrl ||\n        retryTarget.job.language_hint !== input.language_hint'
          if s.count(retry) != 1:
              raise SystemExit('native retry guard not found exactly once')
          p.write_text(s.replace(retry, retry_new, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate cloud
        working-directory: src/cloud
        shell: bash
        run: |
          npm ci
          npm run check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/krc-media-state-continuation-repair.yml
          git add src/cloud/src/managed_media_service.ts
          git commit -m "Harden managed media state continuation boundaries"
          git push origin HEAD:agent/krc-media-transcript
