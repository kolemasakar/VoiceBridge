name: A9.7-G2 Wire Cobalt Approved

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/a9-7-g2-wire-cobalt-approved.yml
      - .github/triggers/a9-7-g2-wire-cobalt-approved.txt

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: a9-7-g2-wire-cobalt-approved
  cancel-in-progress: false

jobs:
  wire:
    if: github.event.pull_request.number == 28
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      RENDER_API_BASE: https://api.render.com/v1
      COBALT_SERVICE_ID: srv-da5ggq6k1f9s738j8d8g
      COBALT_SERVICE_URL: https://krc-cobalt-media-beta-kolemasakar.onrender.com
      VOICEBRIDGE_SERVICE_ID: srv-da1kic5bedkc73d6fk60
      VOICEBRIDGE_SERVICE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
      EXACT_RUNTIME_SHA: e5e2d968d87c6fdbefbcad70ecd05395cf61cec1
    steps:
      - name: Wire Cobalt into isolated VoiceBridge and deploy exact runtime SHA
        id: wire
        shell: bash
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?RENDER_API_KEY required}"
          echo "::add-mask::$RENDER_API_KEY"
          api=(-H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")

          # Verify the existing isolated Cobalt service before copying its credential.
          curl -fsS "${RENDER_API_BASE}/services/${COBALT_SERVICE_ID}" "${api[@]}" > /tmp/cobalt-service.json
          [[ "$(jq -r '.name // empty' /tmp/cobalt-service.json)" == "krc-cobalt-media-beta-kolemasakar" ]]
          [[ "$(jq -r '.type // empty' /tmp/cobalt-service.json)" == "web_service" ]]
          [[ "$(jq -r '.serviceDetails.plan // .plan // empty' /tmp/cobalt-service.json)" == "free" ]]
          [[ "$(jq -r '.serviceDetails.region // .region // empty' /tmp/cobalt-service.json)" == "frankfurt" ]]

          health_http="$(curl -sS --max-time 30 -o /tmp/cobalt-health.json -w '%{http_code}' "${COBALT_SERVICE_URL}/" || true)"
          [[ "$health_http" == 200 ]]
          unauth_http="$(curl -sS --max-time 30 -o /tmp/cobalt-unauth.json -w '%{http_code}' \
            -X POST "${COBALT_SERVICE_URL}/" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"url":"https://cobalt-auth-gate.invalid/"}' || true)"
          unauth_code="$(jq -r '.error.code // .error // empty' /tmp/cobalt-unauth.json 2>/dev/null || true)"
          [[ "$unauth_http" == 400 ]]
          [[ "$unauth_code" == "error.api.auth.key.missing" ]]

          # Retrieve the existing Render secret file without printing its contents.
          curl -fsS "${RENDER_API_BASE}/services/${COBALT_SERVICE_ID}/secret-files/cobalt-keys.json" "${api[@]}" > /tmp/cobalt-secret-response.json
          secret_content="$(jq -r '.content // .secretFile.content // .secret_file.content // .value // empty' /tmp/cobalt-secret-response.json)"
          [[ -n "$secret_content" ]]
          cobalt_key="$(printf '%s' "$secret_content" | jq -r 'if type == "object" and (keys|length)==1 then keys[0] else empty end')"
          [[ "$cobalt_key" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]
          printf '%s' "$secret_content" | jq -e --arg k "$cobalt_key" '.[$k].allowedServices | index("facebook") != null' >/dev/null
          echo "::add-mask::$cobalt_key"

          # Retrieve the existing private Action bearer only for the post-deploy read-only capability check.
          curl -fsS "${RENDER_API_BASE}/services/${VOICEBRIDGE_SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" "${api[@]}" > /tmp/action-token-response.json
          action_token="$(jq -r '.value // .envVar.value // .env_var.value // empty' /tmp/action-token-response.json)"
          [[ -n "$action_token" ]]
          echo "::add-mask::$action_token"

          # Update only the two isolated VoiceBridge variables. Render does not auto-deploy these PUTs.
          jq -n --arg value "$COBALT_SERVICE_URL" '{value:$value}' > /tmp/endpoint-put.json
          curl -fsS -X PUT "${RENDER_API_BASE}/services/${VOICEBRIDGE_SERVICE_ID}/env-vars/KRC_MEDIA_COBALT_ENDPOINT" \
            "${api[@]}" -H 'Content-Type: application/json' --data-binary @/tmp/endpoint-put.json > /tmp/endpoint-put-response.json
          jq -n --arg value "$cobalt_key" '{value:$value}' > /tmp/key-put.json
          curl -fsS -X PUT "${RENDER_API_BASE}/services/${VOICEBRIDGE_SERVICE_ID}/env-vars/KRC_MEDIA_COBALT_API_KEY" \
            "${api[@]}" -H 'Content-Type: application/json' --data-binary @/tmp/key-put.json > /tmp/key-put-response.json

          # Read back and compare without printing secret values.
          curl -fsS "${RENDER_API_BASE}/services/${VOICEBRIDGE_SERVICE_ID}/env-vars/KRC_MEDIA_COBALT_ENDPOINT" "${api[@]}" > /tmp/endpoint-get.json
          endpoint_seen="$(jq -r '.value // .envVar.value // .env_var.value // empty' /tmp/endpoint-get.json)"
          [[ "$endpoint_seen" == "$COBALT_SERVICE_URL" ]]
          curl -fsS "${RENDER_API_BASE}/services/${VOICEBRIDGE_SERVICE_ID}/env-vars/KRC_MEDIA_COBALT_API_KEY" "${api[@]}" > /tmp/key-get.json
          key_seen="$(jq -r '.value // .envVar.value // .env_var.value // empty' /tmp/key-get.json)"
          [[ "$key_seen" == "$cobalt_key" ]]
          echo "::add-mask::$key_seen"

          # Deploy exactly the previously accepted A9.7-C runtime commit, never branch HEAD.
          jq -n --arg commitId "$EXACT_RUNTIME_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}' > /tmp/deploy-request.json
          deploy_http="$(curl -sS -o /tmp/deploy-create.json -w '%{http_code}' -X POST \
            "${RENDER_API_BASE}/services/${VOICEBRIDGE_SERVICE_ID}/deploys" \
            "${api[@]}" -H 'Content-Type: application/json' --data-binary @/tmp/deploy-request.json)"
          [[ "$deploy_http" == 201 || "$deploy_http" == 202 ]]
          deploy_id="$(jq -r '.id // .deploy.id // empty' /tmp/deploy-create.json)"
          [[ -n "$deploy_id" ]]

          deploy_status=unknown
          deploy_commit=unknown
          for _ in $(seq 1 120); do
            curl -fsS "${RENDER_API_BASE}/services/${VOICEBRIDGE_SERVICE_ID}/deploys/${deploy_id}" "${api[@]}" > /tmp/deploy.json
            deploy_status="$(jq -r '.status // .deploy.status // "unknown"' /tmp/deploy.json)"
            deploy_commit="$(jq -r '.commit.id // .commitId // .deploy.commit.id // .deploy.commitId // "unknown"' /tmp/deploy.json)"
            case "$deploy_status" in
              live|build_failed|update_failed|canceled|deactivated) break ;;
            esac
            sleep 5
          done
          [[ "$deploy_status" == live ]]
          if [[ "$deploy_commit" != unknown && "$deploy_commit" != "$EXACT_RUNTIME_SHA" ]]; then
            echo 'Unexpected deployed commit.' >&2
            exit 1
          fi

          vb_health=000
          for _ in $(seq 1 30); do
            vb_health="$(curl -sS --max-time 30 -o /tmp/vb-health.json -w '%{http_code}' "${VOICEBRIDGE_SERVICE_URL}/api/v1/health" || true)"
            [[ "$vb_health" == 200 ]] && break
            sleep 4
          done
          [[ "$vb_health" == 200 ]]

          capability_http="$(curl -sS --max-time 30 -o /tmp/capability.json -w '%{http_code}' \
            "${VOICEBRIDGE_SERVICE_URL}/api/v1/media/managed" \
            -H "Authorization: Bearer ${action_token}" \
            -H 'Accept: application/json' || true)"
          [[ "$capability_http" == 200 ]]
          jq -e '
            .facebook_retrieval_stt_fallback == true and
            .facebook_free_retrieval_provider == "cobalt" and
            .facebook_free_retrieval_configured == true and
            .facebook_paid_retrieval_provider == "scrapecreators" and
            .facebook_paid_retrieval_configured == false and
            .facebook_automatic_paid_retrieval == false and
            .facebook_stt_provider == "assemblyai" and
            .facebook_stt_configured == true
          ' /tmp/capability.json >/dev/null

          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "deploy_status=$deploy_status" >> "$GITHUB_OUTPUT"
          echo "deploy_commit=$deploy_commit" >> "$GITHUB_OUTPUT"
          echo "cobalt_health=$health_http" >> "$GITHUB_OUTPUT"
          echo "cobalt_unauth_http=$unauth_http" >> "$GITHUB_OUTPUT"
          echo "cobalt_unauth_code=$unauth_code" >> "$GITHUB_OUTPUT"
          echo "voicebridge_health=$vb_health" >> "$GITHUB_OUTPUT"
          echo "capability_http=$capability_http" >> "$GITHUB_OUTPUT"
          echo 'facebook_free_retrieval_configured=true' >> "$GITHUB_OUTPUT"

      - name: Report A9.7-G2 result
        if: always()
        shell: bash
        env:
          DEPLOY_ID: ${{ steps.wire.outputs.deploy_id }}
          DEPLOY_STATUS: ${{ steps.wire.outputs.deploy_status }}
          DEPLOY_COMMIT: ${{ steps.wire.outputs.deploy_commit }}
          COBALT_HEALTH: ${{ steps.wire.outputs.cobalt_health }}
          COBALT_UNAUTH_HTTP: ${{ steps.wire.outputs.cobalt_unauth_http }}
          COBALT_UNAUTH_CODE: ${{ steps.wire.outputs.cobalt_unauth_code }}
          VOICEBRIDGE_HEALTH: ${{ steps.wire.outputs.voicebridge_health }}
          CAPABILITY_HTTP: ${{ steps.wire.outputs.capability_http }}
          FREE_CONFIGURED: ${{ steps.wire.outputs.facebook_free_retrieval_configured }}
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == success ]]; then result=PASS; else result=FAIL; fi
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.7-G2 isolated VoiceBridge Cobalt wiring: **${result}**. VoiceBridge service=\`srv-da1kic5bedkc73d6fk60\`; exact_runtime_sha=\`e5e2d968d87c6fdbefbcad70ecd05395cf61cec1\`; deploy=\`${DEPLOY_ID:-none}\` status=\`${DEPLOY_STATUS:-unknown}\` commit=\`${DEPLOY_COMMIT:-unknown}\`; Cobalt service=\`srv-da5ggq6k1f9s738j8d8g\`; Cobalt GET_/=\`${COBALT_HEALTH:-unknown}\`; unauth_POST=/=\`${COBALT_UNAUTH_HTTP:-unknown}\` code=\`${COBALT_UNAUTH_CODE:-none}\`; VoiceBridge health=\`${VOICEBRIDGE_HEALTH:-unknown}\`; managed capability=\`${CAPABILITY_HTTP:-unknown}\`; facebook_free_retrieval_configured=\`${FREE_CONFIGURED:-unknown}\`. Existing Cobalt UUID was transferred server-side and never printed or committed. No Facebook URL/media retrieval, AssemblyAI STT, ScrapeCreators, Supadata, production, main, or merge action was executed."
