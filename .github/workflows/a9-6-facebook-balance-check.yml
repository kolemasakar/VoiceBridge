name: A9.6 Facebook Balance Check

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-balance-check.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  FACEBOOK_URL: https://www.facebook.com/reel/1114235920664408/

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read balance using free preflight only
        id: balance
        shell: bash
        run: |
          set +e
          result=unknown
          reason=none
          preflight_http=unknown
          error_code=none
          estimated=unknown
          after=unknown
          consent=unknown
          can_continue=unknown
          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            reason=render_key_missing
          else
            echo "::add-mask::$RENDER_API_KEY"
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
            token="$(jq -r '(.envVar.value // .value // empty)' "$tmp" 2>/dev/null)"
            rm -f "$tmp"
            if [[ "$code" != 200 || -z "$token" ]]; then
              reason=token_lookup_failed
            else
              echo "::add-mask::$token"
              payload="$(jq -nc --arg url "$FACEBOOK_URL" '{url:$url,language_hint:"auto"}')"
              code="$(curl -sS --max-time 60 -o /tmp/preflight.json -w '%{http_code}' -X POST "${BETA_BASE_URL}/api/v1/media/managed/preflight" -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer ${token}" --data "$payload")"
              preflight_http="$code"
              if [[ "$code" == 200 ]]; then
                result="$(jq -r '.credits_available // "unknown"' /tmp/preflight.json)"
                estimated="$(jq -r '.estimated_credits // "unknown"' /tmp/preflight.json)"
                after="$(jq -r '.credits_after_estimate // "unknown"' /tmp/preflight.json)"
                consent="$(jq -r '.consent_required // "unknown"' /tmp/preflight.json)"
                can_continue="$(jq -r '.can_continue // "unknown"' /tmp/preflight.json)"
              else
                reason=preflight_failed
                error_code="$(jq -r '.error.code // "unknown"' /tmp/preflight.json 2>/dev/null)"
              fi
            fi
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "preflight_http=$preflight_http" >> "$GITHUB_OUTPUT"
          echo "error_code=$error_code" >> "$GITHUB_OUTPUT"
          echo "estimated=$estimated" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          echo "consent=$consent" >> "$GITHUB_OUTPUT"
          echo "can_continue=$can_continue" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report balance
        if: always()
        env:
          RESULT: ${{ steps.balance.outputs.result }}
          REASON: ${{ steps.balance.outputs.reason }}
          PREFLIGHT_HTTP: ${{ steps.balance.outputs.preflight_http }}
          ERROR_CODE: ${{ steps.balance.outputs.error_code }}
          ESTIMATED: ${{ steps.balance.outputs.estimated }}
          AFTER: ${{ steps.balance.outputs.after }}
          CONSENT: ${{ steps.balance.outputs.consent }}
          CAN_CONTINUE: ${{ steps.balance.outputs.can_continue }}
        shell: bash
        run: |
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook fresh free preflight diagnostic: provider_balance=\`${RESULT:-unknown}\`, reason=\`${REASON:-unknown}\`, preflight_http=\`${PREFLIGHT_HTTP:-unknown}\`, error_code=\`${ERROR_CODE:-unknown}\`, estimated_credits=\`${ESTIMATED:-unknown}\`, expected_after=\`${AFTER:-unknown}\`, consent_required=\`${CONSENT:-unknown}\`, can_continue=\`${CAN_CONTINUE:-unknown}\`. Free preflight only; no metadata, transcript, or AI start request was executed."

# trigger: 2026-08-23T13:06+03:00 fresh free Facebook preflight diagnostic retry
