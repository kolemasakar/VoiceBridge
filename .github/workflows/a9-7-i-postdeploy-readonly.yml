name: A9.7-I Postdeploy Read-only Verify

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-7-i-postdeploy-readonly.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_API_BASE: https://api.render.com/v1
      SERVICE_ID: srv-da1kic5bedkc73d6fk60
      BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
      EXPECTED_SHA: 5246be583101ca9693e356da3b5c3f42687e577e
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read deployed commit
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          echo "::add-mask::$RENDER_API_KEY"
          curl -sS --get "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" \
            --data-urlencode 'limit=1' \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/deploys.json
          status="$(jq -r '.[0] | (.deploy // .).status // "unknown"' /tmp/deploys.json)"
          sha="$(jq -r '.[0] | (.deploy // .).commit.id // (.deploy // .).commitId // "unknown"' /tmp/deploys.json)"
          [[ "$status" == "live" ]]
          [[ "$sha" == "$EXPECTED_SHA" ]]
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Read health and managed capability only
        id: read
        shell: bash
        run: |
          set -euo pipefail
          health_http="$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' \
            "${BETA_BASE_URL}/api/v1/health")"
          [[ "$health_http" == "200" ]]
          jq -e '.status == "ok" and .service == "voicebridge-cloud"' /tmp/health.json >/dev/null

          curl -sS "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/env.json
          token="$(jq -r '(.envVar.value // .value // empty)' /tmp/env.json)"
          test -n "$token"
          echo "::add-mask::$token"

          capability_http="$(curl -sS --max-time 20 -o /tmp/capability.json -w '%{http_code}' \
            "${BETA_BASE_URL}/api/v1/media/managed" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${token}")"
          [[ "$capability_http" == "200" ]]
          jq -e '.configured == true and .facebook_retrieval_stt_fallback == true and .facebook_free_retrieval_provider == "cobalt" and .facebook_automatic_paid_retrieval == false' /tmp/capability.json >/dev/null

          echo "health_http=$health_http" >> "$GITHUB_OUTPUT"
          echo "capability_http=$capability_http" >> "$GITHUB_OUTPUT"
          echo "health_status=$(jq -r '.status // "unknown"' /tmp/health.json)" >> "$GITHUB_OUTPUT"
          echo "cobalt_configured=$(jq -r '.facebook_free_retrieval_configured // false' /tmp/capability.json)" >> "$GITHUB_OUTPUT"
          echo "scrapecreators_configured=$(jq -r '.facebook_paid_retrieval_configured // false' /tmp/capability.json)" >> "$GITHUB_OUTPUT"
          echo "assemblyai_configured=$(jq -r '.facebook_stt_configured // false' /tmp/capability.json)" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then result=PASS; else result=FAIL; fi
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.7-I postdeploy read-only verify: **${result}**. expected_sha=\`${EXPECTED_SHA}\`, deployed_sha=\`${{ steps.deploy.outputs.sha }}\`, deploy_status=\`${{ steps.deploy.outputs.status }}\`, health_http=\`${{ steps.read.outputs.health_http }}\`, health_status=\`${{ steps.read.outputs.health_status }}\`, capability_http=\`${{ steps.read.outputs.capability_http }}\`, cobalt_configured=\`${{ steps.read.outputs.cobalt_configured }}\`, scrapecreators_configured=\`${{ steps.read.outputs.scrapecreators_configured }}\`, assemblyai_configured=\`${{ steps.read.outputs.assemblyai_configured }}\`. Read-only Render/service health+capability only. No Facebook, Cobalt, AssemblyAI, Supadata, ScrapeCreators, preflight, transcript, metadata, AI, or media processing endpoint was called. Production/main/merge were not targeted."
