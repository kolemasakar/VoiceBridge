name: A9.6 Facebook Response Shape Hardening Runner

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/triggers/a9-6-response-shape-hardening.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: a9-6-facebook-response-shape-hardening-runner
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout isolated beta branch
        uses: actions/checkout@v4
        with:
          ref: agent/krc-media-transcript
          fetch-depth: 0

      - name: Apply deterministic patch
        id: patch
        continue-on-error: true
        run: python scripts/a9_6_response_shape_hardening.py

      - name: Build and test full cloud suite
        id: check
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        working-directory: src/cloud
        run: |
          set -euo pipefail
          npm ci
          npm run check

      - name: Verify exact patch scope
        id: scope
        if: steps.patch.outcome == 'success' && steps.check.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t files < <(git diff --name-only)
          printf '%s\n' "${files[@]}"
          [[ "${#files[@]}" -eq 2 ]]
          [[ " ${files[*]} " == *" src/cloud/src/supadata_provider.ts "* ]]
          [[ " ${files[*]} " == *" src/cloud/tests/supadata_provider.test.ts "* ]]

      - name: Commit validated hardening
        id: commit
        if: steps.patch.outcome == 'success' && steps.check.outcome == 'success' && steps.scope.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloud/src/supadata_provider.ts src/cloud/tests/supadata_provider.test.ts
          git commit -m "A9.6: harden Supadata response-shape parsing"
          git push origin HEAD:agent/krc-media-transcript
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          set -euo pipefail
          if [[ "$PATCH_OUTCOME" == "success" && "$CHECK_OUTCOME" == "success" && "$SCOPE_OUTCOME" == "success" && "$COMMIT_OUTCOME" == "success" ]]; then
            body="A9.6 Supadata response-shape hardening: **PASS**. Commit=\`${COMMIT_SHA}\`. patch=\`${PATCH_OUTCOME}\`, cloud_check=\`${CHECK_OUTCOME}\`, scope=\`${SCOPE_OUTCOME}\`, commit=\`${COMMIT_OUTCOME}\`. Bounded recursive result unwrapping, chunk-language fallback, normalized async status handling, and shape-only invalid-payload diagnostics added. Diagnostics contain structure/types only and do not log transcript text. No Supadata/provider/preflight/transcript/metadata/AI endpoint was called. Production/main were not targeted."
          else
            body="A9.6 Supadata response-shape hardening: **FAILURE**. patch=\`${PATCH_OUTCOME}\`, cloud_check=\`${CHECK_OUTCOME}\`, scope=\`${SCOPE_OUTCOME}\`, commit=\`${COMMIT_OUTCOME}\`. No Supadata/provider/preflight/transcript/metadata/AI endpoint was called. Production/main were not targeted."
          fi
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "$body"

      - name: Fail job if validation did not pass
        if: always()
        run: |
          [[ "${{ steps.patch.outcome }}" == "success" ]]
          [[ "${{ steps.check.outcome }}" == "success" ]]
          [[ "${{ steps.scope.outcome }}" == "success" ]]
          [[ "${{ steps.commit.outcome }}" == "success" ]]
