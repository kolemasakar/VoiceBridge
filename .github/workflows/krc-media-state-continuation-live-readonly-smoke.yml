name: KRC MEDIA State Continuation Live Read-Only Smoke
on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/krc-media-state-continuation-live-readonly-smoke.yml
permissions:
  contents: read
env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  HARDENED_SHA: 8da6011cbd8f1134f125266951eebaef894be31c
jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      KRC_NEON_DATABASE_URL: ${{ secrets.KRC_NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated target and Neon store
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"; test -n "${KRC_NEON_DATABASE_URL:-}"
          echo "::add-mask::$RENDER_API_KEY"; echo "::add-mask::$KRC_NEON_DATABASE_URL"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}" -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]]; [[ "$(jq -r '.name' "$tmp")" == "$SERVICE_NAME" ]]; [[ "$(jq -r '.branch' "$tmp")" == "$REQUIRED_BRANCH" ]]; rm -f "$tmp"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_DATABASE_URL" -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]]; current_db="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"; rm -f "$tmp"
          test -n "$current_db"; echo "::add-mask::$current_db"; [[ "$current_db" == "$KRC_NEON_DATABASE_URL" ]]
      - name: Deploy exact hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"; payload="$(jq -nc --arg commitId "$HARDENED_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" -H 'Content-Type: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}" --data "$payload")"
          [[ "$code" == 201 || "$code" == 202 ]]; deploy_id="$(jq -r '(.deploy // .).id // empty' "$tmp")"; rm -f "$tmp"; test -n "$deploy_id"
          live=0
          for i in $(seq 1 150); do
            tmp="$(mktemp)"; code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${deploy_id}" -H "Authorization: Bearer ${RENDER_API_KEY}")"; [[ "$code" == 200 ]]
            status="$(jq -r '(.deploy // .).status // "unknown"' "$tmp")"; commit="$(jq -r '(.deploy // .).commit.id // (.deploy // .).commitId // "unknown"' "$tmp")"; rm -f "$tmp"
            if [[ "$status" == live ]]; then [[ "$commit" == "$HARDENED_SHA" ]]; live=1; break; fi
            case "$status" in build_failed|update_failed|canceled|deactivated) exit 1;; esac
            sleep 5
          done
          [[ "$live" == 1 ]]
      - name: Load masked Action bearer
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"; code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" -H "Authorization: Bearer ${RENDER_API_KEY}")"; [[ "$code" == 200 ]]
          token="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"; rm -f "$tmp"; test -n "$token"; echo "::add-mask::$token"; umask 077; printf '%s' "$token" >/tmp/krc-token
      - name: Run read-only unknown-job continuation matrix
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/krc-token)"; echo "::add-mask::$token"
          job_id="KRCM_state-continuation-readonly-$(date +%s)-$RANDOM"
          check404(){ label="$1"; path="$2"; out="/tmp/${label}.json"; http="$(curl -sS --max-time 60 -o "$out" -w '%{http_code}' "${BASE_URL}${path}" -H "Authorization: Bearer ${token}" -H 'Accept: application/json')"; code="$(jq -r '.error.code // empty' "$out")"; echo "$label HTTP=$http CODE=$code"; [[ "$http" == 404 && "$code" == MEDIA_TRANSCRIPT_NOT_FOUND ]]; }
          check404 job-read "/api/v1/media/managed/transcriptions/${job_id}"
          check404 segment-read "/api/v1/media/managed/transcriptions/${job_id}/segments?cursor=0&limit=20"
          check404 ai-preflight "/api/v1/media/managed/transcriptions/${job_id}/ai-preflight"
          check404 facebook-retrieval-preflight "/api/v1/media/managed/transcriptions/${job_id}/facebook-retrieval-preflight"
          check404 facebook-metadata-preflight "/api/v1/media/managed/transcriptions/${job_id}/facebook-ai-estimate-preflight"
          echo STATE_CONTINUATION_LIVE_READONLY_SMOKE=PASS
      - name: Sanitized summary
        shell: bash
        run: |
          {
            echo '# KRC MEDIA state continuation live read-only smoke'
            echo '- exact hardened runtime deployed: `PASS`'
            echo '- protected Neon durable-store target unchanged: `PASS`'
            echo '- unknown job read: `404 / MEDIA_TRANSCRIPT_NOT_FOUND`'
            echo '- unknown segment read: `404 / MEDIA_TRANSCRIPT_NOT_FOUND`'
            echo '- unknown AI preflight: `404 / MEDIA_TRANSCRIPT_NOT_FOUND`'
            echo '- unknown Facebook retrieval preflight: `404 / MEDIA_TRANSCRIPT_NOT_FOUND`'
            echo '- unknown Facebook metadata preflight: `404 / MEDIA_TRANSCRIPT_NOT_FOUND`'
            echo '- provider-consuming work: `NONE`'
            echo '- database mutation requested: `NONE`'
            echo '- Render environment mutation: `NONE`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup
        if: always()
        shell: bash
        run: sudo rm -f /tmp/krc-token /tmp/job-read.json /tmp/segment-read.json /tmp/ai-preflight.json /tmp/facebook-retrieval-preflight.json /tmp/facebook-metadata-preflight.json >/dev/null 2>&1 || true
