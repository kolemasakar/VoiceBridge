name: Fix MEDIA BETA created_at continuity

# Retrigger marker: 2026-08-18 A4.4 metadata continuity
on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/fix-media-client-created-at.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/krc-media-transcript
          fetch-depth: 0

      - name: Preserve external created_at during rehydration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/cloud/src/media_client_http.ts')
          text = path.read_text(encoding='utf-8')

          old = '''    const externalJob = externalizeJob(liveJob, externalJobId);\n    const segments = externalJob.status === "COMPLETED"'''
          new = '''    const externalJob = {\n      ...externalizeJob(liveJob, externalJobId),\n      created_at: record.job.created_at\n    };\n    const segments = externalJob.status === "COMPLETED"'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'created_at: record.job.created_at' not in text:
              raise SystemExit('saveLiveSnapshot target not found')

          old = '''        const externalJob = externalizeJob(job, externalJobId);\n        if (record) {\n          await saveRecord({\n            ...record,\n            job: externalJob,\n            internalJobId: null,'''
          new = '''        const externalJob = record\n          ? {\n              ...externalizeJob(job, externalJobId),\n              created_at: record.job.created_at\n            }\n          : externalizeJob(job, externalJobId);\n        if (record) {\n          await saveRecord({\n            ...record,\n            job: externalJob,\n            internalJobId: null,'''
          if old in text:
              text = text.replace(old, new, 1)
          elif text.count('created_at: record.job.created_at') < 2:
              raise SystemExit('captions target not found')

          old = '''        const externalJob = externalizeJob(job, externalJobId);\n        if (record) {\n          await saveRecord({\n            ...record,\n            job: externalJob,\n            internalJobId: liveJobId === externalJobId ? null : liveJobId,'''
          new = '''        const externalJob = record\n          ? {\n              ...externalizeJob(job, externalJobId),\n              created_at: record.job.created_at\n            }\n          : externalizeJob(job, externalJobId);\n        if (record) {\n          await saveRecord({\n            ...record,\n            job: externalJob,\n            internalJobId: liveJobId === externalJobId ? null : liveJobId,'''
          if old in text:
              text = text.replace(old, new, 1)
          elif text.count('created_at: record.job.created_at') < 3:
              raise SystemExit('audio target not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add regression contract test
        shell: bash
        run: |
          set -euo pipefail
          cat > src/cloud/tests/media_client_created_at_contract.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import { test } from "node:test";

          test("durable rehydration preserves external created_at in all snapshot paths", async () => {
            const source = await readFile(new URL("../src/media_client_http.ts", import.meta.url), "utf8");
            const matches = source.match(/created_at: record\.job\.created_at/g) ?? [];
            assert.equal(matches.length, 3);
          });
          EOF

      - name: Validate cloud service
        working-directory: src/cloud
        run: npm ci && npm run check

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/cloud/src/media_client_http.ts src/cloud/tests/media_client_created_at_contract.test.ts; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cloud/src/media_client_http.ts src/cloud/tests/media_client_created_at_contract.test.ts
          git commit -m 'Preserve MEDIA BETA created_at across rehydration'
          git push origin HEAD:agent/krc-media-transcript
