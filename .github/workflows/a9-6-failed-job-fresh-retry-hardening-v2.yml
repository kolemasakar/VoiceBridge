name: A9.7-B Registered Managed Facebook Patch

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/triggers/a9-6-failed-job-fresh-retry-hardening-v2.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: a9-7-b-registered-managed-facebook-patch
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4
        with:
          ref: agent/krc-media-transcript
          fetch-depth: 0

      - name: Apply A9.7-B exact patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/a9_7_b_patch.py
          echo "patch=success" >> "$GITHUB_OUTPUT"

      - name: Run full cloud check
        id: check
        shell: bash
        run: |
          set -euo pipefail
          cd src/cloud
          npm ci
          npm run check
          echo "cloud_check=success" >> "$GITHUB_OUTPUT"

      - name: Enforce source scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only)"
          printf '%s\n' "$files"
          test "$files" = "src/cloud/src/managed_media_service.ts"
          echo "scope=success" >> "$GITHUB_OUTPUT"

      - name: Commit and push tested source patch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cloud/src/managed_media_service.ts
          git commit -m "A9.7-B integrate Facebook retrieval with managed jobs"
          git push origin HEAD:agent/krc-media-transcript
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit=success" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        shell: bash
        env:
          PATCH: ${{ steps.patch.outputs.patch }}
          CHECK: ${{ steps.check.outputs.cloud_check }}
          SCOPE: ${{ steps.scope.outputs.scope }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then result=PASS; else result=FAIL; fi
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.7-B managed Facebook integration runner: **${result}**. patch=\`${PATCH:-failed}\`, cloud_check=\`${CHECK:-failed}\`, scope=\`${SCOPE:-failed}\`, commit=\`${COMMIT:-failed}\`, sha=\`${SHA:-none}\`. ManagedMediaService gains durable Facebook free-retrieval -> explicit one-credit consent -> AssemblyAI STT states. No Render, Cobalt, ScrapeCreators, Supadata, AssemblyAI, metadata, transcript, or AI external endpoint was called by this workflow. Production/main were not targeted."
