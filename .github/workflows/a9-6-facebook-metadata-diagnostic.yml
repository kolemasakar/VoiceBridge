name: A9.6 Facebook Metadata Diagnostic

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-metadata-diagnostic.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  FACEBOOK_URL: https://www.facebook.com/reel/1114235920664408/

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Safe diagnostic
        id: diag
        shell: bash
        run: |
          set +e
          stage="start"
          balance="unknown"
          job_status="unknown"
          metadata_credits="unknown"
          duration="unknown"
          ceiling="unknown"
          expires="unknown"
          reason="none"

          read_env() {
            local key="$1" tmp code value
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/${key}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            if [[ "$code" != 200 ]]; then rm -f "$tmp"; return 1; fi
            value="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
            rm -f "$tmp"
            test -n "$value" || return 1
            printf '%s' "$value"
          }

          if [[ -z "${RENDER_API_KEY:-}" ]]; then reason="render_key_missing"; rc=1
          else
            echo "::add-mask::$RENDER_API_KEY"
            rc=0
          fi

          if [[ $rc -eq 0 ]]; then
            stage="service_guard"
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              "${RENDER_API_BASE}/services/${SERVICE_ID}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            name="$(jq -r '.name // empty' "$tmp" 2>/dev/null)"
            branch="$(jq -r '.branch // empty' "$tmp" 2>/dev/null)"
            rm -f "$tmp"
            if [[ "$code" != 200 || "$name" != "$SERVICE_NAME" || "$branch" != "$REQUIRED_BRANCH" ]]; then reason="isolation_guard_failed"; rc=1; fi
          fi

          if [[ $rc -eq 0 ]]; then
            stage="credentials"
            action_token="$(read_env KRC_MEDIA_ACTION_TOKEN)" || rc=1
            database_url="$(read_env KRC_MEDIA_DATABASE_URL)" || rc=1
            if [[ $rc -ne 0 ]]; then
              reason="isolated_env_lookup_failed"
            else
              echo "::add-mask::$action_token"
              echo "::add-mask::$database_url"
            fi
          fi

          if [[ $rc -eq 0 ]]; then
            stage="balance"
            payload="$(jq -nc --arg url "$FACEBOOK_URL" '{url:$url,language_hint:"auto"}')"
            code="$(curl -sS --max-time 60 -o /tmp/free-preflight.json -w '%{http_code}' \
              -X POST "${BETA_BASE_URL}/api/v1/media/managed/preflight" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${action_token}" \
              --data "$payload")"
            if [[ "$code" != 200 ]]; then
              reason="free_preflight_failed"; rc=1
            else
              balance="$(jq -r '.credits_available // "unknown"' /tmp/free-preflight.json)"
            fi
          fi

          if [[ $rc -eq 0 ]]; then
            stage="durable_job"
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update -qq >/dev/null 2>&1
              sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1
            fi
            row="$(PGCONNECT_TIMEOUT=8 psql "$database_url" -X -A -t -F $'\t' -v ON_ERROR_STOP=1 -c \
              "SELECT status, COALESCE(payload->>'metadata_credits_charged','0'), COALESCE(payload->>'media_duration_seconds','null'), COALESCE(payload->>'ai_credit_ceiling','null'), extract(epoch from expires_at)::bigint FROM krc_managed_media_jobs WHERE payload->>'source_url'='${FACEBOOK_URL}' ORDER BY updated_at DESC LIMIT 1;" 2>/dev/null | tr -d '\r' | head -n1)"
            if [[ -z "$row" ]]; then
              reason="durable_job_not_found"; rc=1
            else
              IFS=$'\t' read -r job_status metadata_credits duration ceiling expires <<< "$row"
            fi
          fi

          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "balance=$balance" >> "$GITHUB_OUTPUT"
          echo "job_status=$job_status" >> "$GITHUB_OUTPUT"
          echo "metadata_credits=$metadata_credits" >> "$GITHUB_OUTPUT"
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "ceiling=$ceiling" >> "$GITHUB_OUTPUT"
          echo "expires=$expires" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report safe diagnostic
        env:
          STAGE: ${{ steps.diag.outputs.stage }}
          BALANCE: ${{ steps.diag.outputs.balance }}
          JOB_STATUS: ${{ steps.diag.outputs.job_status }}
          METADATA_CREDITS: ${{ steps.diag.outputs.metadata_credits }}
          DURATION: ${{ steps.diag.outputs.duration }}
          CEILING: ${{ steps.diag.outputs.ceiling }}
          EXPIRES: ${{ steps.diag.outputs.expires }}
          REASON: ${{ steps.diag.outputs.reason }}
          RC: ${{ steps.diag.outputs.rc }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook metadata safe diagnostic: stage=\`${STAGE}\`, rc=\`${RC}\`, provider_balance=\`${BALANCE}\`, job_status=\`${JOB_STATUS}\`, metadata_credits_charged=\`${METADATA_CREDITS}\`, duration_seconds=\`${DURATION}\`, ai_credit_ceiling=\`${CEILING}\`, expires_epoch=\`${EXPIRES}\`, reason=\`${REASON}\`. Diagnostic used only service/account preflight and durable-state reads; no metadata, transcript, or AI start request was executed. Production/main were not targeted."
