name: KRC MEDIA Telegram Route Hardening

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/krc-media-telegram-route-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify baseline
        run: git merge-base --is-ancestor 65d536a445126c47f2646e59ca31e12e7bd35514 HEAD

      - name: Apply Telegram route hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          http = Path("src/cloud/src/managed_media_http.ts")
          text = http.read_text()
          old = '''        if (managedMediaPlatform(input.url) === "facebook") {
          throw new MediaTranscriptError(
            "FACEBOOK_FREE_RETRIEVAL_REQUIRED",
            "Active Facebook intake uses the free Cobalt route; generic Supadata native preflight is disabled.",
            400,
            false
          );
        }
        const quote = await service.preflight(input);
'''
          new = old.replace(
            '        const quote = await service.preflight(input);\n',
            '''        if (managedMediaPlatform(input.url) === "telegram") {
          throw new MediaTranscriptError(
            "TELEGRAM_PUBLIC_RETRIEVAL_REQUIRED",
            "Active Telegram intake uses the public Telegram retrieval route; generic Supadata native preflight is disabled.",
            400,
            false
          );
        }
        const quote = await service.preflight(input);
'''
          )
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        if (managedMediaPlatform(input.url) === "facebook") {
          throw new MediaTranscriptError(
            "FACEBOOK_FREE_RETRIEVAL_REQUIRED",
            "Active Facebook intake uses the free Cobalt route; generic Supadata native processing is disabled.",
            409,
            false
          );
        }
        const job = await service.startNative(input);
'''
          new = old.replace(
            '        const job = await service.startNative(input);\n',
            '''        if (managedMediaPlatform(input.url) === "telegram") {
          throw new MediaTranscriptError(
            "TELEGRAM_PUBLIC_RETRIEVAL_REQUIRED",
            "Active Telegram intake uses the public Telegram retrieval route; generic Supadata native processing is disabled.",
            409,
            false
          );
        }
        const job = await service.startNative(input);
'''
          )
          assert text.count(old) == 1
          http.write_text(text.replace(old, new, 1))

          test_file = Path("src/cloud/tests/active_telegram_route_policy.test.ts")
          test_file.write_text(r'''import assert from "node:assert/strict";
          import { createServer } from "node:http";
          import { test } from "node:test";
          import type { AppConfig } from "../src/config.js";
          import { createManagedMediaHttpHandler } from "../src/managed_media_http.js";
          import type { ManagedMediaService } from "../src/managed_media_service.js";

          const ACTION_TOKEN = "managed-action-token-telegram-123456";
          const ACCESS_CODE = "abcdefghijkl";
          const TELEGRAM_URL = "https://t.me/techcrimes/12101";
          const CONFIG: AppConfig = {
            host: "127.0.0.1", port: 0,
            testAccessToken: "voicebridge-test-token-telegram-123456",
            mediaActionToken: ACTION_TOKEN,
            mediaBetaCodes: [ACCESS_CODE], mediaDailySttSeconds: 7200,
            assemblyAiApiKey: null, supadataApiKey: null, geminiApiKey: null,
            geminiTranslationModel: "gemini-3.1-flash-lite",
            corsAllowedOrigin: "*", maxRequestBodyBytes: 32768,
            rateLimitRequestsPerMinute: 1000
          };

          function headers(): Record<string, string> {
            return { authorization: `Bearer ${ACTION_TOKEN}`, "content-type": "application/json", connection: "close" };
          }

          test("active Telegram intake cannot enter generic Supadata native routes", async () => {
            let preflightCalls = 0;
            let nativeCalls = 0;
            const service = {
              configured: true, storeKind: "postgres", durableStore: true,
              async preflight() { preflightCalls += 1; throw new Error("unreachable"); },
              async startNative() { nativeCalls += 1; throw new Error("unreachable"); }
            } as unknown as ManagedMediaService;
            const handler = createManagedMediaHttpHandler(CONFIG, service);
            const server = createServer(async (request, response) => {
              if (await handler.handle(request, response)) return;
              response.statusCode = 404; response.end();
            });
            await new Promise<void>((resolve) => server.listen(0, "127.0.0.1", resolve));
            const address = server.address();
            assert.ok(address && typeof address === "object");
            const base = `http://127.0.0.1:${address.port}`;
            try {
              const preflight = await fetch(`${base}/api/v1/media/managed/preflight`, {
                method: "POST", headers: headers(),
                body: JSON.stringify({ url: TELEGRAM_URL, language_hint: "auto" })
              });
              assert.equal(preflight.status, 400);
              const preflightBody = await preflight.json() as { error?: { code?: string } };
              assert.equal(preflightBody.error?.code, "TELEGRAM_PUBLIC_RETRIEVAL_REQUIRED");

              const start = await fetch(`${base}/api/v1/media/managed/transcriptions`, {
                method: "POST", headers: headers(),
                body: JSON.stringify({ url: TELEGRAM_URL, language_hint: "auto", credit_consent: { provider: "supadata", mode: "native", max_credits: 1 } })
              });
              assert.equal(start.status, 409);
              const startBody = await start.json() as { error?: { code?: string } };
              assert.equal(startBody.error?.code, "TELEGRAM_PUBLIC_RETRIEVAL_REQUIRED");
              assert.equal(preflightCalls, 0);
              assert.equal(nativeCalls, 0);
            } finally {
              server.closeAllConnections();
              await new Promise<void>((resolve) => server.close(() => resolve()));
            }
          });

          test("Telegram capability remains public retrieval with zero retrieval credits", () => {
            const service = { configured: true, storeKind: "postgres", durableStore: true } as unknown as ManagedMediaService;
            const { capability } = createManagedMediaHttpHandler(CONFIG, service);
            assert.equal(capability.telegram_public_retrieval, true);
            assert.equal(capability.telegram_retrieval_provider, "telegram_public_web");
            assert.equal(capability.telegram_retrieval_credits, 0);
          });
          '''.replace(/^          /gm, ""))
          PY

      - name: Validate cloud
        working-directory: src/cloud
        run: |
          npm ci
          npm run check

      - name: Commit and cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/krc-media-telegram-route-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden active Telegram intake to public route only"
          git push origin HEAD:agent/krc-media-transcript
