name: MEDIA BETA Quota Restart Monitor

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/render-media-beta-quota-restart-monitor.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  EXPECTED_COMMIT: beebe6a638637e5d4d81a13826371810048d1407

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for isolated restart deploy to become live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RENDER_API_KEY:-}" ]] || exit 1
          for i in $(seq 1 120); do
            response="$(curl -fsS --get -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' --data-urlencode 'limit=10' "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys")"
            row="$(jq -c --arg c "$EXPECTED_COMMIT" '[.[] | (.deploy // .) | select((.commit.id // .commitId // "") == $c)] | first // empty' <<<"$response")"
            if [[ -n "$row" ]]; then
              status="$(jq -r '.status // empty' <<<"$row")"
              echo "restart_deploy_status=$status"
              case "$status" in
                live) exit 0 ;;
                build_failed|update_failed|canceled|deactivated) exit 1 ;;
              esac
            else
              echo "restart deploy not visible yet"
            fi
            sleep 5
          done
          echo "Timed out waiting for isolated restart deploy" >&2
          exit 1

      - name: Record restart deploy PASS in PR 28
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body='MEDIA BETA quota-ledger restart deploy: **SUCCESS**. Isolated target: `voicebridge-krc-media-beta-kolemasakar`. Restart commit: `beebe6a638637e5d4d81a13826371810048d1407`. Production was not targeted. Ready for post-restart quota readback.'
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg body "$body" '{body:$body}')" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/28/comments" >/dev/null
