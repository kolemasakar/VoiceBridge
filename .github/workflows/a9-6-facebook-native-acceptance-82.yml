name: A9.6 Facebook Native Acceptance 82

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-native-acceptance-82.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: a9-6-facebook-native-acceptance-82
  cancel-in-progress: false

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  REQUIRED_CODE_SHA: b88e710526d3cc7feaa982368fdab584ee096389
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  FACEBOOK_URL: https://www.facebook.com/reel/1114235920664408
  REQUIRED_AVAILABLE_BEFORE: "82"
  REQUIRED_AVAILABLE_AFTER: "81"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Guard isolated beta and exact live source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          echo "::add-mask::$RENDER_API_KEY"
          [[ "$GITHUB_REF_NAME" == "$REQUIRED_BRANCH" ]]

          curl -sS --max-time 30 "${RENDER_API_BASE}/services/${SERVICE_ID}" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/service.json
          [[ "$(jq -r '.name // empty' /tmp/service.json)" == "$SERVICE_NAME" ]]
          [[ "$(jq -r '.branch // empty' /tmp/service.json)" == "$REQUIRED_BRANCH" ]]

          curl -sS --max-time 30 "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys?limit=5" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/deploys.json
          live_sha="$(jq -r '.[0] | (.deploy // .) | select(.status == "live") | (.commit.id // .commitId // empty)' /tmp/deploys.json)"
          [[ "$live_sha" == "$REQUIRED_CODE_SHA" ]]

      - name: Read and mask Action bearer
        id: action
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 30 "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/env.json
          token="$(jq -r '(.envVar.value // .value // empty)' /tmp/env.json)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Recheck approved free quote
        id: quote
        env:
          ACTION_TOKEN: ${{ steps.action.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg url "$FACEBOOK_URL" '{url:$url,language_hint:"auto"}')"
          code="$(curl -sS --connect-timeout 15 --max-time 90 -o /tmp/quote.json -w '%{http_code}' \
            -X POST "${BETA_BASE_URL}/api/v1/media/managed/preflight" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${ACTION_TOKEN}" \
            --data "$payload")"
          [[ "$code" == 200 ]]
          jq -e '.provider == "supadata" and .mode == "native" and .estimated_credits == 1 and .consent_required == true and .can_continue == true' /tmp/quote.json >/dev/null
          before="$(jq -r '.credits_available' /tmp/quote.json)"
          after="$(jq -r '.credits_after_estimate' /tmp/quote.json)"
          [[ "$before" == "$REQUIRED_AVAILABLE_BEFORE" ]]
          [[ "$after" == "$REQUIRED_AVAILABLE_AFTER" ]]
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "quoted_after=$after" >> "$GITHUB_OUTPUT"

      - name: Execute exactly one approved native request
        id: native
        env:
          ACTION_TOKEN: ${{ steps.action.outputs.token }}
        shell: bash
        run: |
          set +e
          payload="$(jq -nc --arg url "$FACEBOOK_URL" '{url:$url,language_hint:"auto",credit_consent:{provider:"supadata",mode:"native",max_credits:1}}')"
          code="$(curl -sS --connect-timeout 15 --max-time 180 -o /tmp/native.json -w '%{http_code}' \
            -X POST "${BETA_BASE_URL}/api/v1/media/managed/transcriptions" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${ACTION_TOKEN}" \
            --data "$payload")"
          echo "http=$code" >> "$GITHUB_OUTPUT"
          echo "status=$(jq -r '.status // "unknown"' /tmp/native.json 2>/dev/null)" >> "$GITHUB_OUTPUT"
          echo "job_id=$(jq -r '.job_id // "unknown"' /tmp/native.json 2>/dev/null)" >> "$GITHUB_OUTPUT"
          echo "language=$(jq -r '.detected_language // "none"' /tmp/native.json 2>/dev/null)" >> "$GITHUB_OUTPUT"
          echo "segments=$(jq -r '.segment_count // 0' /tmp/native.json 2>/dev/null)" >> "$GITHUB_OUTPUT"
          echo "credits=$(jq -r '.credits_charged // "unknown"' /tmp/native.json 2>/dev/null)" >> "$GITHUB_OUTPUT"
          echo "uncertain=$(jq -r '.credit_charge_uncertain // "unknown"' /tmp/native.json 2>/dev/null)" >> "$GITHUB_OUTPUT"
          echo "reused=$(jq -r '.reused // "unknown"' /tmp/native.json 2>/dev/null)" >> "$GITHUB_OUTPUT"
          echo "error=$(jq -r '.error.code // .error_code // "none"' /tmp/native.json 2>/dev/null)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Read post-request balance using free preflight only
        id: after
        env:
          ACTION_TOKEN: ${{ steps.action.outputs.token }}
        shell: bash
        run: |
          set +e
          payload="$(jq -nc --arg url "$FACEBOOK_URL" '{url:$url,language_hint:"auto"}')"
          code="$(curl -sS --connect-timeout 15 --max-time 90 -o /tmp/after.json -w '%{http_code}' \
            -X POST "${BETA_BASE_URL}/api/v1/media/managed/preflight" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${ACTION_TOKEN}" \
            --data "$payload")"
          balance=unknown
          if [[ "$code" == 200 ]]; then balance="$(jq -r '.credits_available // "unknown"' /tmp/after.json)"; fi
          echo "http=$code" >> "$GITHUB_OUTPUT"
          echo "balance=$balance" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report one-shot result
        if: always()
        env:
          BEFORE: ${{ steps.quote.outputs.before }}
          QUOTED_AFTER: ${{ steps.quote.outputs.quoted_after }}
          AFTER: ${{ steps.after.outputs.balance }}
          AFTER_HTTP: ${{ steps.after.outputs.http }}
          HTTP: ${{ steps.native.outputs.http }}
          STATUS: ${{ steps.native.outputs.status }}
          JOB_ID: ${{ steps.native.outputs.job_id }}
          LANGUAGE: ${{ steps.native.outputs.language }}
          SEGMENTS: ${{ steps.native.outputs.segments }}
          CREDITS: ${{ steps.native.outputs.credits }}
          UNCERTAIN: ${{ steps.native.outputs.uncertain }}
          REUSED: ${{ steps.native.outputs.reused }}
          ERROR_CODE: ${{ steps.native.outputs.error }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook native one-shot at balance 82: explicit owner authorization for exactly one native request, hard max \`1\` Supadata credit. before=\`${BEFORE:-unknown}\`, quoted_after=\`${QUOTED_AFTER:-unknown}\`, after=\`${AFTER:-unknown}\`, after_preflight_http=\`${AFTER_HTTP:-unknown}\`; native_http=\`${HTTP:-unknown}\`, status=\`${STATUS:-unknown}\`, job=\`${JOB_ID:-unknown}\`, detected_language=\`${LANGUAGE:-unknown}\`, segments=\`${SEGMENTS:-unknown}\`, credits_charged=\`${CREDITS:-unknown}\`, charge_uncertain=\`${UNCERTAIN:-unknown}\`, reused=\`${REUSED:-unknown}\`, error=\`${ERROR_CODE:-none}\`. Exactly one billable-capable native POST was executed; no automatic retry, metadata start, AI start, production, main, or merge action was executed."
