name: MEDIA BETA Quota Restart Acceptance

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/render-media-beta-quota-restart.yml

permissions:
  contents: read

concurrency:
  group: media-beta-quota-restart-acceptance
  cancel-in-progress: false

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  HEALTH_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com/api/v1/health

jobs:
  restart-isolated-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Verify isolated target and trigger deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RENDER_API_KEY:-}" ]] || { echo "RENDER_API_KEY missing" >&2; exit 1; }
          service="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' "${RENDER_API_BASE}/services/${SERVICE_ID}")"
          actual_name="$(jq -r '(.service // .).name // empty' <<<"$service")"
          [[ "$actual_name" == "$SERVICE_NAME" ]] || { echo "Isolation boundary mismatch" >&2; exit 1; }
          payload="$(jq -nc --arg commitId "$GITHUB_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')"
          response="$(curl -fsS -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data "$payload" "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys")"
          deploy_id="$(jq -r '(.deploy // .).id // empty' <<<"$response")"
          [[ -n "$deploy_id" ]] || { echo "Deploy ID missing" >&2; exit 1; }
          echo "DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"
          echo "Isolated MEDIA BETA deploy requested: $deploy_id"

      - name: Wait for isolated deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            response="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${DEPLOY_ID}")"
            status="$(jq -r '(.deploy // .).status // empty' <<<"$response")"
            echo "deploy_status=$status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for isolated deploy" >&2
          exit 1

      - name: Verify durable MEDIA BETA health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 20 "$HEALTH_URL" -o /tmp/health.json; then
              jq -e '.status == "ok" and .capabilities.media_transcript.durable_store == "postgres" and .capabilities.media_transcript.durable_quota_ledger == true' /tmp/health.json >/dev/null
              jq -c '{status,service,media_transcript:.capabilities.media_transcript}' /tmp/health.json
              exit 0
            fi
            sleep 3
          done
          echo "Health did not recover" >&2
          exit 1
