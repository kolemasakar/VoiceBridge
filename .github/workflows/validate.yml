name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cloud
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/cloud/package-lock.json
      - name: Install cloud dependencies
        run: npm ci
      - name: Build and test cloud service
        run: |
          set +e
          npm run check > validation.log 2>&1
          status=$?
          cat validation.log
          exit $status
      - name: Upload cloud validation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloud-validation-log
          path: src/cloud/validation.log
          if-no-files-found: error

  krc-image-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build final cloud image
        run: docker build --tag voicebridge-krc-parity:ci src/cloud
      - name: Verify required KRC runtime commands
        run: |
          docker run --rm --entrypoint sh voicebridge-krc-parity:ci -lc '
            command -v ffmpeg >/dev/null &&
            command -v ffprobe >/dev/null &&
            command -v psql >/dev/null &&
            ffmpeg -version >/dev/null 2>&1 &&
            ffprobe -version >/dev/null 2>&1 &&
            psql --version >/dev/null 2>&1
          '
      - name: No-provider-call KRC route startup smoke
        run: |
          set -euo pipefail
          container=voicebridge-krc-parity-smoke
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container" \
            -e TEST_ACCESS_TOKEN=ci-test-access-token-1234567890 \
            -e KRC_MEDIA_ACTION_TOKEN=ci-krc-action-token-12345678901234567890 \
            -p 18080:8080 \
            voicebridge-krc-parity:ci >/dev/null

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/api/v1/health \
              > /tmp/voicebridge-health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error \
            -H 'Authorization: Bearer ci-krc-action-token-12345678901234567890' \
            http://127.0.0.1:18080/api/v1/media/managed \
            > /tmp/krc-media-capability.json

          grep -q '"status":"ok"' /tmp/voicebridge-health.json
          grep -q '"mode":"zero_client_managed_beta"' /tmp/krc-media-capability.json
          grep -q '"local_attachment_transport":true' /tmp/krc-media-capability.json

  browser-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Validate browser JavaScript
        run: |
          node --check src/browser_extension/audio_processor.js
          node --check src/browser_extension/offscreen.js
          node --check src/browser_extension/stop_policy.js
          node --check src/browser_extension/source_adapter.js
          node --check src/browser_extension/language_ui.js
          node --check src/browser_extension/popup.js
          node --check src/browser_extension/transcript_copy.js
          node --check src/browser_extension/service_worker.js
      - name: Test browser contracts
        run: node --test src/browser_extension/tests/*.test.js
      - name: Validate browser manifest
        run: node -e "JSON.parse(require('fs').readFileSync('src/browser_extension/manifest.json', 'utf8'))"
      - name: Package browser extension 0.8.0
        run: |
          rm -rf dist
          mkdir -p dist/extension
          cp src/browser_extension/audio_processor.js dist/extension/
          cp src/browser_extension/manifest.json dist/extension/
          cp src/browser_extension/offscreen.html dist/extension/
          cp src/browser_extension/offscreen.js dist/extension/
          cp src/browser_extension/stop_policy.js dist/extension/
          cp src/browser_extension/source_adapter.js dist/extension/
          cp src/browser_extension/language_ui.js dist/extension/
          cp src/browser_extension/popup.css dist/extension/
          cp src/browser_extension/popup.html dist/extension/
          cp src/browser_extension/popup.js dist/extension/
          cp src/browser_extension/transcript_copy.js dist/extension/
          cp src/browser_extension/service_worker.js dist/extension/
          cp src/browser_extension/README.md dist/extension/
          cd dist
          zip -r VoiceBridge_Extension_0.8.0.zip extension
          sha256sum VoiceBridge_Extension_0.8.0.zip > VoiceBridge_Extension_0.8.0_SHA256.txt
      - name: Upload browser extension 0.8.0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: VoiceBridge_Extension_0.8.0
          path: |
            dist/VoiceBridge_Extension_0.8.0.zip
            dist/VoiceBridge_Extension_0.8.0_SHA256.txt
          if-no-files-found: error

  repository-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate Markdown ASCII
        run: |
          python3 - <<'PY'
          from pathlib import Path
          failures = []
          for path in Path('.').rglob('*.md'):
              try:
                  path.read_text(encoding='ascii')
              except UnicodeDecodeError:
                  failures.append(str(path))
          if failures:
              raise SystemExit('Non-ASCII Markdown: ' + ', '.join(failures))
          print('ASCII Markdown validation passed')
          PY
