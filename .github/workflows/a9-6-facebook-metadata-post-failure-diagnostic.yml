name: A9.6 Facebook Metadata Post-Failure Diagnostic

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-metadata-post-failure-diagnostic.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  FACEBOOK_URL: https://www.facebook.com/reel/1114235920664408/

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read safe state only
        id: diag
        shell: bash
        run: |
          set +e
          balance=unknown
          status=unknown
          metadata=unknown
          duration=unknown
          ceiling=unknown
          credits=unknown
          expires=unknown
          reason=none
          rc=0
          read_env() {
            local key="$1" tmp code value
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/${key}" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == 200 ]] || { rm -f "$tmp"; return 1; }
            value="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
            rm -f "$tmp"
            test -n "$value" || return 1
            printf '%s' "$value"
          }
          if [[ -z "${RENDER_API_KEY:-}" ]]; then rc=1; reason=render_key_missing; fi
          if [[ $rc -eq 0 ]]; then
            echo "::add-mask::$RENDER_API_KEY"
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
            name="$(jq -r '.name // empty' "$tmp" 2>/dev/null)"
            branch="$(jq -r '.branch // empty' "$tmp" 2>/dev/null)"
            rm -f "$tmp"
            if [[ "$code" != 200 || "$name" != "$SERVICE_NAME" || "$branch" != "$REQUIRED_BRANCH" ]]; then rc=1; reason=isolation_guard_failed; fi
          fi
          if [[ $rc -eq 0 ]]; then
            action_token="$(read_env KRC_MEDIA_ACTION_TOKEN)" || rc=1
            database_url="$(read_env KRC_MEDIA_DATABASE_URL)" || rc=1
            if [[ $rc -ne 0 ]]; then reason=env_lookup_failed; else echo "::add-mask::$action_token"; echo "::add-mask::$database_url"; fi
          fi
          if [[ $rc -eq 0 ]]; then
            payload="$(jq -nc --arg url "$FACEBOOK_URL" '{url:$url,language_hint:"auto"}')"
            code="$(curl -sS --max-time 60 -o /tmp/free-preflight.json -w '%{http_code}' -X POST "${BETA_BASE_URL}/api/v1/media/managed/preflight" -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer ${action_token}" --data "$payload")"
            if [[ "$code" == 200 ]]; then balance="$(jq -r '.credits_available // "unknown"' /tmp/free-preflight.json)"; else rc=1; reason=free_preflight_failed; fi
          fi
          if [[ $rc -eq 0 ]]; then
            if ! command -v psql >/dev/null 2>&1; then sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1; fi
            row="$(PGCONNECT_TIMEOUT=8 psql "$database_url" -X -A -t -F $'\t' -v ON_ERROR_STOP=1 -c "SELECT status, COALESCE(payload->>'metadata_credits_charged','0'), COALESCE(payload->>'media_duration_seconds','null'), COALESCE(payload->>'ai_credit_ceiling','null'), COALESCE(payload->>'credits_charged','0'), extract(epoch from expires_at)::bigint FROM krc_managed_media_jobs WHERE payload->>'source_url'='${FACEBOOK_URL}' ORDER BY updated_at DESC LIMIT 1;" 2>/dev/null | tr -d '\r' | head -n1)"
            if [[ -z "$row" ]]; then rc=1; reason=durable_job_not_found; else IFS=$'\t' read -r status metadata duration ceiling credits expires <<< "$row"; fi
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "balance=$balance" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "ceiling=$ceiling" >> "$GITHUB_OUTPUT"
          echo "credits=$credits" >> "$GITHUB_OUTPUT"
          echo "expires=$expires" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report diagnostic
        env:
          RC: ${{ steps.diag.outputs.rc }}
          BALANCE: ${{ steps.diag.outputs.balance }}
          STATUS: ${{ steps.diag.outputs.status }}
          METADATA: ${{ steps.diag.outputs.metadata }}
          DURATION: ${{ steps.diag.outputs.duration }}
          CEILING: ${{ steps.diag.outputs.ceiling }}
          CREDITS: ${{ steps.diag.outputs.credits }}
          EXPIRES: ${{ steps.diag.outputs.expires }}
          REASON: ${{ steps.diag.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook metadata post-failure diagnostic: rc=\`${RC}\`, provider_balance=\`${BALANCE}\`, job_status=\`${STATUS}\`, metadata_credits_charged=\`${METADATA}\`, duration_seconds=\`${DURATION}\`, ai_credit_ceiling=\`${CEILING}\`, cumulative_job_credits=\`${CREDITS}\`, expires_epoch=\`${EXPIRES}\`, reason=\`${REASON}\`. Read-only diagnostic: no metadata, transcript, or AI start request was executed. Production/main were not targeted."
