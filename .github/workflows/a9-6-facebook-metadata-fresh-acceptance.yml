name: A9.6 Facebook Fresh Metadata Acceptance

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-metadata-fresh-acceptance.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: a9-6-facebook-fresh-metadata-acceptance
  cancel-in-progress: false

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  REQUIRED_LIVE_SHA: ecd5a1d935b1b20a35cf7aa206175a18efad45ee
  FACEBOOK_URL: https://www.facebook.com/reel/1114235920664408/
  EXPECTED_BEFORE: '89'
  EXPECTED_AFTER: '88'

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enforce isolated live target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          echo "::add-mask::$RENDER_API_KEY"
          [[ "$GITHUB_REF_NAME" == "$REQUIRED_BRANCH" ]]
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]]
          [[ "$(jq -r '.name // empty' "$tmp")" == "$SERVICE_NAME" ]]
          [[ "$(jq -r '.branch // empty' "$tmp")" == "$REQUIRED_BRANCH" ]]
          rm -f "$tmp"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys?limit=1" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]]
          live_status="$(jq -r '.[0].deploy.status // .[0].status // empty' "$tmp")"
          live_sha="$(jq -r '.[0].deploy.commit.id // .[0].commit.id // .[0].deploy.commitId // .[0].commitId // empty' "$tmp")"
          rm -f "$tmp"
          [[ "$live_status" == "live" ]]
          [[ "$live_sha" == "$REQUIRED_LIVE_SHA" ]]

      - name: Read and mask isolated credentials
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          read_env() {
            local key="$1" tmp code value
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/${key}" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == 200 ]] || { rm -f "$tmp"; return 1; }
            value="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
            rm -f "$tmp"
            test -n "$value" || return 1
            printf '%s' "$value"
          }
          action_token="$(read_env KRC_MEDIA_ACTION_TOKEN)"
          database_url="$(read_env KRC_MEDIA_DATABASE_URL)"
          echo "::add-mask::$action_token"
          echo "::add-mask::$database_url"
          echo "action_token=$action_token" >> "$GITHUB_OUTPUT"
          echo "database_url=$database_url" >> "$GITHUB_OUTPUT"

      - name: Locate fresh Facebook awaiting-consent job
        id: job
        env:
          DATABASE_URL: ${{ steps.creds.outputs.database_url }}
          ACTION_TOKEN: ${{ steps.creds.outputs.action_token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          job_id="$(PGCONNECT_TIMEOUT=8 psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT job_id FROM krc_managed_media_jobs WHERE payload->>'source_url'='${FACEBOOK_URL}' AND status='AWAITING_AI_CONSENT' AND expires_at > now() AND COALESCE((payload->>'metadata_credits_charged')::int,0)=0 AND payload->>'media_duration_seconds' IS NULL ORDER BY updated_at DESC LIMIT 1;" | tr -d '\r' | head -n1)"
          [[ "$job_id" =~ ^KRCM_[A-Za-z0-9-]+$ ]]
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          code="$(curl -sS --max-time 60 -o /tmp/job-before.json -w '%{http_code}' "${BETA_BASE_URL}/api/v1/media/managed/transcriptions/${job_id}" -H 'Accept: application/json' -H "Authorization: Bearer ${ACTION_TOKEN}")"
          [[ "$code" == 200 ]]
          jq -e --arg url "$FACEBOOK_URL" '.status == "AWAITING_AI_CONSENT" and .source_url == $url and .credits_charged == 1 and .media_duration_seconds == null and ((.metadata_credits_charged // 0) == 0)' /tmp/job-before.json >/dev/null

      - name: Recheck approved one-credit metadata quote
        id: quote
        env:
          ACTION_TOKEN: ${{ steps.creds.outputs.action_token }}
          JOB_ID: ${{ steps.job.outputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 60 -o /tmp/meta-quote.json -w '%{http_code}' "${BETA_BASE_URL}/api/v1/media/managed/transcriptions/${JOB_ID}/facebook-ai-estimate-preflight" -H 'Accept: application/json' -H "Authorization: Bearer ${ACTION_TOKEN}")"
          [[ "$code" == 200 ]]
          jq -e '.provider == "supadata" and .mode == "metadata" and .purpose == "facebook_ai_duration" and .estimated_credits == 1 and .consent_required == true and .can_continue == true' /tmp/meta-quote.json >/dev/null
          available="$(jq -r '.credits_available' /tmp/meta-quote.json)"
          after="$(jq -r '.credits_after_estimate' /tmp/meta-quote.json)"
          [[ "$available" == "$EXPECTED_BEFORE" ]]
          [[ "$after" == "$EXPECTED_AFTER" ]]
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Execute exactly one approved metadata-duration request
        id: metadata
        env:
          ACTION_TOKEN: ${{ steps.creds.outputs.action_token }}
          JOB_ID: ${{ steps.job.outputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"credit_consent":{"provider":"supadata","mode":"metadata","max_credits":1}}'
          code="$(curl -sS --max-time 180 -o /tmp/meta-result.json -w '%{http_code}' -X POST "${BETA_BASE_URL}/api/v1/media/managed/transcriptions/${JOB_ID}/facebook-ai-estimate" -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer ${ACTION_TOKEN}" --data "$payload")"
          [[ "$code" == 200 ]]
          jq -e '.status == "AWAITING_AI_CONSENT" and .credit_charge_uncertain == false and .metadata_credits_charged == 1 and .credits_charged == 2 and (.media_duration_seconds | numbers) > 0 and (.ai_credit_ceiling | numbers) >= 2' /tmp/meta-result.json >/dev/null
          echo "duration=$(jq -r '.media_duration_seconds' /tmp/meta-result.json)" >> "$GITHUB_OUTPUT"
          echo "ceiling=$(jq -r '.ai_credit_ceiling' /tmp/meta-result.json)" >> "$GITHUB_OUTPUT"
          echo "cumulative=$(jq -r '.credits_charged' /tmp/meta-result.json)" >> "$GITHUB_OUTPUT"

      - name: Obtain separate AI quote only
        id: ai
        env:
          ACTION_TOKEN: ${{ steps.creds.outputs.action_token }}
          JOB_ID: ${{ steps.job.outputs.job_id }}
          EXPECTED_CEILING: ${{ steps.metadata.outputs.ceiling }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 60 -o /tmp/ai-quote.json -w '%{http_code}' "${BETA_BASE_URL}/api/v1/media/managed/transcriptions/${JOB_ID}/ai-preflight" -H 'Accept: application/json' -H "Authorization: Bearer ${ACTION_TOKEN}")"
          [[ "$code" == 200 ]]
          jq -e --argjson ceiling "$EXPECTED_CEILING" '.provider == "supadata" and .mode == "generate" and .estimate_basis == "facebook_metadata_duration" and .maximum_credits == $ceiling and .credits_per_minute == 2 and .consent_required == true' /tmp/ai-quote.json >/dev/null
          available="$(jq -r '.credits_available' /tmp/ai-quote.json)"
          [[ "$available" == "$EXPECTED_AFTER" ]]
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "maximum=$(jq -r '.maximum_credits' /tmp/ai-quote.json)" >> "$GITHUB_OUTPUT"
          echo "after=$(jq -r '.credits_after_estimate' /tmp/ai-quote.json)" >> "$GITHUB_OUTPUT"
          echo "minutes=$(jq -r '.maximum_duration_minutes' /tmp/ai-quote.json)" >> "$GITHUB_OUTPUT"
          echo "can_continue=$(jq -r '.can_continue' /tmp/ai-quote.json)" >> "$GITHUB_OUTPUT"

      - name: Report fresh metadata acceptance
        if: always()
        env:
          DURATION: ${{ steps.metadata.outputs.duration }}
          CEILING: ${{ steps.ai.outputs.maximum }}
          AI_AFTER: ${{ steps.ai.outputs.after }}
          AI_MINUTES: ${{ steps.ai.outputs.minutes }}
          AI_CAN_CONTINUE: ${{ steps.ai.outputs.can_continue }}
          CUMULATIVE: ${{ steps.metadata.outputs.cumulative }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then
            body="A9.6 Facebook fresh metadata acceptance: **SUCCESS**. Explicit authorization covered exactly one metadata-duration request, hard max \`1\` credit. Balance \`${EXPECTED_BEFORE}\` -> \`${EXPECTED_AFTER}\`; metadata credits=\`1\`; cumulative job credits=\`${CUMULATIVE}\`; duration_seconds=\`${DURATION}\`. Separate AI preflight only: rate=\`2 credits/min\`, maximum_credits=\`${CEILING}\`, maximum_duration_minutes=\`${AI_MINUTES}\`, worst-case remaining=\`${AI_AFTER}\`, can_continue=\`${AI_CAN_CONTINUE}\`. No AI start request was executed. Production/main were not targeted."
          else
            body="A9.6 Facebook fresh metadata acceptance: **FAILURE**. Authorization was limited to exactly one metadata-duration request with hard max \`1\` credit. No AI start request was authorized or executed. Production/main were not targeted."
          fi
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "$body"
