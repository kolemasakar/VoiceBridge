name: A9.6 Facebook AI Deploy Preflight

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-ai-deploy-preflight.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: a9-6-facebook-ai-deploy-preflight
  cancel-in-progress: false

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  CODE_SHA: 7d53d5ba5414f40638c3a31016403cc06e05ea50
  FACEBOOK_URL: https://www.facebook.com/reel/1114235920664408

jobs:
  deploy-preflight:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Deploy isolated beta and run non-billable Facebook preflight
        shell: bash
        run: |
          set -euo pipefail

          mask() {
            test -z "${1:-}" || echo "::add-mask::$1"
          }

          render_env() {
            local key="$1" tmp code
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/${key}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == 200 ]] || { rm -f "$tmp"; return 1; }
            jq -r '(.envVar.value // .value // empty)' "$tmp"
            rm -f "$tmp"
          }

          deploy_code() {
            local tmp code payload deploy_id status commit i
            payload="$(jq -nc --arg commitId "$CODE_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')"
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              -X POST "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              --data "$payload")"
            [[ "$code" == 201 || "$code" == 202 ]] || { rm -f "$tmp"; return 1; }
            deploy_id="$(jq -r '(.deploy // .).id // empty' "$tmp")"
            rm -f "$tmp"
            test -n "$deploy_id"
            for i in $(seq 1 90); do
              tmp="$(mktemp)"
              code="$(curl -sS -o "$tmp" -w '%{http_code}' \
                "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${deploy_id}" \
                -H 'Accept: application/json' \
                -H "Authorization: Bearer ${RENDER_API_KEY}")"
              [[ "$code" == 200 ]] || { rm -f "$tmp"; return 1; }
              status="$(jq -r '(.deploy // .).status // "unknown"' "$tmp")"
              commit="$(jq -r '(.deploy // .).commit.id // (.deploy // .).commitId // "unknown"' "$tmp")"
              rm -f "$tmp"
              case "$status" in
                live)
                  [[ "$commit" == "$CODE_SHA" ]]
                  return 0
                  ;;
                build_failed|update_failed|canceled|deactivated)
                  return 1
                  ;;
              esac
              sleep 5
            done
            return 1
          }

          test -n "${RENDER_API_KEY:-}"
          mask "$RENDER_API_KEY"

          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]]
          [[ "$(jq -r '.name // empty' "$tmp")" == "$SERVICE_NAME" ]]
          [[ "$(jq -r '.branch // empty' "$tmp")" == "$REQUIRED_BRANCH" ]]
          rm -f "$tmp"

          deploy_code

          action_token="$(render_env KRC_MEDIA_ACTION_TOKEN)"
          beta_codes="$(render_env KRC_MEDIA_BETA_CODES)"
          test -n "$action_token"
          test -n "$beta_codes"
          beta_code="${beta_codes%%,*}"
          beta_code="$(printf '%s' "$beta_code" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$beta_code"
          mask "$action_token"
          mask "$beta_codes"
          mask "$beta_code"

          capability_status="$(curl -sS --max-time 60 -o /tmp/cap.json -w '%{http_code}' \
            "${BETA_BASE_URL}/api/v1/media/managed" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${action_token}")"
          [[ "$capability_status" == 200 ]]
          jq -e '.configured == true and .facebook_ai_fallback == true and .facebook_ai_requires_duration_metadata == true and .facebook_ai_metadata_credits == 1 and .automatic_ai_fallback == false' /tmp/cap.json >/dev/null

          payload="$(jq -nc --arg url "$FACEBOOK_URL" --arg code "$beta_code" \
            '{url:$url,language_hint:"auto",beta_access_code:$code}')"
          preflight_status="$(curl -sS --max-time 90 -o /tmp/preflight.json -w '%{http_code}' \
            -X POST "${BETA_BASE_URL}/api/v1/media/managed/preflight" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${action_token}" \
            --data "$payload")"
          [[ "$preflight_status" == 200 ]]
          jq -e '.provider == "supadata" and .mode == "native" and .consent_required == true' /tmp/preflight.json >/dev/null

          available="$(jq -r '.credits_available' /tmp/preflight.json)"
          [[ "$available" =~ ^[0-9]+$ ]]
          metadata_cost="$(jq -r '.facebook_ai_metadata_credits' /tmp/cap.json)"
          after=$(( available - metadata_cost ))
          if [[ "$after" -lt 0 ]]; then after=0; fi
          can_continue=false
          if [[ "$available" -ge "$metadata_cost" ]]; then can_continue=true; fi

          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook AI isolated deploy/preflight: **PASS**. Deployed exact feature code: \`${CODE_SHA}\` to \`${SERVICE_NAME}\` only. Capability: \`facebook_ai_fallback=true\`, \`facebook_ai_requires_duration_metadata=true\`, automatic AI fallback remains \`false\`. Current provider credits available: \`${available}\`. Next metadata-duration lookup cost: \`${metadata_cost}\` credit; estimated after: \`${after}\`; can_continue: \`${can_continue}\`. This workflow executed capability and account/native preflight only; **no metadata request, transcript start, or AI request was executed**. Production/main were not targeted."
