# Live restart acceptance trigger: 2026-08-18T02:56Z
name: Render MEDIA BETA Postgres Durability

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/render-media-beta-postgres-durability.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: render-media-beta-postgres-durability
  cancel-in-progress: false

env:
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  DB_NAME: voicebridge-krc-media-beta-db
  HEALTH_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com/api/v1/health
  RENDER_API_BASE: https://api.render.com/v1

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      A44_STAGE: preflight
      A44_DIAG: none
    steps:
      - name: Verify isolated beta target and workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          echo 'A44_STAGE=workspace_lookup' >> "$GITHUB_ENV"
          test -n "${RENDER_API_KEY:-}" || { echo 'A44_DIAG=render_api_key_missing' >> "$GITHUB_ENV"; exit 1; }
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]] || { echo "A44_DIAG=service_http_${code}" >> "$GITHUB_ENV"; rm -f "$tmp"; exit 1; }
          owner="$(jq -r '.ownerId // .owner_id // .owner.id // empty' "$tmp")"
          name="$(jq -r '.name // empty' "$tmp")"
          rm -f "$tmp"
          [[ "$name" == "$SERVICE_NAME" ]] || { echo 'A44_DIAG=isolation_guard_failed' >> "$GITHUB_ENV"; exit 1; }
          test -n "$owner" || { echo 'A44_DIAG=workspace_id_missing' >> "$GITHUB_ENV"; exit 1; }
          echo "owner_id=$owner" >> "$GITHUB_OUTPUT"
          echo 'A44_STAGE=workspace_verified' >> "$GITHUB_ENV"

      - name: Find or create isolated Free Postgres
        id: database
        env:
          OWNER_ID: ${{ steps.workspace.outputs.owner_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'A44_STAGE=postgres_resolve' >> "$GITHUB_ENV"
          tmp="$(mktemp)"
          code="$(curl -sS --get -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/postgres" \
            --data-urlencode "ownerId=${OWNER_ID}" \
            --data-urlencode 'limit=100' \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]] || { echo "A44_DIAG=postgres_list_http_${code}" >> "$GITHUB_ENV"; rm -f "$tmp"; exit 1; }

          db_id="$(jq -r --arg n "$DB_NAME" '[.[] | (.postgres // .) | select(.name==$n)] | first | (.id // empty)' "$tmp")"
          if [[ -z "$db_id" ]]; then
            other_free="$(jq -r --arg n "$DB_NAME" '[.[] | (.postgres // .) | select(.plan=="free" and .name!=$n)] | first | (.name // empty)' "$tmp")"
            if [[ -n "$other_free" ]]; then
              rm -f "$tmp"
              echo 'A44_DIAG=workspace_already_has_other_free_postgres' >> "$GITHUB_ENV"
              exit 1
            fi
            rm -f "$tmp"

            payload="$(jq -nc \
              --arg name "$DB_NAME" \
              --arg owner "$OWNER_ID" \
              '{name:$name,ownerId:$owner,plan:"free",region:"frankfurt",version:"18"}')"
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              -X POST "${RENDER_API_BASE}/postgres" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              --data "$payload")"
            if [[ "$code" != 201 && "$code" != 202 ]]; then
              diag="$(jq -r '.message // .error // .id // "unknown"' "$tmp" 2>/dev/null | tr -cd '[:alnum:] _.-' | head -c 120)"
              rm -f "$tmp"
              echo "A44_DIAG=postgres_create_http_${code}_${diag:-unknown}" >> "$GITHUB_ENV"
              exit 1
            fi
            db_id="$(jq -r '(.postgres // .).id // empty' "$tmp")"
            rm -f "$tmp"
            test -n "$db_id" || { echo 'A44_DIAG=created_postgres_id_missing' >> "$GITHUB_ENV"; exit 1; }
          else
            rm -f "$tmp"
          fi
          echo "db_id=$db_id" >> "$GITHUB_OUTPUT"
          echo 'A44_STAGE=postgres_resolved' >> "$GITHUB_ENV"

      - name: Wait for Postgres availability
        env:
          DB_ID: ${{ steps.database.outputs.db_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'A44_STAGE=postgres_wait' >> "$GITHUB_ENV"
          for i in $(seq 1 72); do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              "${RENDER_API_BASE}/postgres/${DB_ID}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == 200 ]] || { echo "A44_DIAG=postgres_status_http_${code}" >> "$GITHUB_ENV"; rm -f "$tmp"; exit 1; }
            status="$(jq -r '(.postgres // .).status // "unknown"' "$tmp")"
            rm -f "$tmp"
            case "$status" in
              available)
                echo 'A44_STAGE=postgres_available' >> "$GITHUB_ENV"
                exit 0
                ;;
              failed|suspended)
                echo "A44_DIAG=postgres_${status}" >> "$GITHUB_ENV"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'A44_DIAG=postgres_wait_timeout' >> "$GITHUB_ENV"
          exit 1

      - name: Obtain internal Postgres connection
        env:
          DB_ID: ${{ steps.database.outputs.db_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'A44_STAGE=postgres_connection' >> "$GITHUB_ENV"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/postgres/${DB_ID}/connection-info" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]] || { echo "A44_DIAG=connection_info_http_${code}" >> "$GITHUB_ENV"; rm -f "$tmp"; exit 1; }
          database_url="$(jq -r '.internalConnectionString // .internal_connection_string // empty' "$tmp")"
          rm -f "$tmp"
          test -n "$database_url" || { echo 'A44_DIAG=internal_connection_string_missing' >> "$GITHUB_ENV"; exit 1; }
          echo "::add-mask::$database_url"
          printf '%s' "$database_url" > /tmp/krc-media-db-url
          echo 'A44_STAGE=postgres_connection_ready' >> "$GITHUB_ENV"

      - name: Attach database only to isolated beta service
        shell: bash
        run: |
          set -euo pipefail
          echo 'A44_STAGE=database_attach' >> "$GITHUB_ENV"
          database_url="$(cat /tmp/krc-media-db-url)"
          echo "::add-mask::$database_url"
          payload="$(jq -nc --arg value "$database_url" '{value:$value}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            -X PUT "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_DATABASE_URL" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            --data "$payload")"
          rm -f "$tmp"
          [[ "$code" == 200 ]] || { echo "A44_DIAG=env_var_http_${code}" >> "$GITHUB_ENV"; exit 1; }
          echo 'A44_STAGE=database_attached' >> "$GITHUB_ENV"

      - name: Deploy isolated beta at current commit
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          echo 'A44_STAGE=deploy_request' >> "$GITHUB_ENV"
          payload="$(jq -nc --arg commitId "$GITHUB_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            -X POST "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            --data "$payload")"
          [[ "$code" == 201 || "$code" == 202 ]] || { echo "A44_DIAG=deploy_http_${code}" >> "$GITHUB_ENV"; rm -f "$tmp"; exit 1; }
          deploy_id="$(jq -r '(.deploy // .).id // empty' "$tmp")"
          rm -f "$tmp"
          test -n "$deploy_id" || { echo 'A44_DIAG=deploy_id_missing' >> "$GITHUB_ENV"; exit 1; }
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo 'A44_STAGE=deploy_started' >> "$GITHUB_ENV"

      - name: Wait for isolated beta deploy
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'A44_STAGE=deploy_wait' >> "$GITHUB_ENV"
          for i in $(seq 1 72); do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == 200 ]] || { echo "A44_DIAG=deploy_status_http_${code}" >> "$GITHUB_ENV"; rm -f "$tmp"; exit 1; }
            status="$(jq -r '(.deploy // .).status // "unknown"' "$tmp")"
            rm -f "$tmp"
            case "$status" in
              live)
                echo 'A44_STAGE=deploy_live' >> "$GITHUB_ENV"
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "A44_DIAG=deploy_${status}" >> "$GITHUB_ENV"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'A44_DIAG=deploy_timeout' >> "$GITHUB_ENV"
          exit 1

      - name: Verify durable MEDIA BETA health
        shell: bash
        run: |
          set -euo pipefail
          echo 'A44_STAGE=health_verify' >> "$GITHUB_ENV"
          code="$(curl -sS --retry 5 --retry-delay 3 --max-time 90 -o /tmp/health.json -w '%{http_code}' "$HEALTH_URL")"
          [[ "$code" == 200 ]] || { echo "A44_DIAG=health_http_${code}" >> "$GITHUB_ENV"; exit 1; }
          jq -e '
            .status == "ok" and
            .capabilities.media_client_ingest.mode == "client_assisted" and
            .capabilities.media_client_ingest.configured == true and
            .capabilities.media_client_ingest.durable_store == "postgres" and
            .capabilities.media_client_ingest.restart_resilient_waiting_jobs == true and
            .capabilities.media_client_ingest.durable_quota_ledger == true
          ' /tmp/health.json >/dev/null || { echo 'A44_DIAG=health_durability_flags_missing' >> "$GITHUB_ENV"; exit 1; }
          jq -c '{status,media_client_ingest:.capabilities.media_client_ingest}' /tmp/health.json
          echo 'A44_STAGE=health_pass' >> "$GITHUB_ENV"

      - name: Report durability workflow to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "MEDIA BETA A4.4 durability workflow: **${WORKFLOW_STATUS^^}**. Stage=\`${A44_STAGE}\`; diagnostic=\`${A44_DIAG}\`. Isolated target: \`voicebridge-krc-media-beta-kolemasakar\`. Commit: \`${GITHUB_SHA}\`. No production target was modified."
