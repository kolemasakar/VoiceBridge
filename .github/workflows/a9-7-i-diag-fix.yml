name: A9.7-I DIAG FIX

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-7-i-diag-fix.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/krc-media-transcript

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/cloud/package-lock.json

      - name: Apply safe free-retrieval diagnostics patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          retrieval = "src/cloud/src/facebook_media_retrieval.ts"
          replace_once(
              retrieval,
              'export type FacebookMediaRetrievalProvider = "cobalt" | "scrapecreators";\n',
              'export type FacebookMediaRetrievalProvider = "cobalt" | "scrapecreators";\nexport type FacebookRetrievalHttpStatusClass = "2xx" | "4xx" | "5xx" | null;\n'
          )
          replace_once(
              retrieval,
              '    readonly provider: FacebookMediaRetrievalProvider | null = null,\n    readonly creditsCharged: number | null = null,\n    readonly creditsRemaining: number | null = null\n',
              '    readonly provider: FacebookMediaRetrievalProvider | null = null,\n    readonly creditsCharged: number | null = null,\n    readonly creditsRemaining: number | null = null,\n    readonly providerHttpStatusClass: FacebookRetrievalHttpStatusClass = null\n'
          )
          replace_once(
              retrieval,
              'async function jsonResponse(response: Response): Promise<Record<string, unknown>> {\n',
              '''function httpStatusClass(status: number): FacebookRetrievalHttpStatusClass {\n  if (status >= 200 && status < 300) return "2xx";\n  if (status >= 400 && status < 500) return "4xx";\n  if (status >= 500 && status < 600) return "5xx";\n  return null;\n}\n\nasync function jsonResponse(\n  response: Response,\n  provider: FacebookMediaRetrievalProvider\n): Promise<Record<string, unknown>> {\n'''
          )
          replace_once(
              retrieval,
              '''      502,\n      false\n    );\n  }\n}\n\nexport function parseFacebookRetrievalCreditConsent''',
              '''      502,\n      false,\n      provider,\n      null,\n      null,\n      httpStatusClass(response.status)\n    );\n  }\n}\n\nexport function parseFacebookRetrievalCreditConsent'''
          )
          replace_once(
              retrieval,
              '    const payload = await jsonResponse(response);\n    if (!response.ok) {\n',
              '    const payload = await jsonResponse(response, "cobalt");\n    if (!response.ok) {\n'
          )
          replace_once(
              retrieval,
              '''        response.status >= 500,\n        "cobalt"\n      );''',
              '''        response.status >= 500,\n        "cobalt",\n        null,\n        null,\n        httpStatusClass(response.status)\n      );'''
          )
          replace_once(
              retrieval,
              '''        422,\n        false,\n        "cobalt"\n      );\n    }\n\n    return {''',
              '''        422,\n        false,\n        "cobalt",\n        null,\n        null,\n        httpStatusClass(response.status)\n      );\n    }\n\n    return {'''
          )
          replace_once(
              retrieval,
              '    const payload = await jsonResponse(response);\n    const charged = finiteNumber(payload.credits_charged);\n',
              '    const payload = await jsonResponse(response, "scrapecreators");\n    const charged = finiteNumber(payload.credits_charged);\n'
          )

          pipeline = "src/cloud/src/facebook_managed_pipeline.ts"
          replace_once(
              pipeline,
              '''import {\n  type FacebookMediaAsset,\n  type FacebookMediaRetriever,\n  type FacebookRetrievalCreditConsent\n} from "./facebook_media_retrieval.js";''',
              '''import {\n  FacebookMediaRetrievalError,\n  type FacebookMediaAsset,\n  type FacebookMediaRetrievalProvider,\n  type FacebookMediaRetriever,\n  type FacebookRetrievalCreditConsent,\n  type FacebookRetrievalHttpStatusClass\n} from "./facebook_media_retrieval.js";'''
          )
          replace_once(
              pipeline,
              '''export interface ManagedFacebookPipeline {\n  readonly configured: boolean;\n  freeRetrieve(sourceUrl: string): Promise<FacebookMediaAsset | null>;''',
              '''export interface ManagedFacebookFreeRetrievalFailure {\n  kind: "failure";\n  error_code: string;\n  provider: FacebookMediaRetrievalProvider | null;\n  http_status_class: FacebookRetrievalHttpStatusClass;\n}\n\nexport type ManagedFacebookFreeRetrievalResult =\n  | FacebookMediaAsset\n  | ManagedFacebookFreeRetrievalFailure\n  | null;\n\nexport interface ManagedFacebookPipeline {\n  readonly configured: boolean;\n  freeRetrieve(sourceUrl: string): Promise<ManagedFacebookFreeRetrievalResult>;'''
          )
          replace_once(
              pipeline,
              '''  async freeRetrieve(sourceUrl: string): Promise<FacebookMediaAsset | null> {\n    if (!this.freeRetriever) return null;\n    try {\n      return await this.freeRetriever.retrieve(sourceUrl);\n    } catch {\n      return null;\n    }\n  }''',
              '''  async freeRetrieve(sourceUrl: string): Promise<ManagedFacebookFreeRetrievalResult> {\n    if (!this.freeRetriever) {\n      return {\n        kind: "failure",\n        error_code: "FACEBOOK_FREE_RETRIEVER_NOT_CONFIGURED",\n        provider: null,\n        http_status_class: null\n      };\n    }\n    try {\n      return await this.freeRetriever.retrieve(sourceUrl);\n    } catch (error) {\n      if (error instanceof FacebookMediaRetrievalError) {\n        return {\n          kind: "failure",\n          error_code: error.code,\n          provider: error.provider ?? this.freeRetriever.provider,\n          http_status_class: error.providerHttpStatusClass\n        };\n      }\n      return {\n        kind: "failure",\n        error_code: "FACEBOOK_FREE_RETRIEVAL_UNKNOWN",\n        provider: this.freeRetriever.provider,\n        http_status_class: null\n      };\n    }\n  }'''
          )

          service = "src/cloud/src/managed_media_service.ts"
          replace_once(
              service,
              '''  type FacebookMediaAsset,\n  type FacebookRetrievalCreditConsent,\n  type FacebookRetrievalCreditPreflight\n} from "./facebook_media_retrieval.js";''',
              '''  type FacebookMediaAsset,\n  type FacebookMediaRetrievalProvider,\n  type FacebookRetrievalCreditConsent,\n  type FacebookRetrievalCreditPreflight,\n  type FacebookRetrievalHttpStatusClass\n} from "./facebook_media_retrieval.js";'''
          )
          replace_once(
              service,
              '''  retrieval_provider?: "cobalt" | "scrapecreators" | null;\n  retrieval_credits_charged?: number;''',
              '''  retrieval_provider?: "cobalt" | "scrapecreators" | null;\n  free_retrieval_error_code?: string | null;\n  free_retrieval_provider?: FacebookMediaRetrievalProvider | null;\n  free_retrieval_http_status_class?: FacebookRetrievalHttpStatusClass;\n  retrieval_credits_charged?: number;'''
          )
          replace_once(
              service,
              '''      const asset = await this.facebookPipeline!.freeRetrieve(sourceUrl);\n      if (!asset) {\n        const updatedAt = new Date().toISOString();\n        const waiting: ManagedMediaStoredRecord = {\n          ...record,\n          job: {\n            ...job,\n            status: "AWAITING_RETRIEVAL_CONSENT",\n            updated_at: updatedAt,\n            credit_charge_uncertain: false,\n            error: null\n          },\n          expiresAt: this.expiryFrom(updatedAt, job)\n        };\n        await this.store.put(waiting);\n        return this.publicJob(waiting.job, false);\n      }\n      return await this.completeFacebookFallback(record, asset, input.language_hint);''',
              '''      const freeResult = await this.facebookPipeline!.freeRetrieve(sourceUrl);\n      if (!freeResult || ("kind" in freeResult && freeResult.kind === "failure")) {\n        const diagnostic = freeResult && "kind" in freeResult ? freeResult : null;\n        const updatedAt = new Date().toISOString();\n        const errorCode = diagnostic?.error_code ?? "FACEBOOK_FREE_RETRIEVAL_NO_ASSET";\n        const waiting: ManagedMediaStoredRecord = {\n          ...record,\n          job: {\n            ...job,\n            status: "AWAITING_RETRIEVAL_CONSENT",\n            updated_at: updatedAt,\n            credit_charge_uncertain: false,\n            free_retrieval_error_code: errorCode,\n            free_retrieval_provider: diagnostic?.provider ?? null,\n            free_retrieval_http_status_class: diagnostic?.http_status_class ?? null,\n            error: null\n          },\n          expiresAt: this.expiryFrom(updatedAt, job)\n        };\n        console.warn(JSON.stringify({\n          event: "facebook_free_retrieval_failed",\n          job_id: job.job_id,\n          provider: waiting.job.free_retrieval_provider ?? null,\n          error_code: errorCode,\n          http_status_class: waiting.job.free_retrieval_http_status_class ?? null\n        }));\n        await this.store.put(waiting);\n        return this.publicJob(waiting.job, false);\n      }\n      return await this.completeFacebookFallback(record, freeResult, input.language_hint);'''
          )

          tests = "src/cloud/tests/managed_facebook_fallback.test.ts"
          replace_once(
              tests,
              '''  FacebookMediaRetrievalError,\n  type FacebookMediaAsset,\n  type FacebookRetrievalCreditConsent\n} from "../src/facebook_media_retrieval.js";''',
              '''  FacebookMediaRetrievalError,\n  type FacebookMediaAsset,\n  type FacebookMediaRetriever,\n  type FacebookRetrievalCreditConsent,\n  type FacebookRetrievalHttpStatusClass\n} from "../src/facebook_media_retrieval.js";'''
          )
          replace_once(
              tests,
              '''import type {\n  ManagedFacebookPipeline,\n  ManagedFacebookSttResult\n} from "../src/facebook_managed_pipeline.js";''',
              '''import {\n  AssemblyAiFacebookMediaStt,\n  DefaultManagedFacebookPipeline,\n  type ManagedFacebookPipeline,\n  type ManagedFacebookSttResult\n} from "../src/facebook_managed_pipeline.js";'''
          )
          marker = 'test("Facebook fallback request key is stable, owner-isolated, and separate from URL spelling", () => {'
          addition = r'''test("free Cobalt failure classes persist safe diagnostics without leaking sensitive payloads", async () => {
  const cases: Array<{
    code: string;
    httpStatus: number;
    statusClass: FacebookRetrievalHttpStatusClass;
  }> = [
    { code: "FACEBOOK_COBALT_UNREACHABLE", httpStatus: 502, statusClass: null },
    { code: "FACEBOOK_COBALT_FAILED", httpStatus: 422, statusClass: "4xx" },
    { code: "FACEBOOK_RETRIEVAL_INVALID_JSON", httpStatus: 502, statusClass: "2xx" },
    { code: "FACEBOOK_COBALT_NO_DIRECT_MEDIA", httpStatus: 422, statusClass: "2xx" }
  ];

  for (const item of cases) {
    const retriever: FacebookMediaRetriever = {
      provider: "cobalt",
      async retrieve() {
        throw new FacebookMediaRetrievalError(
          item.code,
          "sensitive provider body https://private.example/?token=SECRET",
          item.httpStatus,
          false,
          "cobalt",
          null,
          null,
          item.statusClass
        );
      }
    };
    const pipeline = new DefaultManagedFacebookPipeline(
      retriever,
      null,
      new AssemblyAiFacebookMediaStt("mock-only-key")
    );
    const app = service(pipeline, new DurableTestStore());
    const warnings: string[] = [];
    const originalWarn = console.warn;
    console.warn = (...args: unknown[]) => warnings.push(args.map(String).join(" "));
    let waiting;
    try {
      waiting = await app.startFacebookFallback({
        url: FACEBOOK_URL,
        language_hint: "auto",
        beta_access_code: ACCESS_CODE
      });
    } finally {
      console.warn = originalWarn;
    }

    assert.equal(waiting.status, "AWAITING_RETRIEVAL_CONSENT");
    assert.equal(waiting.credits_charged, 0);
    assert.equal(waiting.free_retrieval_error_code, item.code);
    assert.equal(waiting.free_retrieval_provider, "cobalt");
    assert.equal(waiting.free_retrieval_http_status_class, item.statusClass);
    assert.equal(waiting.error, null);
    const log = warnings.join("\n");
    assert.match(log, /facebook_free_retrieval_failed/);
    assert.match(log, new RegExp(item.code));
    assert.doesNotMatch(log, /facebook\.com|private\.example|SECRET|OWNER_A97B_TEST_2026/);
  }
});

'''
          replace_once(tests, marker, addition + marker)
          PY

      - name: Install cloud dependencies
        working-directory: src/cloud
        run: npm ci

      - name: Run cloud build and full test suite
        working-directory: src/cloud
        run: npm run check

      - name: Scope and safety gate
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 4
          printf '%s\n' "$changed" | grep -Fx 'src/cloud/src/facebook_media_retrieval.ts'
          printf '%s\n' "$changed" | grep -Fx 'src/cloud/src/facebook_managed_pipeline.ts'
          printf '%s\n' "$changed" | grep -Fx 'src/cloud/src/managed_media_service.ts'
          printf '%s\n' "$changed" | grep -Fx 'src/cloud/tests/managed_facebook_fallback.test.ts'
          ! git diff | grep -E 'SCRAPECREATORS_API_KEY|SUPADATA_API_KEY|ASSEMBLYAI_API_KEY|KRC_MEDIA_COBALT_API_KEY'

      - name: Commit code-only hardening
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cloud/src/facebook_media_retrieval.ts \
                  src/cloud/src/facebook_managed_pipeline.ts \
                  src/cloud/src/managed_media_service.ts \
                  src/cloud/tests/managed_facebook_fallback.test.ts
          git commit -m 'A9.7-I preserve free Cobalt failure diagnostics'
          git push origin HEAD:agent/krc-media-transcript
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.7-I DIAG-FIX code-only observability hardening: **PASS**. sha=\`${SHA}\`. Durable free-Cobalt diagnostics now preserve safe error code/provider/HTTP-status-class and emit a structured log without source/media URL, provider body, access code, or secret. Mock regression covers UNREACHABLE, FAILED, INVALID_JSON, NO_DIRECT_MEDIA. Full cloud \`npm run check\` passed. No Facebook/Cobalt/AssemblyAI/ScrapeCreators/Supadata/Render endpoint or deploy was called by this workflow; production/main/merge were not targeted."
