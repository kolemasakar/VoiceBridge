name: A9.10 Attachment Probe Live Gate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-10-attachment-probe-live-gate.yml
      - src/cloud/src/managed_attachment_probe.ts
      - src/cloud/src/managed_attachment_probe_http.ts
      - src/cloud/tests/managed_attachment_probe.test.ts

permissions:
  contents: read

concurrency:
  group: a9-10-attachment-probe-live-gate
  cancel-in-progress: false

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com

jobs:
  live-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/krc-media-transcript
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/cloud/package-lock.json

      - name: Validate attachment probe before any deploy
        working-directory: src/cloud
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          grep -Fq 'OPENAI_FILE_HOST_SUFFIX = ".oaiusercontent.com"' src/managed_attachment_probe.ts
          grep -Fq 'isAllowedOpenAiFileHost' src/managed_attachment_probe.ts
          grep -Fq 'observed_host=' src/managed_attachment_probe.ts
          grep -Fq 'redirect: "manual"' src/managed_attachment_probe.ts
          grep -Fq 'MANAGED_ATTACHMENT_PROBE_MAX_BYTES = 64 * 1024' src/managed_attachment_probe.ts
          grep -Fq 'retrieval_credits_charged: 0' src/managed_attachment_probe_http.ts
          grep -Fq 'stt_seconds_charged: 0' src/managed_attachment_probe_http.ts
          if grep -Eq 'AssemblyAi|assemblyAiApiKey|startManagedAttachmentTranscription' src/managed_attachment_probe.ts src/managed_attachment_probe_http.ts; then
            echo 'Attachment transport probe must remain non-STT.' >&2
            exit 1
          fi
          echo "A9.10 local validation: PASS"

      - name: Verify isolated Render identity and branch
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}" || { echo "RENDER_API_KEY missing" >&2; exit 1; }
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]] || { echo "Render service lookup failed HTTP $code" >&2; rm -f "$tmp"; exit 1; }
          name="$(jq -r '.name // empty' "$tmp")"
          branch="$(jq -r '.branch // empty' "$tmp")"
          rm -f "$tmp"
          [[ "$name" == "$SERVICE_NAME" ]] || { echo "Unexpected Render service: $name" >&2; exit 1; }
          [[ "$branch" == "$REQUIRED_BRANCH" ]] || { echo "Unexpected Render branch: $branch" >&2; exit 1; }
          [[ "$GITHUB_REF_NAME" == "$REQUIRED_BRANCH" ]] || { echo "Workflow ref is not isolated feature branch" >&2; exit 1; }
          echo "Isolation boundary: PASS / service=$name / branch=$branch"

      - name: Deploy exact validated commit to isolated beta
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg commitId "$GITHUB_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            -X POST "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            --data "$payload")"
          [[ "$code" == 201 || "$code" == 202 ]] || {
            echo "Render deploy request failed HTTP $code" >&2
            rm -f "$tmp"
            exit 1
          }
          deploy_id="$(jq -r '(.deploy // .).id // empty' "$tmp")"
          rm -f "$tmp"
          test -n "$deploy_id" || { echo "Render deploy ID missing" >&2; exit 1; }
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Isolated deploy requested: $deploy_id / commit=$GITHUB_SHA"

      - name: Wait for exact commit to become live
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == 200 ]] || { rm -f "$tmp"; echo "Deploy status lookup failed HTTP $code" >&2; exit 1; }
            status="$(jq -r '(.deploy // .).status // "unknown"' "$tmp")"
            commit="$(jq -r '(.deploy // .).commit.id // (.deploy // .).commitId // "unknown"' "$tmp")"
            rm -f "$tmp"
            case "$status" in
              live)
                [[ "$commit" == "$GITHUB_SHA" ]] || { echo "Live deploy commit mismatch: $commit" >&2; exit 1; }
                echo "Isolated deploy live: $DEPLOY_ID / commit=$commit"
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "Isolated deploy failed: $status" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for A9.10 isolated deploy." >&2
          exit 1

      - name: Load masked Action bearer from isolated service
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]] || { echo "Action token lookup failed HTTP $code" >&2; rm -f "$tmp"; exit 1; }
          action_token="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
          rm -f "$tmp"
          test -n "$action_token" || { echo "KRC_MEDIA_ACTION_TOKEN missing" >&2; exit 1; }
          echo "::add-mask::$action_token"
          printf '%s' "$action_token" > /tmp/krc-media-action-token
          echo "Masked Action bearer: READY"

      - name: Verify existing managed media regression boundary
        shell: bash
        run: |
          set -euo pipefail
          action_token="$(cat /tmp/krc-media-action-token)"
          health_code="$(curl -sS --retry 8 --retry-delay 5 --max-time 120 \
            -o /tmp/health.json -w '%{http_code}' "${BASE_URL}/api/v1/health")"
          [[ "$health_code" == 200 ]] || { echo "Health failed HTTP $health_code" >&2; exit 1; }
          capability_code="$(curl -sS --max-time 60 -o /tmp/capability.json -w '%{http_code}' \
            "${BASE_URL}/api/v1/media/managed" \
            -H "Authorization: Bearer ${action_token}" -H 'Accept: application/json')"
          [[ "$capability_code" == 200 ]] || { echo "Managed capability failed HTTP $capability_code" >&2; exit 1; }
          jq -e '.configured == true' /tmp/capability.json >/dev/null
          echo "Existing managed media capability: PASS"

      - name: Verify attachment probe auth and runtime parser without file transfer
        shell: bash
        run: |
          set -euo pipefail
          action_token="$(cat /tmp/krc-media-action-token)"
          payload='{"openaiFileIdRefs":["file-placeholder"]}'

          unauth_code="$(curl -sS --max-time 60 -o /tmp/probe-unauth.json -w '%{http_code}' \
            -X POST "${BASE_URL}/api/v1/media/managed/attachment-probe" \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data "$payload")"
          [[ "$unauth_code" == 401 ]] || {
            echo "Attachment probe unauthenticated boundary expected 401, got $unauth_code" >&2
            cat /tmp/probe-unauth.json >&2 || true
            exit 1
          }

          auth_code="$(curl -sS --max-time 60 -o /tmp/probe-placeholder.json -w '%{http_code}' \
            -X POST "${BASE_URL}/api/v1/media/managed/attachment-probe" \
            -H "Authorization: Bearer ${action_token}" \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data "$payload")"
          [[ "$auth_code" == 400 ]] || {
            echo "Attachment probe placeholder boundary expected 400, got $auth_code" >&2
            cat /tmp/probe-placeholder.json >&2 || true
            exit 1
          }
          jq -e '.error.code == "INVALID_REQUEST"' /tmp/probe-placeholder.json >/dev/null
          echo "A9.10 deployed endpoint/auth/parser: PASS"
          echo "No file download, AssemblyAI, Supadata, retrieval credit, or STT operation was invoked."
