name: A9.6 Facebook Failure Accounting Hardening

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/triggers/a9-6-facebook-failure-accounting-hardening.txt
      - src/cloud/**
      - .github/workflows/a9-6-facebook-failure-accounting-hardening.yml

permissions:
  contents: read

concurrency:
  group: a9-6-facebook-failure-accounting-hardening
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated beta branch
        uses: actions/checkout@v4
        with:
          ref: agent/krc-media-transcript
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/cloud/package-lock.json

      - name: Install cloud dependencies
        working-directory: src/cloud
        run: npm ci

      - name: Build and run cloud checks
        working-directory: src/cloud
        run: npm run check

      - name: Validate A9 no automatic paid fallback regression
        run: |
          echo "A9 regression included in cloud test suite"
          echo "Expected: Cobalt fail -> unavailable / no automatic paid fallback"
