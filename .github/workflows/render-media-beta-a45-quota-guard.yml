name: Render MEDIA BETA A4.5 Quota Guard
# Restore isolated-beta quota after live negative-path acceptance. Trigger: 2026-08-18T04:12Z.

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/render-media-beta-a45-quota-guard.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: render-media-beta-a45-quota-guard
  cancel-in-progress: false

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  HEALTH_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com/api/v1/health
  NORMAL_DAILY_STT_SECONDS: "7200"

jobs:
  restore-deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Verify isolated service identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}" || { echo 'RENDER_API_KEY missing' >&2; exit 1; }
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]] || { rm -f "$tmp"; echo "Service lookup HTTP $code" >&2; exit 1; }
          name="$(jq -r '.name // empty' "$tmp")"
          rm -f "$tmp"
          [[ "$name" == "$SERVICE_NAME" ]] || { echo 'Isolation guard failed' >&2; exit 1; }

      - name: Restore daily STT limit to 7200 seconds
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg value "$NORMAL_DAILY_STT_SECONDS" '{value:$value}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            -X PUT "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/MEDIA_DAILY_STT_SECONDS" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            --data "$payload")"
          rm -f "$tmp"
          [[ "$code" == 200 ]] || { echo "Env update HTTP $code" >&2; exit 1; }
          echo 'MEDIA_DAILY_STT_SECONDS=7200 restored on isolated beta.'

      - name: Deploy isolated beta
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg commitId "$GITHUB_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            -X POST "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            --data "$payload")"
          [[ "$code" == 201 || "$code" == 202 ]] || { cat "$tmp" >&2; rm -f "$tmp"; exit 1; }
          id="$(jq -r '(.deploy // .).id // empty' "$tmp")"
          rm -f "$tmp"
          test -n "$id"
          echo "deploy_id=$id" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == 200 ]] || { rm -f "$tmp"; exit 1; }
            status="$(jq -r '(.deploy // .).status // "unknown"' "$tmp")"
            rm -f "$tmp"
            echo "Deploy status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 5
          done
          exit 1

      - name: Verify beta health
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 5 --retry-delay 3 --max-time 90 -o /tmp/health.json -w '%{http_code}' "$HEALTH_URL")"
          [[ "$code" == 200 ]]
          jq -e '.status == "ok" and .capabilities.media_client_ingest.durable_store == "postgres"' /tmp/health.json >/dev/null

      - name: Report restore to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "MEDIA BETA A4.5 quota restore: **${WORKFLOW_STATUS^^}**. \`MEDIA_DAILY_STT_SECONDS=7200\` on isolated target \`voicebridge-krc-media-beta-kolemasakar\`. Production was not targeted. Commit: \`${GITHUB_SHA}\`."
