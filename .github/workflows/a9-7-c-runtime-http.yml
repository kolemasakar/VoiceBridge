name: A9.7-C Runtime HTTP Code Only

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/triggers/a9-7-c-runtime-http.txt

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: a9-7-c-runtime-http
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/krc-media-transcript
          fetch-depth: 0

      - name: Apply A9.7-C runtime and HTTP patch
        id: patch
        shell: bash
        run: |
          set +e
          python3 scripts/a9_7_c_runtime_http_patch_v2.py > a9_7_c_patch.log 2>&1
          status=$?
          cat a9_7_c_patch.log
          diagnostic="$(tail -n 1 a9_7_c_patch.log | tr '\n' ' ' | cut -c1-240)"
          echo "diagnostic=${diagnostic}" >> "$GITHUB_OUTPUT"
          if [[ $status -ne 0 ]]; then
            exit $status
          fi
          echo "patch=success" >> "$GITHUB_OUTPUT"

      - name: Install cloud dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd src/cloud
          npm ci

      - name: Run full cloud check
        id: check
        shell: bash
        run: |
          set +e
          cd src/cloud
          npm run check > ../../a9_7_c_check.log 2>&1
          status=$?
          cat ../../a9_7_c_check.log
          diagnostic="$(tail -n 1 ../../a9_7_c_check.log | tr '\n' ' ' | cut -c1-240)"
          echo "diagnostic=${diagnostic}" >> "$GITHUB_OUTPUT"
          if [[ $status -ne 0 ]]; then
            exit $status
          fi
          echo "cloud_check=success" >> "$GITHUB_OUTPUT"

      - name: Enforce A9.7-C source scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only)"
          printf '%s\n' "$files"
          test -n "$files"
          bad="$(printf '%s\n' "$files" | grep -Ev '^(src/cloud/src/config\.ts|src/cloud/src/managed_media_http\.ts|src/cloud/tests/managed_media_http\.test\.ts|src/cloud/\.env\.example)$' || true)"
          test -z "$bad"
          echo "scope=success" >> "$GITHUB_OUTPUT"

      - name: Commit tested A9.7-C source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/cloud/src/config.ts \
            src/cloud/src/managed_media_http.ts \
            src/cloud/tests/managed_media_http.test.ts \
            src/cloud/.env.example
          git commit -m "A9.7-C wire Facebook retrieval runtime and HTTP Actions"
          git push origin HEAD:agent/krc-media-transcript
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit=success" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        shell: bash
        env:
          PATCH: ${{ steps.patch.outputs.patch }}
          PATCH_DIAG: ${{ steps.patch.outputs.diagnostic }}
          CHECK: ${{ steps.check.outputs.cloud_check }}
          CHECK_DIAG: ${{ steps.check.outputs.diagnostic }}
          SCOPE: ${{ steps.scope.outputs.scope }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then result=PASS; else result=FAIL; fi
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.7-C runtime HTTP code-only runner V2: **${result}**. patch=\`${PATCH:-failed}\`, patch_diag=\`${PATCH_DIAG:-none}\`, cloud_check=\`${CHECK:-failed}\`, check_diag=\`${CHECK_DIAG:-none}\`, scope=\`${SCOPE:-failed}\`, commit=\`${COMMIT:-failed}\`, sha=\`${SHA:-none}\`. Runtime factory wires configured Cobalt/ScrapeCreators/AssemblyAI adapters into ManagedMediaService; HTTP adds free Facebook fallback plus local paid-retrieval preflight and exact one-credit continuation. Tests are mock-only. No Render deploy and no Cobalt/ScrapeCreators/Supadata/AssemblyAI provider endpoint was called by this workflow. Production/main were not targeted."
