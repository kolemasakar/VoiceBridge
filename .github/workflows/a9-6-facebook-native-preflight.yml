name: A9.6 Facebook Native Preflight

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-native-preflight.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: a9-6-facebook-native-preflight
  cancel-in-progress: false

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  FACEBOOK_PREFLIGHT_URL: https://www.facebook.com/reel/1114235920664408

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Enforce isolated target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}" || { echo "RENDER_API_KEY missing" >&2; exit 1; }
          [[ "${GITHUB_REF_NAME}" == "${REQUIRED_BRANCH}" ]] || { echo "Unexpected branch" >&2; exit 1; }
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]] || { echo "Service lookup failed HTTP $code" >&2; rm -f "$tmp"; exit 1; }
          name="$(jq -r '.name // empty' "$tmp")"
          branch="$(jq -r '.branch // empty' "$tmp")"
          rm -f "$tmp"
          [[ "$name" == "$SERVICE_NAME" ]] || { echo "Isolation guard failed" >&2; exit 1; }
          [[ "$branch" == "$REQUIRED_BRANCH" ]] || { echo "Branch guard failed" >&2; exit 1; }
          echo "Isolated target verified."

      - name: Deploy exact feature commit
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg commitId "$GITHUB_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            -X POST "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            --data "$payload")"
          [[ "$code" == 201 || "$code" == 202 ]] || { echo "Deploy failed HTTP $code" >&2; cat "$tmp" >&2; rm -f "$tmp"; exit 1; }
          deploy_id="$(jq -r '(.deploy // .).id // empty' "$tmp")"
          rm -f "$tmp"
          test -n "$deploy_id" || { echo "Deploy ID missing" >&2; exit 1; }
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Deploy accepted for exact feature SHA."

      - name: Wait for isolated deploy
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 72); do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == 200 ]] || { rm -f "$tmp"; echo "Deploy status HTTP $code" >&2; exit 1; }
            status="$(jq -r '(.deploy // .).status // "unknown"' "$tmp")"
            rm -f "$tmp"
            case "$status" in
              live) echo "Deploy live."; exit 0 ;;
              build_failed|update_failed|canceled|deactivated) echo "Deploy failed: $status" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo "Deploy timeout" >&2
          exit 1

      - name: Read and mask Action bearer
        id: action
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]] || { rm -f "$tmp"; echo "Action token lookup HTTP $code" >&2; exit 1; }
          token="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
          rm -f "$tmp"
          test -n "$token" || { echo "Action token missing" >&2; exit 1; }
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Verify Facebook capability without transcript request
        env:
          ACTION_TOKEN: ${{ steps.action.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 90 -o /tmp/capability.json -w '%{http_code}' \
            "${BETA_BASE_URL}/api/v1/media/managed" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${ACTION_TOKEN}")"
          [[ "$code" == 200 ]] || { echo "Capability HTTP $code" >&2; exit 1; }
          jq -e '
            .configured == true and
            (.platforms | index("youtube") != null) and
            (.platforms | index("instagram") != null) and
            (.platforms | index("facebook") != null) and
            .automatic_ai_fallback == false and
            .instagram_reel_ai_fallback == true and
            .facebook_ai_fallback == false
          ' /tmp/capability.json >/dev/null
          echo "Facebook native capability: PASS."

      - name: Run nonbillable Facebook native preflight only
        id: quote
        env:
          ACTION_TOKEN: ${{ steps.action.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg url "$FACEBOOK_PREFLIGHT_URL" '{url:$url,language_hint:"auto"}')"
          code="$(curl -sS --max-time 90 -o /tmp/facebook-quote.json -w '%{http_code}' \
            -X POST "${BETA_BASE_URL}/api/v1/media/managed/preflight" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${ACTION_TOKEN}" \
            --data "$payload")"
          [[ "$code" == 200 ]] || { echo "Facebook preflight HTTP $code" >&2; cat /tmp/facebook-quote.json >&2; exit 1; }
          jq -e '
            .provider == "supadata" and
            .mode == "native" and
            .estimated_credits == 1 and
            .consent_required == true and
            .can_continue == true and
            (.source_url | startswith("https://www.facebook.com/reel/"))
          ' /tmp/facebook-quote.json >/dev/null
          available="$(jq -r '.credits_available' /tmp/facebook-quote.json)"
          after="$(jq -r '.credits_after_estimate' /tmp/facebook-quote.json)"
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          jq -c '{provider,mode,source_url,credits_available,estimated_credits,credits_after_estimate,can_continue}' /tmp/facebook-quote.json
          echo "No POST /transcriptions and no provider transcript request was called by this workflow."

      - name: Report Facebook preflight
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AVAILABLE: ${{ steps.quote.outputs.available }}
          AFTER: ${{ steps.quote.outputs.after }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then
            body="A9.6 Facebook native preflight: **SUCCESS**. Commit: \`${GITHUB_SHA}\`; isolated target only; URL shape: \`${FACEBOOK_PREFLIGHT_URL}\`; available=\`${AVAILABLE}\`; estimated native cost=\`1\`; after estimate=\`${AFTER}\`; capability includes \`youtube + instagram + facebook\`; \`facebook_ai_fallback=false\`. This workflow called capability and native preflight only; **no transcript request was started and no transcript credit was authorized**. Production/main were not targeted."
          else
            body="A9.6 Facebook native preflight: **FAILURE**. Commit: \`${GITHUB_SHA}\`; isolated target only. No transcript request is authorized by this workflow. Production/main were not targeted."
          fi
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "$body"
