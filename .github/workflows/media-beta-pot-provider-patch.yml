name: Apply MEDIA BETA PO Token Provider

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/media-beta-pot-provider-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/krc-media-transcript

      - name: Patch yt-dlp client and runtime arguments
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path('src/cloud/src/media_beta_service.ts'),
              Path('src/cloud/src/youtube_captions.ts'),
          ]
          old = 'youtube:player_client=web_embedded,android_vr'
          new = 'youtube:player_client=mweb'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected extractor client anchor missing in {path}')
              text = text.replace(old, new)
              # Every yt-dlp invocation that uses extractor args also gets explicit Node EJS runtime.
              text = text.replace(
                  '"--extractor-args",\n    "youtube:player_client=mweb",',
                  '"--extractor-args",\n    "youtube:player_client=mweb",\n    "--js-runtimes",\n    "node",'
              )
              text = text.replace(
                  '"--extractor-args",\n      "youtube:player_client=mweb",',
                  '"--extractor-args",\n      "youtube:player_client=mweb",\n      "--js-runtimes",\n      "node",'
              )
              path.write_text(text, encoding='utf-8')

      - name: Install in-container yt-dlp PO provider stack
        shell: bash
        run: |
          cat > src/cloud/Dockerfile <<'EOF'
          FROM node:24-alpine AS build

          WORKDIR /app

          COPY package.json package-lock.json ./
          RUN npm ci

          COPY tsconfig.json ./
          COPY src ./src
          COPY tests ./tests
          RUN npm run build

          FROM node:24-bookworm-slim AS pot-build

          RUN apt-get update \
            && apt-get install -y --no-install-recommends \
              ca-certificates git python3 make g++ pkg-config \
              libcairo2-dev libpango1.0-dev libjpeg62-turbo-dev libgif-dev librsvg2-dev \
            && rm -rf /var/lib/apt/lists/*

          WORKDIR /opt/bgutil-src
          RUN git clone --depth 1 --branch 1.3.1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git .

          WORKDIR /opt/bgutil-src/server
          RUN npm ci --no-audit --no-fund && npx tsc

          FROM node:24-bookworm-slim AS runtime

          ENV NODE_ENV=production
          ENV PATH="/opt/ytdlp/bin:${PATH}"
          WORKDIR /app

          RUN apt-get update \
            && apt-get install -y --no-install-recommends \
              ca-certificates python3 python3-venv ffmpeg \
              libcairo2 libpango-1.0-0 libjpeg62-turbo libgif7 librsvg2-2 \
            && rm -rf /var/lib/apt/lists/* \
            && python3 -m venv /opt/ytdlp \
            && /opt/ytdlp/bin/pip install --no-cache-dir --upgrade pip \
            && /opt/ytdlp/bin/pip install --no-cache-dir \
              "yt-dlp[default]==2026.07.04" \
              "bgutil-ytdlp-pot-provider==1.3.1"

          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev

          COPY --from=build /app/dist ./dist
          COPY --from=pot-build /opt/bgutil-src/server/build /opt/bgutil/build
          COPY --from=pot-build /opt/bgutil-src/server/node_modules /opt/bgutil/node_modules
          COPY --from=pot-build /opt/bgutil-src/server/package.json /opt/bgutil/package.json

          EXPOSE 8080

          USER node

          CMD ["sh", "-c", "node /opt/bgutil/build/main.js --port 4416 >/tmp/bgutil-provider.log 2>&1 & sleep 1; exec node dist/src/index.js"]
          EOF

      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cloud/src/media_beta_service.ts src/cloud/src/youtube_captions.ts src/cloud/Dockerfile
          git diff --cached --check
          git commit -m 'MEDIA_BETA_PO_TOKEN_PROVIDER'
          git push origin HEAD:agent/krc-media-transcript
