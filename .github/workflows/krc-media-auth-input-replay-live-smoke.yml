name: KRC MEDIA Auth Input Replay Live Smoke

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/krc-media-auth-input-replay-live-smoke.yml

permissions:
  contents: read

concurrency:
  group: krc-media-auth-input-replay-live-smoke
  cancel-in-progress: false

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  HARDENED_SHA: e83a13a09b9bbcf293fb4f2d705f4ea7f15712b7

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      KRC_NEON_DATABASE_URL: ${{ secrets.KRC_NEON_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify isolated target and protected Neon store
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          test -n "${KRC_NEON_DATABASE_URL:-}"
          echo "::add-mask::$RENDER_API_KEY"
          echo "::add-mask::$KRC_NEON_DATABASE_URL"

          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == "200" ]]
          [[ "$(jq -r '.name // empty' "$tmp")" == "$SERVICE_NAME" ]]
          [[ "$(jq -r '.branch // empty' "$tmp")" == "$REQUIRED_BRANCH" ]]
          rm -f "$tmp"

          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_DATABASE_URL" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == "200" ]]
          current_db="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
          rm -f "$tmp"
          test -n "$current_db"
          echo "::add-mask::$current_db"
          [[ "$current_db" == "$KRC_NEON_DATABASE_URL" ]]

          max_body=32768
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/MAX_REQUEST_BODY_BYTES" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}" || true)"
          if [[ "$code" == "200" ]]; then
            configured_max="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
            if [[ "$configured_max" =~ ^[0-9]+$ ]]; then max_body="$configured_max"; fi
          fi
          rm -f "$tmp"
          [[ "$max_body" -ge 1024 && "$max_body" -le 1048576 ]]
          printf '%s' "$max_body" > /tmp/max-body-bytes

      - name: Deploy exact hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg commitId "$HARDENED_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}" --data "$payload")"
          [[ "$code" == "201" || "$code" == "202" ]]
          deploy_id="$(jq -r '(.deploy // .).id // empty' "$tmp")"
          rm -f "$tmp"
          test -n "$deploy_id"
          live=0
          for i in $(seq 1 150); do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${deploy_id}" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == "200" ]]
            status="$(jq -r '(.deploy // .).status // "unknown"' "$tmp")"
            commit="$(jq -r '(.deploy // .).commit.id // (.deploy // .).commitId // "unknown"' "$tmp")"
            rm -f "$tmp"
            if [[ "$status" == "live" ]]; then
              [[ "$commit" == "$HARDENED_SHA" ]]
              live=1
              break
            fi
            case "$status" in build_failed|update_failed|canceled|deactivated) exit 1 ;; esac
            sleep 5
          done
          [[ "$live" == "1" ]]

      - name: Load masked Action bearer
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == "200" ]]
          token="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
          rm -f "$tmp"
          test -n "$token"
          echo "::add-mask::$token"
          umask 077
          printf '%s' "$token" > /tmp/krc-media-action-token

      - name: Verify auth input replay negative matrix without provider work
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/krc-media-action-token)"
          echo "::add-mask::$token"

          expect_json_error() {
            local label="$1" method="$2" path="$3" authorization="$4" body_file="$5" expected_status="$6" expected_code="$7" out="$8"
            local args=(curl -sS --max-time 60 -o "$out" -w '%{http_code}' -X "$method" "${BASE_URL}${path}" -H 'Accept: application/json')
            if [[ -n "$authorization" ]]; then args+=(-H "Authorization: $authorization"); fi
            if [[ -n "$body_file" ]]; then args+=(-H 'Content-Type: application/json' --data-binary "@$body_file"); fi
            local code actual_code
            code="$("${args[@]}")"
            actual_code="$(jq -r '.error.code // empty' "$out" 2>/dev/null || true)"
            echo "$label: HTTP=$code CODE=${actual_code:-NON_JSON_OR_EMPTY}"
            [[ "$code" == "$expected_status" ]]
            [[ "$actual_code" == "$expected_code" ]]
          }

          printf '%s' '{"url":"https://www.youtube.com/watch?v=dQw4w9WgXcQ"}' > /tmp/good.json
          printf '%s' '{not-json' > /tmp/malformed.json
          max_body="$(cat /tmp/max-body-bytes)"
          python - "$max_body" <<'PY'
          import json, sys
          maximum = int(sys.argv[1])
          with open('/tmp/oversized.json','w',encoding='utf-8') as f:
              json.dump({'url':'https://www.youtube.com/watch?v=dQw4w9WgXcQ','padding':'x'*(maximum + 2048)}, f)
          PY

          expect_json_error missing-bearer POST /api/v1/media/managed/preflight '' /tmp/good.json 401 AUTHENTICATION_REQUIRED /tmp/a.json
          expect_json_error invalid-bearer POST /api/v1/media/managed/preflight 'Bearer definitely-wrong-token' /tmp/good.json 401 AUTHENTICATION_FAILED /tmp/b.json
          expect_json_error malformed-json POST /api/v1/media/managed/preflight "Bearer $token" /tmp/malformed.json 400 INVALID_REQUEST /tmp/c.json
          expect_json_error oversized-json POST /api/v1/media/managed/preflight "Bearer $token" /tmp/oversized.json 413 REQUEST_BODY_TOO_LARGE /tmp/d.json
          expect_json_error wrong-method GET /api/v1/media/managed/preflight "Bearer $token" '' 404 NOT_FOUND /tmp/e.json
          expect_json_error malformed-job-id GET /api/v1/media/managed/transcriptions/not-a-job "Bearer $token" '' 404 NOT_FOUND /tmp/f.json
          expect_json_error pagination-injection GET '/api/v1/media/managed/transcriptions/KRCM_safe123/segments?cursor=0%20OR%201%3D1' "Bearer $token" '' 400 INVALID_PAGINATION /tmp/g.json
          expect_json_error pagination-range GET '/api/v1/media/managed/transcriptions/KRCM_safe123/segments?limit=51' "Bearer $token" '' 400 INVALID_PAGINATION /tmp/h.json

          echo 'Auth/input/replay live smoke passed: all requests terminated before provider-consuming work or durable-store mutation.'

      - name: Publish sanitized summary
        shell: bash
        run: |
          {
            echo '# KRC MEDIA auth/input/replay live smoke'
            echo
            echo '- Exact hardened runtime deployed: `PASS`'
            echo '- Protected Neon durable-store target unchanged: `PASS`'
            echo '- Missing/invalid bearer boundary: `PASS`'
            echo '- Malformed/oversized JSON boundary: `PASS`'
            echo '- Wrong method and malformed job ID fail closed: `PASS`'
            echo '- Pagination injection/out-of-range rejected before service read: `PASS`'
            echo '- Provider-consuming work invoked by smoke: `NO`'
            echo '- Database mutation requested: `NONE`'
            echo '- Render environment mutation: `NONE`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup runner material
        if: always()
        shell: bash
        run: |
          sudo rm -f /tmp/krc-media-action-token /tmp/max-body-bytes /tmp/good.json /tmp/malformed.json /tmp/oversized.json /tmp/a.json /tmp/b.json /tmp/c.json /tmp/d.json /tmp/e.json /tmp/f.json /tmp/g.json /tmp/h.json >/dev/null 2>&1 || true
