name: KRC MEDIA Internal DB Audit Live

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - src/cloud/src/internal_db_audit_http.ts
      - src/cloud/src/managed_server.ts
      - .github/workflows/krc-media-internal-db-audit-live.yml

permissions:
  contents: read

concurrency:
  group: krc-media-internal-db-audit-live
  cancel-in-progress: false

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  AUDIT_PATH: /api/v1/media/internal-db-audit

jobs:
  audit:
    name: Deploy and run owner-only read-only DB audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Verify isolated Render target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}" || { echo "RENDER_API_KEY is not configured"; exit 1; }
          echo "::add-mask::$RENDER_API_KEY"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == "200" ]]
          [[ "$(jq -r '.name // empty' "$tmp")" == "$SERVICE_NAME" ]]
          [[ "$(jq -r '.branch // empty' "$tmp")" == "$REQUIRED_BRANCH" ]]
          rm -f "$tmp"
          echo "Isolated Render target verified."

      - name: Deploy exact feature-branch commit
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg commitId "$GITHUB_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST \
            "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            --data "$payload")"
          [[ "$code" == "201" || "$code" == "202" ]]
          deploy_id="$(jq -r '(.deploy // .).id // empty' "$tmp")"
          rm -f "$tmp"
          test -n "$deploy_id"

          for i in $(seq 1 120); do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${deploy_id}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == "200" ]]
            status="$(jq -r '(.deploy // .).status // "unknown"' "$tmp")"
            commit="$(jq -r '(.deploy // .).commit.id // (.deploy // .).commitId // "unknown"' "$tmp")"
            rm -f "$tmp"
            if [[ "$status" == "live" ]]; then
              [[ "$commit" == "$GITHUB_SHA" ]]
              echo "live_sha=$commit" >> "$GITHUB_OUTPUT"
              echo "Exact feature-branch commit is live on isolated service."
              exit 0
            fi
            case "$status" in
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for isolated deploy."
          exit 1

      - name: Load owner Action token without exposing it
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == "200" ]]
          token="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
          rm -f "$tmp"
          test -n "$token"
          echo "::add-mask::$token"
          umask 077
          printf '%s' "$token" > /tmp/krc-media-action-token
          echo "Owner Action token loaded and masked."

      - name: Run audit or verify cleanup
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/krc-media-action-token)"
          echo "::add-mask::$token"

          if [[ -f src/cloud/src/internal_db_audit_http.ts ]]; then
            unauth="$(curl -sS --max-time 60 -o /tmp/unauth.json -w '%{http_code}' \
              "${BETA_BASE_URL}${AUDIT_PATH}")"
            [[ "$unauth" == "401" ]]

            wrong_method="$(curl -sS --max-time 60 -o /tmp/method.json -w '%{http_code}' -X POST \
              "${BETA_BASE_URL}${AUDIT_PATH}" \
              -H "Authorization: Bearer ${token}")"
            [[ "$wrong_method" == "405" ]]

            audit_code="$(curl -sS --max-time 90 -o /tmp/audit.json -w '%{http_code}' \
              "${BETA_BASE_URL}${AUDIT_PATH}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${token}")"
            [[ "$audit_code" == "200" ]]
            jq -e '
              .mode == "read_only_internal_audit" and
              .read_only == true and
              .database.transaction_read_only == "on" and
              .database.default_transaction_read_only == "on" and
              (.database.size_bytes | type == "number") and
              (.tables | type == "array") and
              (.columns | type == "array") and
              (.constraints | type == "array") and
              (.indexes | type == "array") and
              (.row_counts.krc_managed_media_jobs | type == "number") and
              (.row_counts.krc_media_client_jobs | type == "number") and
              (.row_counts.krc_media_stt_charges | type == "number")
            ' /tmp/audit.json >/dev/null

            schema_hash="$(jq -c '{tables,columns,constraints,indexes,sequences,extensions}' /tmp/audit.json | sha256sum | awk '{print $1}')"
            echo "mode=audit" >> "$GITHUB_OUTPUT"
            echo "schema_hash=$schema_hash" >> "$GITHUB_OUTPUT"
            echo "Internal read-only DB audit PASS."
          else
            removed_code="$(curl -sS --max-time 60 -o /tmp/removed.json -w '%{http_code}' \
              "${BETA_BASE_URL}${AUDIT_PATH}" \
              -H "Authorization: Bearer ${token}")"
            [[ "$removed_code" == "404" ]]

            capability_code="$(curl -sS --max-time 60 -o /tmp/capability.json -w '%{http_code}' \
              "${BETA_BASE_URL}/api/v1/media/managed" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${token}")"
            [[ "$capability_code" == "200" ]]
            jq -e '.mode == "zero_client_managed_beta" and .configured == true' /tmp/capability.json >/dev/null
            echo "mode=cleanup" >> "$GITHUB_OUTPUT"
            echo "Temporary audit endpoint removal PASS."
          fi

      - name: Publish sanitized audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "# KRC MEDIA internal DB audit"
            echo
            echo "- Isolated service: \`${SERVICE_NAME}\`"
            echo "- Feature branch: \`${REQUIRED_BRANCH}\`"
            echo "- Exact live SHA: \`${{ steps.deploy.outputs.live_sha || 'unavailable' }}\`"
            echo "- Mode: \`${{ steps.probe.outputs.mode || 'failed' }}\`"
            echo "- No provider request or transcription start is performed."
            echo "- No Render environment variable is changed."
            echo "- No Neon resource is created."
            if [[ -f /tmp/audit.json ]]; then
              echo "- Schema SHA256: \`${{ steps.probe.outputs.schema_hash }}\`"
              echo
              echo '```json'
              jq '{database,tables,columns,constraints,indexes,sequences,extensions,row_counts,managed_status_distribution,managed_timestamp_range,client_status_distribution,client_timestamp_range,stt_charge_range}' /tmp/audit.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary local material
        if: always()
        shell: bash
        run: |
          rm -f /tmp/krc-media-action-token /tmp/unauth.json /tmp/method.json /tmp/audit.json /tmp/removed.json /tmp/capability.json
