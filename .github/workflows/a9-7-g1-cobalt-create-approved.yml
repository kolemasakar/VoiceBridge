name: A9.7-G1 Cobalt Create Approved

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/triggers/a9-7-g1-cobalt-create-approved.txt
      - .github/workflows/a9-7-g1-cobalt-create-approved.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: a9-7-g1-cobalt-create-approved
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      RENDER_API_BASE: https://api.render.com/v1
      OWNER_SOURCE_SERVICE_ID: srv-da1kic5bedkc73d6fk60
      SERVICE_NAME: krc-cobalt-media-beta-kolemasakar
      SERVICE_URL: https://krc-cobalt-media-beta-kolemasakar.onrender.com
      IMAGE_URL: ghcr.io/imputnet/cobalt@sha256:63186dd68afd57ce3bb1f62cc4c139f5fa95b9c3e87a3cf5c6e4c7a570523f62
    steps:
      - name: Provision one isolated Free Cobalt service if absent
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          echo "::add-mask::$RENDER_API_KEY"

          api=(-H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")

          curl -fsS "${RENDER_API_BASE}/services/${OWNER_SOURCE_SERVICE_ID}" "${api[@]}" > /tmp/owner-source.json
          owner_id="$(jq -r '.ownerId // empty' /tmp/owner-source.json)"
          test -n "$owner_id"

          curl -fsS --get "${RENDER_API_BASE}/services" "${api[@]}" \
            --data-urlencode "name=${SERVICE_NAME}" --data-urlencode 'limit=20' > /tmp/by-name.json
          existing_count="$(jq --arg name "$SERVICE_NAME" '[.[] | (.service // .) | select(.name == $name)] | length' /tmp/by-name.json)"
          if [[ "$existing_count" -gt 1 ]]; then
            echo 'More than one service with the target name exists; refusing to choose.' >&2
            exit 1
          fi

          created=false
          if [[ "$existing_count" -eq 0 ]]; then
            key="$(python3 - <<'PY'
import uuid
print(uuid.uuid4())
PY
)"
            echo "::add-mask::$key"
            jq -n --arg k "$key" '{($k): {name:"voicebridge-krc-media-beta", limit:20, allowedServices:["facebook"]}}' > /tmp/cobalt-keys.json
            chmod 600 /tmp/cobalt-keys.json

            curl -fsSL https://raw.githubusercontent.com/render-oss/cli/main/bin/install.sh | sh >/tmp/render-install.log 2>&1
            render --version >/tmp/render-version.txt
            render workspace set "$owner_id" -o text >/tmp/workspace-set.txt 2>&1

            render services create \
              --name "$SERVICE_NAME" \
              --type web_service \
              --image "$IMAGE_URL" \
              --plan free \
              --region frankfurt \
              --health-check-path / \
              --env-var "API_URL=${SERVICE_URL}/" \
              --env-var 'API_PORT=10000' \
              --env-var 'API_LISTEN_ADDRESS=0.0.0.0' \
              --env-var 'API_KEY_URL=file:///etc/secrets/cobalt-keys.json' \
              --env-var 'API_AUTH_REQUIRED=1' \
              --env-var 'CORS_WILDCARD=0' \
              --env-var 'CORS_URL=https://voicebridge-krc-media-beta-kolemasakar.onrender.com' \
              --env-var 'DURATION_LIMIT=3600' \
              --env-var 'RATELIMIT_WINDOW=60' \
              --env-var 'RATELIMIT_MAX=20' \
              --secret-file "cobalt-keys.json:/tmp/cobalt-keys.json" \
              --confirm -o json > /tmp/create.json
            created=true

            shred -u /tmp/cobalt-keys.json 2>/dev/null || rm -f /tmp/cobalt-keys.json
          fi

          service_id=''
          for i in $(seq 1 60); do
            curl -fsS --get "${RENDER_API_BASE}/services" "${api[@]}" \
              --data-urlencode "name=${SERVICE_NAME}" --data-urlencode 'limit=20' > /tmp/by-name-after.json
            service_id="$(jq -r --arg name "$SERVICE_NAME" '[.[] | (.service // .) | select(.name == $name)][0].id // empty' /tmp/by-name-after.json)"
            [[ -n "$service_id" ]] && break
            sleep 2
          done
          test -n "$service_id"

          curl -fsS "${RENDER_API_BASE}/services/${service_id}" "${api[@]}" > /tmp/service.json
          service_name="$(jq -r '.name // empty' /tmp/service.json)"
          service_type="$(jq -r '.type // empty' /tmp/service.json)"
          plan="$(jq -r '.serviceDetails.plan // .plan // empty' /tmp/service.json)"
          region="$(jq -r '.serviceDetails.region // .region // empty' /tmp/service.json)"
          service_runtime="$(jq -r '.serviceDetails.env // .env // .runtime // empty' /tmp/service.json)"
          image_seen="$(jq -r '.imagePath // .image.path // .image.url // .serviceDetails.imagePath // .serviceDetails.imageUrl // empty' /tmp/service.json)"

          [[ "$service_name" == "$SERVICE_NAME" ]]
          [[ "$service_type" == web_service ]]
          [[ "$plan" == free ]]
          [[ "$region" == frankfurt ]]
          if [[ -n "$image_seen" && "$image_seen" != "$IMAGE_URL" ]]; then
            echo "Unexpected image path for target service." >&2
            exit 1
          fi

          deploy_status=unknown
          deploy_id=none
          for i in $(seq 1 120); do
            curl -fsS "${RENDER_API_BASE}/services/${service_id}/deploys?limit=20" "${api[@]}" > /tmp/deploys.json
            row="$(jq -c '[.[] | (.deploy // .)][0] // empty' /tmp/deploys.json)"
            if [[ -n "$row" ]]; then
              deploy_status="$(jq -r '.status // "unknown"' <<<"$row")"
              deploy_id="$(jq -r '.id // "none"' <<<"$row")"
              case "$deploy_status" in
                live|build_failed|update_failed|canceled|deactivated) break ;;
              esac
            fi
            sleep 5
          done
          [[ "$deploy_status" == live ]]

          health_http=000
          for i in $(seq 1 30); do
            health_http="$(curl -sS --max-time 30 -o /tmp/health.json -w '%{http_code}' "${SERVICE_URL}/" || true)"
            [[ "$health_http" == 200 ]] && break
            sleep 4
          done
          [[ "$health_http" == 200 ]]

          unauth_http="$(curl -sS --max-time 30 -o /tmp/unauth.json -w '%{http_code}' \
            -X POST "${SERVICE_URL}/" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"url":"https://cobalt-auth-gate.invalid/"}' || true)"
          unauth_code="$(jq -r '.error.code // .error // empty' /tmp/unauth.json 2>/dev/null || true)"
          [[ "$unauth_http" == 401 ]]
          [[ "$unauth_code" == *auth* ]]

          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "service_id=$service_id" >> "$GITHUB_OUTPUT"
          echo "service_name=$service_name" >> "$GITHUB_OUTPUT"
          echo "service_type=$service_type" >> "$GITHUB_OUTPUT"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "region=$region" >> "$GITHUB_OUTPUT"
          echo "runtime=$service_runtime" >> "$GITHUB_OUTPUT"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "deploy_status=$deploy_status" >> "$GITHUB_OUTPUT"
          echo "health_http=$health_http" >> "$GITHUB_OUTPUT"
          echo "unauth_http=$unauth_http" >> "$GITHUB_OUTPUT"
          echo "unauth_code=$unauth_code" >> "$GITHUB_OUTPUT"

      - name: Report A9.7-G1 result
        if: always()
        env:
          CREATED: ${{ steps.provision.outputs.created }}
          SERVICE_ID_ACTUAL: ${{ steps.provision.outputs.service_id }}
          SERVICE_NAME_ACTUAL: ${{ steps.provision.outputs.service_name }}
          SERVICE_TYPE_ACTUAL: ${{ steps.provision.outputs.service_type }}
          PLAN_ACTUAL: ${{ steps.provision.outputs.plan }}
          REGION_ACTUAL: ${{ steps.provision.outputs.region }}
          RUNTIME_ACTUAL: ${{ steps.provision.outputs.runtime }}
          DEPLOY_ID: ${{ steps.provision.outputs.deploy_id }}
          DEPLOY_STATUS: ${{ steps.provision.outputs.deploy_status }}
          HEALTH_HTTP: ${{ steps.provision.outputs.health_http }}
          UNAUTH_HTTP: ${{ steps.provision.outputs.unauth_http }}
          UNAUTH_CODE: ${{ steps.provision.outputs.unauth_code }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == success ]]; then result=PASS; else result=FAIL; fi
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.7-G1 isolated Cobalt provisioning: **${result}**. created=\`${CREATED:-unknown}\`; service=\`${SERVICE_NAME_ACTUAL:-unknown}\`, id=\`${SERVICE_ID_ACTUAL:-unknown}\`, type=\`${SERVICE_TYPE_ACTUAL:-unknown}\`, plan=\`${PLAN_ACTUAL:-unknown}\`, region=\`${REGION_ACTUAL:-unknown}\`, runtime=\`${RUNTIME_ACTUAL:-unknown}\`; pinned_image_digest=\`63186dd68afd57ce3bb1f62cc4c139f5fa95b9c3e87a3cf5c6e4c7a570523f62\`; deploy=\`${DEPLOY_ID:-none}\` status=\`${DEPLOY_STATUS:-unknown}\`; GET_/=\`${HEALTH_HTTP:-unknown}\`; unauthenticated_POST_/=\`${UNAUTH_HTTP:-unknown}\` code=\`${UNAUTH_CODE:-none}\`. Generated Cobalt UUID was never printed or committed. No Facebook URL/media retrieval, VoiceBridge env/redeploy, ScrapeCreators, AssemblyAI, Supadata, production, main, or merge action was executed."
