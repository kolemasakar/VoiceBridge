name: Render MEDIA BETA A9.3 Balance Safety Check

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/render-media-beta-a9-3-observe.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read provider balance only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPADATA_API_KEY:-}"
          echo "::add-mask::$SUPADATA_API_KEY"
          code="$(curl -sS --max-time 60 -o /tmp/me.json -w '%{http_code}' \
            https://api.supadata.ai/v1/me \
            -H 'Accept: application/json' \
            -H "x-api-key: ${SUPADATA_API_KEY}")"
          [[ "$code" == 200 ]]
          max="$(jq -r '.maxCredits' /tmp/me.json)"
          used="$(jq -r '.usedCredits' /tmp/me.json)"
          plan="$(jq -r '.plan // "unknown"' /tmp/me.json)"
          [[ "$max" =~ ^[0-9]+$ && "$used" =~ ^[0-9]+$ ]]
          available=$((max-used))
          echo "A9.3 balance safety check: plan=$plan available=$available"
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.3 post-abort balance safety check: **SUCCESS**. Plan: \`${plan}\`; available credits: \`${available}\`. Account \`/me\` only; no transcript request and no Render mutation."
