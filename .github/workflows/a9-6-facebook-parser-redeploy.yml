name: A9.6 Facebook Parser Controlled Redeploy

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-parser-redeploy.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: a9-6-facebook-parser-controlled-redeploy
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      RENDER_API_BASE: https://api.render.com/v1
      SERVICE_ID: srv-da1kic5bedkc73d6fk60
      SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
      REQUIRED_BRANCH: agent/krc-media-transcript
      BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
      CODE_SHA: 877a09f5a64d34e675f4b9302e89f40aa3235cf4
    steps:
      - name: Redeploy exact retention commit with cleared cache
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          echo "::add-mask::$RENDER_API_KEY"

          curl -sS "${RENDER_API_BASE}/services/${SERVICE_ID}" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/service.json
          [[ "$(jq -r '.name // empty' /tmp/service.json)" == "$SERVICE_NAME" ]]
          [[ "$(jq -r '.branch // empty' /tmp/service.json)" == "$REQUIRED_BRANCH" ]]

          payload="$(jq -nc --arg commitId "$CODE_SHA" '{commitId:$commitId,clearCache:"clear"}')"
          code="$(curl -sS -o /tmp/create.json -w '%{http_code}' \
            -X POST "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" --data "$payload")"
          [[ "$code" == 201 || "$code" == 202 ]]
          deploy_id="$(jq -r '(.deploy // .).id // empty' /tmp/create.json)"
          test -n "$deploy_id"

          final_status="timeout"
          final_sha="unknown"
          for i in $(seq 1 120); do
            curl -sS "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${deploy_id}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/deploy.json
            final_status="$(jq -r '(.deploy // .).status // "unknown"' /tmp/deploy.json)"
            final_sha="$(jq -r '(.deploy // .).commit.id // (.deploy // .).commitId // "unknown"' /tmp/deploy.json)"
            case "$final_status" in
              live|build_failed|update_failed|canceled|deactivated) break ;;
            esac
            sleep 5
          done

          action_token=""
          cap_http="000"
          cap_ok=false
          if [[ "$final_status" == "live" && "$final_sha" == "$CODE_SHA" ]]; then
            curl -sS "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" \
              -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/env.json
            action_token="$(jq -r '(.envVar.value // .value // empty)' /tmp/env.json)"
            test -n "$action_token"
            echo "::add-mask::$action_token"
            for i in $(seq 1 12); do
              cap_http="$(curl -sS --max-time 15 -o /tmp/cap.json -w '%{http_code}' \
                "${BETA_BASE_URL}/api/v1/media/managed" \
                -H 'Accept: application/json' \
                -H "Authorization: Bearer ${action_token}" || true)"
              if [[ "$cap_http" == 200 ]] && jq -e '.configured == true and .facebook_ai_fallback == true and .facebook_ai_requires_duration_metadata == true and .automatic_ai_fallback == false' /tmp/cap.json >/dev/null; then
                cap_ok=true
                break
              fi
              sleep 5
            done
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "status=$final_status" >> "$GITHUB_OUTPUT"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "cap_http=$cap_http" >> "$GITHUB_OUTPUT"
          echo "cap_ok=$cap_ok" >> "$GITHUB_OUTPUT"

      - name: Report controlled redeploy
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          STATUS: ${{ steps.deploy.outputs.status }}
          SHA: ${{ steps.deploy.outputs.sha }}
          CAP_HTTP: ${{ steps.deploy.outputs.cap_http }}
          CAP_OK: ${{ steps.deploy.outputs.cap_ok }}
        shell: bash
        run: |
          set -euo pipefail
          result=FAIL
          if [[ "$STATUS" == "live" && "$SHA" == "$CODE_SHA" && "$CAP_HTTP" == "200" && "$CAP_OK" == "true" ]]; then result=PASS; fi
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook paid-retention isolated deploy: **${result}**. deploy_id=\`${DEPLOY_ID}\`, status=\`${STATUS}\`, sha=\`${SHA}\`, managed_capability_http=\`${CAP_HTTP}\`, facebook_capability_ok=\`${CAP_OK}\`. Exact source commit only, isolated beta, cleared build cache. No Supadata account/preflight/transcript/metadata/AI endpoint was called. Production/main were not targeted."
