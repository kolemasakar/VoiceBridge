name: KRC MEDIA Telegram Boundary Hardening V2

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/krc-media-telegram-boundary-hardening-v2.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify accepted baseline is an ancestor
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 65d536a445126c47f2646e59ca31e12e7bd35514 HEAD

      - name: Harden active Telegram HTTP boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/cloud/src/managed_media_http.ts")
          s = p.read_text()
          old = '        const quote = await service.preflight(input);\n'
          guard = '        if (managedMediaPlatform(input.url) === "telegram") {\n          throw new MediaTranscriptError(\n            "TELEGRAM_PUBLIC_RETRIEVAL_REQUIRED",\n            "Active Telegram intake uses the public Telegram retrieval route; generic Supadata native preflight is disabled.",\n            400,\n            false\n          );\n        }\n'
          assert s.count(old) == 1
          s = s.replace(old, guard + old, 1)
          old = '        const job = await service.startNative(input);\n'
          guard = '        if (managedMediaPlatform(input.url) === "telegram") {\n          throw new MediaTranscriptError(\n            "TELEGRAM_PUBLIC_RETRIEVAL_REQUIRED",\n            "Active Telegram intake uses the public Telegram retrieval route; generic Supadata native processing is disabled.",\n            409,\n            false\n          );\n        }\n'
          assert s.count(old) == 1
          s = s.replace(old, guard + old, 1)
          p.write_text(s)
          PY

      - name: Add active Telegram route regression
        shell: bash
        run: |
          set -euo pipefail
          cat > src/cloud/tests/active_telegram_route_policy.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import { createServer, type Server } from "node:http";
          import type { AddressInfo } from "node:net";
          import { test } from "node:test";
          import type { AppConfig } from "../src/config.js";
          import { createManagedMediaHttpHandler } from "../src/managed_media_http.js";
          import type { ManagedMediaService } from "../src/managed_media_service.js";

          const ACTION_TOKEN = "managed-action-token-telegram-123456";
          const ACCESS_CODE = "abcdefghijkl";
          const TELEGRAM_URL = "https://t.me/techcrimes/12101";

          const CONFIG: AppConfig = {
            host: "127.0.0.1",
            port: 0,
            testAccessToken: "voicebridge-test-token-telegram-123456",
            mediaActionToken: ACTION_TOKEN,
            mediaBetaCodes: [ACCESS_CODE],
            mediaDailySttSeconds: 7200,
            assemblyAiApiKey: null,
            supadataApiKey: null,
            geminiApiKey: null,
            geminiTranslationModel: "gemini-3.1-flash-lite",
            corsAllowedOrigin: "*",
            maxRequestBodyBytes: 32768,
            rateLimitRequestsPerMinute: 1000
          };

          async function listen(server: Server): Promise<string> {
            await new Promise<void>((resolve, reject) => {
              server.once("error", reject);
              server.listen(0, "127.0.0.1", () => {
                server.off("error", reject);
                resolve();
              });
            });
            const address = server.address() as AddressInfo;
            return `http://127.0.0.1:${address.port}`;
          }

          async function close(server: Server): Promise<void> {
            server.closeAllConnections();
            await new Promise<void>((resolve, reject) => {
              server.close((error) => error ? reject(error) : resolve());
            });
          }

          function headers(): Record<string, string> {
            return {
              authorization: `Bearer ${ACTION_TOKEN}`,
              "content-type": "application/json",
              connection: "close"
            };
          }

          test("active Telegram intake cannot enter generic Supadata native routes", async () => {
            let preflightCalls = 0;
            let nativeCalls = 0;
            const service = {
              configured: true,
              storeKind: "postgres",
              durableStore: true,
              async preflight() {
                preflightCalls += 1;
                throw new Error("generic Telegram preflight must remain unreachable");
              },
              async startNative() {
                nativeCalls += 1;
                throw new Error("generic Telegram native start must remain unreachable");
              }
            } as unknown as ManagedMediaService;
            const handler = createManagedMediaHttpHandler(CONFIG, service);
            const server = createServer(async (request, response) => {
              if (await handler.handle(request, response)) return;
              response.statusCode = 404;
              response.end();
            });
            const baseUrl = await listen(server);
            try {
              const preflight = await fetch(`${baseUrl}/api/v1/media/managed/preflight`, {
                method: "POST",
                headers: headers(),
                body: JSON.stringify({ url: TELEGRAM_URL, language_hint: "auto" })
              });
              assert.equal(preflight.status, 400);
              const preflightBody = await preflight.json() as { error?: { code?: string } };
              assert.equal(preflightBody.error?.code, "TELEGRAM_PUBLIC_RETRIEVAL_REQUIRED");

              const start = await fetch(`${baseUrl}/api/v1/media/managed/transcriptions`, {
                method: "POST",
                headers: headers(),
                body: JSON.stringify({
                  url: TELEGRAM_URL,
                  language_hint: "auto",
                  credit_consent: { provider: "supadata", mode: "native", max_credits: 1 }
                })
              });
              assert.equal(start.status, 409);
              const startBody = await start.json() as { error?: { code?: string } };
              assert.equal(startBody.error?.code, "TELEGRAM_PUBLIC_RETRIEVAL_REQUIRED");
              assert.equal(preflightCalls, 0);
              assert.equal(nativeCalls, 0);
            } finally {
              await close(server);
            }
          });

          test("Telegram capability remains public retrieval with zero retrieval credits", () => {
            const service = {
              configured: true,
              storeKind: "postgres",
              durableStore: true
            } as unknown as ManagedMediaService;
            const { capability } = createManagedMediaHttpHandler(CONFIG, service);
            assert.equal(capability.telegram_public_retrieval, true);
            assert.equal(capability.telegram_retrieval_provider, "telegram_public_web");
            assert.equal(capability.telegram_retrieval_credits, 0);
          });
          EOF

      - name: Validate full cloud suite
        working-directory: src/cloud
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check

      - name: Commit hardened implementation and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/krc-media-telegram-boundary-hardening-v2.yml
          rm -f .github/workflows/krc-media-telegram-route-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "Harden active Telegram intake to public route only"
          git push origin HEAD:agent/krc-media-transcript
