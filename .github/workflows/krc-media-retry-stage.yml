name: KRC MEDIA Retry Patch Stage

on:
  push:
    branches:
      - agent/krc-media-retry-stage

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify staged patch
        run: echo '0ac831b8a9bec5d809b5bf544ad2569f31f8e73d58452a3ca1e44d57b7ec92c6  .github/krc-media-retry.patch' | sha256sum -c -
      - name: Apply patch
        run: |
          git apply --check .github/krc-media-retry.patch
          git apply .github/krc-media-retry.patch
          rm .github/krc-media-retry.patch .github/workflows/krc-media-retry-stage.yml
      - name: Validate cloud
        working-directory: src/cloud
        run: |
          npm ci
          npm run check
      - name: Commit validated result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'KRC MEDIA: allow fresh retries for failed free routes'
          git push origin HEAD:${{ github.ref_name }}
