name: A9.6 Facebook Current Metadata Approved

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-current-metadata-approved.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: a9-6-facebook-current-metadata-approved
  cancel-in-progress: false

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  JOB_ID: KRCM_1e99b074-fdf6-4144-9278-0e66e9a79713
  REQUIRED_AVAILABLE_BEFORE: "85"
  REQUIRED_AVAILABLE_AFTER: "84"

jobs:
  metadata:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enforce isolated target and read token
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          echo "::add-mask::$RENDER_API_KEY"
          [[ "$GITHUB_REF_NAME" == "$REQUIRED_BRANCH" ]]

          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]]
          name="$(jq -r '.name // empty' "$tmp")"
          branch="$(jq -r '.branch // empty' "$tmp")"
          rm -f "$tmp"
          [[ "$name" == "$SERVICE_NAME" ]]
          [[ "$branch" == "$REQUIRED_BRANCH" ]]

          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]]
          token="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
          rm -f "$tmp"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Verify exact durable job read-only
        id: before
        env:
          ACTION_TOKEN: ${{ steps.guard.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 60 -o /tmp/job-before.json -w '%{http_code}' "${BETA_BASE_URL}/api/v1/media/managed/transcriptions/${JOB_ID}" -H 'Accept: application/json' -H "Authorization: Bearer ${ACTION_TOKEN}")"
          [[ "$code" == 200 ]]
          jq -e '.status == "AWAITING_AI_CONSENT" and .provider_mode == "native" and (.credits_charged // 0) == 1 and (.metadata_credits_charged // 0) == 0' /tmp/job-before.json >/dev/null

      - name: Recheck free metadata-duration quote
        id: quote
        env:
          ACTION_TOKEN: ${{ steps.guard.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 60 -o /tmp/meta-quote.json -w '%{http_code}' "${BETA_BASE_URL}/api/v1/media/managed/transcriptions/${JOB_ID}/facebook-ai-estimate-preflight" -H 'Accept: application/json' -H "Authorization: Bearer ${ACTION_TOKEN}")"
          [[ "$code" == 200 ]]
          jq -e '.provider == "supadata" and .mode == "metadata" and .purpose == "facebook_ai_duration" and .estimated_credits == 1 and .consent_required == true and .can_continue == true' /tmp/meta-quote.json >/dev/null
          available="$(jq -r '.credits_available' /tmp/meta-quote.json)"
          after="$(jq -r '.credits_after_estimate' /tmp/meta-quote.json)"
          [[ "$available" == "$REQUIRED_AVAILABLE_BEFORE" ]]
          [[ "$after" == "$REQUIRED_AVAILABLE_AFTER" ]]
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

      - name: Execute exactly one approved metadata-duration request
        id: metadata
        env:
          ACTION_TOKEN: ${{ steps.guard.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"credit_consent":{"provider":"supadata","mode":"metadata","max_credits":1}}'
          code="$(curl -sS --max-time 180 -o /tmp/meta-result.json -w '%{http_code}' -X POST "${BETA_BASE_URL}/api/v1/media/managed/transcriptions/${JOB_ID}/facebook-ai-estimate" -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer ${ACTION_TOKEN}" --data "$payload")"
          echo "http=$code" >> "$GITHUB_OUTPUT"
          [[ "$code" == 200 ]]
          jq -e '.status == "AWAITING_AI_CONSENT" and (.metadata_credits_charged // 0) == 1 and (.media_duration_seconds | numbers) > 0 and (.credits_charged // 0) == 2' /tmp/meta-result.json >/dev/null
          duration="$(jq -r '.media_duration_seconds' /tmp/meta-result.json)"
          ceiling="$(jq -r '.ai_credit_ceiling // "unknown"' /tmp/meta-result.json)"
          cumulative="$(jq -r '.credits_charged' /tmp/meta-result.json)"
          uncertain="$(jq -r '.credit_charge_uncertain // "unknown"' /tmp/meta-result.json)"
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "ceiling=$ceiling" >> "$GITHUB_OUTPUT"
          echo "cumulative=$cumulative" >> "$GITHUB_OUTPUT"
          echo "uncertain=$uncertain" >> "$GITHUB_OUTPUT"

      - name: Read AI quote only after metadata; never start AI
        id: ai
        if: steps.metadata.outcome == 'success'
        env:
          ACTION_TOKEN: ${{ steps.guard.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 60 -o /tmp/ai-quote.json -w '%{http_code}' "${BETA_BASE_URL}/api/v1/media/managed/transcriptions/${JOB_ID}/ai-preflight" -H 'Accept: application/json' -H "Authorization: Bearer ${ACTION_TOKEN}")"
          [[ "$code" == 200 ]]
          jq -e '.provider == "supadata" and .mode == "generate" and .consent_required == true' /tmp/ai-quote.json >/dev/null
          available="$(jq -r '.credits_available' /tmp/ai-quote.json)"
          maximum="$(jq -r '.maximum_credits' /tmp/ai-quote.json)"
          after="$(jq -r '.credits_after_estimate' /tmp/ai-quote.json)"
          minutes="$(jq -r '.maximum_duration_minutes' /tmp/ai-quote.json)"
          can_continue="$(jq -r '.can_continue' /tmp/ai-quote.json)"
          [[ "$available" == "$REQUIRED_AVAILABLE_AFTER" ]]
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "maximum=$maximum" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
          echo "can_continue=$can_continue" >> "$GITHUB_OUTPUT"

      - name: Report approved metadata result
        if: always()
        env:
          HTTP: ${{ steps.metadata.outputs.http }}
          DURATION: ${{ steps.metadata.outputs.duration }}
          CEILING: ${{ steps.metadata.outputs.ceiling }}
          CUMULATIVE: ${{ steps.metadata.outputs.cumulative }}
          UNCERTAIN: ${{ steps.metadata.outputs.uncertain }}
          AI_AVAILABLE: ${{ steps.ai.outputs.available }}
          AI_MAX: ${{ steps.ai.outputs.maximum }}
          AI_AFTER: ${{ steps.ai.outputs.after }}
          AI_MINUTES: ${{ steps.ai.outputs.minutes }}
          AI_CAN_CONTINUE: ${{ steps.ai.outputs.can_continue }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then
            body="A9.6 Facebook current metadata-duration request: **SUCCESS**. Explicit owner authorization: exactly one metadata request with hard max \`1\` Supadata credit. Balance \`85\` -> \`84\`; http=\`${HTTP}\`; job=\`${JOB_ID}\`; metadata_credits_charged=\`1\`; cumulative_job_credits=\`${CUMULATIVE}\`; duration_seconds=\`${DURATION}\`; ai_credit_ceiling=\`${CEILING}\`; charge_uncertain=\`${UNCERTAIN}\`. Free AI preflight only: available=\`${AI_AVAILABLE}\`, maximum_credits=\`${AI_MAX}\`, worst_case_after=\`${AI_AFTER}\`, maximum_duration_minutes=\`${AI_MINUTES}\`, can_continue=\`${AI_CAN_CONTINUE}\`. No AI start, transcript retry, production, main, merge, or automatic retry was executed."
          else
            body="A9.6 Facebook current metadata-duration request: **FAILURE**. Authorization was limited to exactly one metadata request with hard max \`1\` credit. No AI start, transcript retry, production, main, merge, or automatic retry was authorized."
          fi
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "$body"
