name: Render Media Beta Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Inspect, restart, or deploy the isolated MEDIA BETA service"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - restart
          - deploy
      clear_cache:
        description: "Clear Render build cache for a manual deploy"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/render-media-beta-control.yml

permissions:
  contents: read

concurrency:
  group: render-media-beta-control
  cancel-in-progress: false

env:
  RENDER_API_BASE: https://api.render.com/v1
  RENDER_SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  RENDER_BETA_HEALTH_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com/api/v1/health
  REQUIRED_DEPLOY_BRANCH: agent/krc-media-transcript

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve requested operation
        id: operation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            operation='${{ inputs.operation }}'
          else
            operation='inspect'
          fi
          case "$operation" in
            inspect|restart|deploy) ;;
            *) echo "Unsupported operation." >&2; exit 2 ;;
          esac
          echo "value=$operation" >> "$GITHUB_OUTPUT"
          echo "Operation: $operation"

      - name: Verify Render credential is configured
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo "RENDER_API_KEY is not configured in GitHub Actions Secrets." >&2
            exit 1
          fi
          echo "Render credential is configured. Secret value is not printed."

      - name: Discover isolated beta service
        id: service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_status="$({ curl -sS \
            --get \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --url "${RENDER_API_BASE}/services" \
            --data-urlencode "name=${RENDER_SERVICE_NAME}" \
            --data-urlencode "limit=20" \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${RENDER_API_KEY}"; } 2>/dev/null)"

          if [[ "$http_status" != "200" ]]; then
            echo "Render API authentication/discovery failed with HTTP ${http_status}." >&2
            rm -f "$response_file"
            exit 1
          fi

          service_id="$(jq -r --arg name "$RENDER_SERVICE_NAME" '
            [ .[] | (.service // .) | select(.name == $name) ]
            | first
            | (.id // empty)
          ' "$response_file")"

          rm -f "$response_file"

          if [[ -z "$service_id" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "service_id=" >> "$GITHUB_OUTPUT"
            echo "Render API authentication: OK"
            echo "Dedicated MEDIA BETA service: NOT FOUND"
            echo "Expected service name: ${RENDER_SERVICE_NAME}"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "service_id=$service_id" >> "$GITHUB_OUTPUT"
            echo "Render API authentication: OK"
            echo "Dedicated MEDIA BETA service: FOUND"
            echo "Service ID: $service_id"
          fi

      - name: Inspect latest beta deploy state
        if: steps.service.outputs.found == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ steps.service.outputs.service_id }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_status="$({ curl -sS \
            --get \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --url "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" \
            --data-urlencode 'limit=1' \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${RENDER_API_KEY}"; } 2>/dev/null)"

          if [[ "$http_status" != "200" ]]; then
            echo "Could not read beta deploy state; HTTP ${http_status}." >&2
            rm -f "$response_file"
            exit 1
          fi

          jq -r '
            if length == 0 then
              "Latest deploy: none"
            else
              (.[0].deploy // .[0]) as $d
              | "Latest deploy ID: \($d.id // \"unknown\")\nLatest deploy status: \($d.status // \"unknown\")\nLatest deploy commit: \($d.commit.id // $d.commitId // \"unknown\")"
            end
          ' "$response_file"
          rm -f "$response_file"

      - name: Enforce mutation isolation boundary
        if: steps.operation.outputs.value == 'restart' || steps.operation.outputs.value == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "${REQUIRED_DEPLOY_BRANCH}" ]]; then
            echo "Mutation refused: workflow must run from ${REQUIRED_DEPLOY_BRANCH}." >&2
            exit 1
          fi
          if [[ "${{ steps.service.outputs.found }}" != "true" ]]; then
            echo "Mutation refused: isolated MEDIA BETA service does not exist." >&2
            exit 1
          fi
          echo "Isolation boundary verified: only ${RENDER_SERVICE_NAME} may be mutated."

      - name: Restart isolated beta service
        if: steps.operation.outputs.value == 'restart' && steps.service.outputs.found == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ steps.service.outputs.service_id }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_status="$({ curl -sS \
            --request POST \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --url "${RENDER_API_BASE}/services/${SERVICE_ID}/restart" \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${RENDER_API_KEY}"; } 2>/dev/null)"

          if [[ "$http_status" != "200" ]]; then
            echo "Render restart request failed with HTTP ${http_status}." >&2
            rm -f "$response_file"
            exit 1
          fi

          rm -f "$response_file"
          echo "Restart request accepted for isolated MEDIA BETA service."

      - name: Trigger isolated beta deploy
        if: steps.operation.outputs.value == 'deploy' && steps.service.outputs.found == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ steps.service.outputs.service_id }}
        shell: bash
        run: |
          set -euo pipefail
          clear_cache='do_not_clear'
          if [[ '${{ inputs.clear_cache }}' == 'true' ]]; then
            clear_cache='clear'
          fi

          payload="$(jq -nc \
            --arg commitId "$GITHUB_SHA" \
            --arg clearCache "$clear_cache" \
            '{commitId:$commitId,clearCache:$clearCache}')"

          response_file="$(mktemp)"
          http_status="$({ curl -sS \
            --request POST \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --url "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --data "$payload"; } 2>/dev/null)"

          if [[ "$http_status" != "201" && "$http_status" != "202" ]]; then
            echo "Render deploy request failed with HTTP ${http_status}." >&2
            rm -f "$response_file"
            exit 1
          fi

          deploy_id="$(jq -r '(.deploy // .).id // empty' "$response_file")"
          deploy_status="$(jq -r '(.deploy // .).status // \"queued\"' "$response_file")"
          rm -f "$response_file"

          echo "Deploy request accepted."
          echo "Deploy ID: ${deploy_id:-unknown}"
          echo "Deploy status: ${deploy_status}"
          echo "Commit: ${GITHUB_SHA}"

      - name: Probe beta health endpoint
        if: steps.service.outputs.found == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          http_status="$(curl -sS --max-time 20 --output /tmp/media-beta-health.json --write-out '%{http_code}' "$RENDER_BETA_HEALTH_URL" || true)"
          echo "Beta health HTTP status: ${http_status:-unreachable}"
          if [[ "$http_status" == "200" ]]; then
            jq -c '{status,service,version,media_transcript:(.capabilities.media_transcript // null)}' /tmp/media-beta-health.json 2>/dev/null || true
          else
            echo "Health endpoint is not ready yet; this is expected during restart/deploy replacement."
          fi

# A9.9 isolated Telegram runtime inspection trigger: 2026-08-26
