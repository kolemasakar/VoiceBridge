name: KRC Media M3 Byte Capture

on:
  push:
    branches:
      - agent/krc-media-gemini-migration
    paths:
      - .github/workflows/krc-media-m3-byte-capture.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Create isolated capture environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/krc-m3-venv"
          "$RUNNER_TEMP/krc-m3-venv/bin/python" -m pip install --disable-pip-version-check --no-input 'yt-dlp==2026.8.19'
          "$RUNNER_TEMP/krc-m3-venv/bin/yt-dlp" --version

      - name: Capture locked public media bytes and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          export WORKDIR="$RUNNER_TEMP/krc-m3-byte-capture"
          export YTDLP="$RUNNER_TEMP/krc-m3-venv/bin/yt-dlp"
          mkdir -p "$WORKDIR"
          trap 'rm -rf "$WORKDIR" "$RUNNER_TEMP/krc-m3-venv"' EXIT

          printf '## KRC MEDIA M3 byte capture\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'No AssemblyAI/Gemini/Supadata calls. No provider credentials. No raw-media artifacts. Temporary media is deleted after hashing.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| case_id | status | sha256 | bytes | retrieval | duration_s | ext |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '|---|---|---|---:|---|---:|---|\n' >> "$GITHUB_STEP_SUMMARY"

          cat > "$WORKDIR/capture.py" <<'PY'
          import html as html_lib
          import os
          import re
          import subprocess
          import sys
          import urllib.request
          from hashlib import sha256
          from pathlib import Path
          from urllib.parse import urlparse

          workdir = Path(os.environ['WORKDIR'])
          ytdlp = os.environ['YTDLP']
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          ua = 'VoiceBridge-KRC-Media-Beta/1.0'

          cases = [
              ('ua-clean-public-001', 'telegram', 'https://t.me/V_Zelenskiy_official/20348', 148),
              ('ru-clean-public-001', 'telegram', 'https://t.me/news_kremlin/7324', 200),
              ('en-clean-public-001', 'un_webtv', 'https://webtv.un.org/en/asset/k1x/k1xi4v5ljv', 402),
          ]

          def fetch(url: str, timeout: int = 25) -> tuple[str, str]:
              req = urllib.request.Request(url, headers={
                  'User-Agent': ua,
                  'Accept': 'text/html,application/xhtml+xml,*/*;q=0.8',
              })
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  final = response.geturl()
                  body = response.read(4 * 1024 * 1024)
              return final, body.decode('utf-8', 'replace')

          def trusted_telegram_media(value: str) -> str | None:
              value = html_lib.unescape(value)
              try:
                  parsed = urlparse(value)
              except Exception:
                  return None
              host = (parsed.hostname or '').lower()
              trusted = host == 'telesco.pe' or host.endswith('.telesco.pe') or host == 'cdn-telegram.org' or host.endswith('.cdn-telegram.org')
              if parsed.scheme != 'https' or not trusted or not parsed.path.lower().endswith('.mp4'):
                  return None
              return value

          def telegram_media(post_url: str) -> tuple[str, str]:
              embed_url = post_url + ('&' if '?' in post_url else '?') + 'embed=1&single=1'
              final, text = fetch(embed_url)
              if (urlparse(final).hostname or '').lower() not in {'t.me', 'telegram.me'}:
                  raise RuntimeError('telegram preview redirected outside trusted surface')
              for raw in re.findall(r'<video\\b[^>]*\\bsrc=["\\\']([^"\\\']+)["\\\']', text, flags=re.I):
                  candidate = trusted_telegram_media(raw)
                  if candidate:
                      return candidate, 'telegram_public_web'
              raise RuntimeError('telegram public preview exposed no trusted MP4')

          def un_media(page_url: str) -> tuple[str, str]:
              final, text = fetch(page_url)
              if (urlparse(final).hostname or '').lower() not in {'webtv.un.org', 'media.un.org'}:
                  raise RuntimeError('UN WebTV redirected outside trusted UN media surface')
              decoded = html_lib.unescape(text).replace('\\/', '/')
              candidates = re.findall(r'https://[^"\\\'<>\\s]+?(?:\\.mp4|\\.m3u8)(?:\\?[^"\\\'<>\\s]*)?', decoded, flags=re.I)
              for candidate in candidates:
                  host = (urlparse(candidate).hostname or '').lower()
                  if host and (host.endswith('.un.org') or host == 'un.org' or 'akamaized.net' in host or 'cloudfront.net' in host):
                      return candidate, 'un_webtv_public_media'
              raise RuntimeError('UN WebTV page exposed no supported public MP4/HLS URL')

          def download(url: str, out: Path) -> str:
              lower_path = urlparse(url).path.lower()
              if lower_path.endswith('.mp4'):
                  req = urllib.request.Request(url, headers={'User-Agent': ua, 'Accept': '*/*'})
                  with urllib.request.urlopen(req, timeout=60) as response, out.open('wb') as fh:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          fh.write(chunk)
                  return 'mp4'
              subprocess.run([
                  ytdlp, '--quiet', '--no-warnings', '--no-playlist', '--no-part',
                  '--format', 'best[acodec!=none]/best', '--output', str(out), url
              ], check=True, timeout=180)
              return out.suffix.lstrip('.') or 'media'

          failures = 0
          for case_id, kind, source_url, duration in cases:
              case_dir = workdir / case_id
              case_dir.mkdir(parents=True, exist_ok=True)
              out = case_dir / f'{case_id}.media'
              try:
                  if kind == 'telegram':
                      media_url, retrieval = telegram_media(source_url)
                  else:
                      media_url, retrieval = un_media(source_url)
                  ext = download(media_url, out)
                  data_hash = sha256()
                  size = 0
                  with out.open('rb') as fh:
                      while True:
                          chunk = fh.read(1024 * 1024)
                          if not chunk:
                              break
                          size += len(chunk)
                          data_hash.update(chunk)
                  if size <= 0:
                      raise RuntimeError('captured asset is empty')
                  digest = data_hash.hexdigest()
                  print(f'[{case_id}] CAPTURED sha256={digest} bytes={size} retrieval={retrieval} duration_s={duration} ext={ext}')
                  with summary.open('a', encoding='utf-8') as fh:
                      fh.write(f'| `{case_id}` | CAPTURED | `{digest}` | {size} | `{retrieval}` | {duration} | `{ext}` |\\n')
              except Exception as exc:
                  failures += 1
                  print(f'[{case_id}] FAILED: {type(exc).__name__}: {exc}', file=sys.stderr)
                  with summary.open('a', encoding='utf-8') as fh:
                      fh.write(f'| `{case_id}` | FAILED | - | - | `{kind}` | {duration} | - |\\n')
              finally:
                  try:
                      out.unlink(missing_ok=True)
                      for p in case_dir.iterdir():
                          p.unlink(missing_ok=True)
                      case_dir.rmdir()
                  except Exception:
                      pass

          if failures:
              raise SystemExit(f'{failures} locked source capture(s) failed')
          PY

          "$RUNNER_TEMP/krc-m3-venv/bin/python" "$WORKDIR/capture.py"

      - name: Confirm no raw media artifact upload
        if: always()
        shell: bash
        run: |
          echo "No upload-artifact step exists in this workflow. Runner temporary files are not persisted by this job."
