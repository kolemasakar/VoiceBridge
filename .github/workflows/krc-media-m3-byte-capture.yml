name: KRC Media M3 Byte Capture

on:
  push:
    branches:
      - agent/krc-media-gemini-migration
    paths:
      - .github/workflows/krc-media-m3-byte-capture.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Capture replacement public media bytes and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          export WORKDIR="$RUNNER_TEMP/krc-m3-byte-capture"
          mkdir -p "$WORKDIR"
          trap 'rm -rf "$WORKDIR"' EXIT

          printf '## KRC MEDIA M3 replacement byte capture\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Direct public Wikimedia Commons file redirects only. No AssemblyAI/Gemini/Supadata calls. No provider credentials. No raw-media artifacts.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| case_id | status | sha256 | bytes | final_host | duration_s | ext |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '|---|---|---|---:|---|---:|---|\n' >> "$GITHUB_STEP_SUMMARY"

          cat > "$WORKDIR/capture.py" <<'PY'
          import os
          import sys
          import urllib.request
          from hashlib import sha256
          from pathlib import Path
          from urllib.parse import quote, urlparse

          workdir = Path(os.environ['WORKDIR'])
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          user_agent = 'VoiceBridge-KRC-Media-Beta/1.0'

          cases = [
              (
                  'ua-clean-public-001',
                  'Звернення Володимира Зеленського.webm',
                  86,
                  'webm',
              ),
              (
                  'ru-clean-public-001',
                  'Putin talk 2011-12-15 09888-09940 Идите ко мне, бандерлоги.ogv',
                  52,
                  'ogv',
              ),
              (
                  'en-clean-public-001',
                  'Biden clip from inaugural speech 2.ogv',
                  71,
                  'ogv',
              ),
          ]

          failures = 0
          for case_id, filename, duration, ext in cases:
              out = workdir / f'{case_id}.{ext}'
              redirect_url = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/' + quote(filename, safe='')
              try:
                  request = urllib.request.Request(
                      redirect_url,
                      headers={'User-Agent': user_agent, 'Accept': '*/*'},
                  )
                  digest = sha256()
                  size = 0
                  with urllib.request.urlopen(request, timeout=60) as response, out.open('wb') as fh:
                      final_host = (urlparse(response.geturl()).hostname or '').lower()
                      if final_host != 'upload.wikimedia.org':
                          raise RuntimeError('Commons file redirect left trusted upload.wikimedia.org host')
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          size += len(chunk)
                          digest.update(chunk)
                          fh.write(chunk)
                  if size <= 0:
                      raise RuntimeError('captured asset is empty')
                  value = digest.hexdigest()
                  print(f'[{case_id}] CAPTURED sha256={value} bytes={size} final_host={final_host} duration_s={duration} ext={ext}')
                  with summary.open('a', encoding='utf-8') as fh:
                      fh.write(f'| `{case_id}` | CAPTURED | `{value}` | {size} | `{final_host}` | {duration} | `{ext}` |\n')
              except Exception as exc:
                  failures += 1
                  print(f'[{case_id}] FAILED: {type(exc).__name__}: {exc}', file=sys.stderr)
                  with summary.open('a', encoding='utf-8') as fh:
                      fh.write(f'| `{case_id}` | FAILED | - | - | - | {duration} | `{ext}` |\n')
              finally:
                  out.unlink(missing_ok=True)

          if failures:
              raise SystemExit(f'{failures} replacement source capture(s) failed')
          PY

          python3 "$WORKDIR/capture.py"

      - name: Confirm no raw media artifact upload
        if: always()
        shell: bash
        run: |
          echo "No upload-artifact step exists in this workflow. Runner temporary files are deleted and not persisted by this job."
