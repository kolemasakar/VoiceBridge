name: A9.6 Facebook Response Shape Isolated Deploy

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/triggers/a9-6-response-shape-deploy.txt
      - .github/workflows/a9-6-facebook-response-shape-deploy.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: a9-6-facebook-response-shape-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      RENDER_API_BASE: https://api.render.com/v1
      SERVICE_ID: srv-da1kic5bedkc73d6fk60
      SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
      REQUIRED_BRANCH: agent/krc-media-transcript
      BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
    steps:
      - name: Checkout trigger
        uses: actions/checkout@v4
        with:
          ref: agent/krc-media-transcript

      - name: Read exact approved code SHA
        id: code
        run: |
          set -euo pipefail
          sha="$(sed -n 's/^sha=//p' .github/triggers/a9-6-response-shape-deploy.txt | head -n1)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Deploy exact code to isolated beta
        id: render
        env:
          CODE_SHA: ${{ steps.code.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          echo "::add-mask::$RENDER_API_KEY"
          curl -sS "${RENDER_API_BASE}/services/${SERVICE_ID}" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/service.json
          [[ "$(jq -r '.name // empty' /tmp/service.json)" == "$SERVICE_NAME" ]]
          [[ "$(jq -r '.branch // empty' /tmp/service.json)" == "$REQUIRED_BRANCH" ]]

          payload="$(jq -nc --arg commitId "$CODE_SHA" '{commitId:$commitId,clearCache:"clear"}')"
          code="$(curl -sS -o /tmp/create.json -w '%{http_code}' \
            -X POST "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" --data "$payload")"
          [[ "$code" == 201 || "$code" == 202 ]]
          deploy_id="$(jq -r '(.deploy // .).id // empty' /tmp/create.json)"
          test -n "$deploy_id"

          status=timeout
          deployed_sha=unknown
          for i in $(seq 1 120); do
            curl -sS "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${deploy_id}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/deploy.json
            status="$(jq -r '(.deploy // .).status // "unknown"' /tmp/deploy.json)"
            deployed_sha="$(jq -r '(.deploy // .).commit.id // (.deploy // .).commitId // "unknown"' /tmp/deploy.json)"
            case "$status" in
              live|build_failed|update_failed|canceled|deactivated) break ;;
            esac
            sleep 5
          done
          [[ "$status" == live ]]
          [[ "$deployed_sha" == "$CODE_SHA" ]]

          curl -sS "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/env.json
          token="$(jq -r '(.envVar.value // .value // empty)' /tmp/env.json)"
          test -n "$token"
          echo "::add-mask::$token"

          cap_http=000
          cap_ok=false
          for i in $(seq 1 12); do
            cap_http="$(curl -sS --max-time 15 -o /tmp/cap.json -w '%{http_code}' \
              "${BETA_BASE_URL}/api/v1/media/managed" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${token}" || true)"
            if [[ "$cap_http" == 200 ]] && jq -e '.configured == true and .facebook_ai_fallback == true and .facebook_ai_requires_duration_metadata == true and .automatic_ai_fallback == false' /tmp/cap.json >/dev/null; then
              cap_ok=true
              break
            fi
            sleep 5
          done
          [[ "$cap_http" == 200 ]]
          [[ "$cap_ok" == true ]]
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "deployed_sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          echo "cap_http=$cap_http" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        env:
          CODE_SHA: ${{ steps.code.outputs.sha }}
          DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
          STATUS: ${{ steps.render.outputs.status }}
          DEPLOYED_SHA: ${{ steps.render.outputs.deployed_sha }}
          CAP_HTTP: ${{ steps.render.outputs.cap_http }}
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then result=PASS; else result=FAIL; fi
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Supadata response-shape isolated deploy: **${result}**. requested_sha=\`${CODE_SHA}\`, deploy_id=\`${DEPLOY_ID:-none}\`, status=\`${STATUS:-unknown}\`, deployed_sha=\`${DEPLOYED_SHA:-unknown}\`, managed_capability_http=\`${CAP_HTTP:-unknown}\`. Exact isolated-beta deploy only. No Supadata/provider/preflight/transcript/metadata/AI endpoint was called. Production/main were not targeted."
