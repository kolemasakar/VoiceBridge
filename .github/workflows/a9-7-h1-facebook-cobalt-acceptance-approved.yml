name: A9.7-H1 Facebook Cobalt Acceptance Approved

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/a9-7-h1-facebook-cobalt-acceptance-approved.yml
      - .github/triggers/a9-7-h1-facebook-cobalt-acceptance-approved.txt

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: a9-7-h1-facebook-cobalt-acceptance-approved
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ACTION_TOKEN: ${{ secrets.KRC_MEDIA_ACTION_TOKEN }}
      BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
      TARGET_URL: https://www.facebook.com/reel/1114235920664408/
    steps:
      - name: Run exactly one durable free Facebook fallback start
        id: run
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTION_TOKEN:-}"
          echo "::add-mask::$ACTION_TOKEN"

          # Exactly one start request. This endpoint can use Cobalt and, only if
          # Cobalt returns media, AssemblyAI STT. It has no paid-retrieval call.
          http="$(curl -sS --max-time 600 -o /tmp/start.json -w '%{http_code}' \
            -X POST "${BASE_URL}/api/v1/media/managed/facebook-fallback" \
            -H "Authorization: Bearer ${ACTION_TOKEN}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "$(jq -nc --arg url "$TARGET_URL" '{url:$url,language_hint:"auto"}')")"

          echo "start_http=$http" >> "$GITHUB_OUTPUT"
          [[ "$http" == 200 ]]

          job_id="$(jq -r '.job_id // empty' /tmp/start.json)"
          status="$(jq -r '.status // empty' /tmp/start.json)"
          provider="$(jq -r '.provider // empty' /tmp/start.json)"
          provider_mode="$(jq -r '.provider_mode // empty' /tmp/start.json)"
          retrieval_provider="$(jq -r '.retrieval_provider // empty' /tmp/start.json)"
          retrieval_credits="$(jq -r '.retrieval_credits_charged // 0' /tmp/start.json)"
          stt_seconds="$(jq -r '.stt_seconds_charged // 0' /tmp/start.json)"
          segment_count="$(jq -r '.segment_count // 0' /tmp/start.json)"
          chars="$(jq -r '.transcript_characters // 0' /tmp/start.json)"
          error_code="$(jq -r '.error.code // empty' /tmp/start.json)"
          reused="$(jq -r '.reused // false' /tmp/start.json)"

          [[ "$job_id" =~ ^KRCM_ ]]
          [[ "$provider_mode" == facebook_retrieval_stt ]]
          [[ "$retrieval_credits" == 0 ]]

          # Read-only durable confirmation. No provider call is triggered by GET.
          read_http="$(curl -sS --max-time 60 -o /tmp/read.json -w '%{http_code}' \
            -H "Authorization: Bearer ${ACTION_TOKEN}" \
            "${BASE_URL}/api/v1/media/managed/transcriptions/${job_id}")"
          [[ "$read_http" == 200 ]]
          durable_status="$(jq -r '.status // empty' /tmp/read.json)"
          durable_segments="$(jq -r '.segment_count // 0' /tmp/read.json)"
          durable_chars="$(jq -r '.transcript_characters // 0' /tmp/read.json)"
          durable_retrieval="$(jq -r '.retrieval_provider // empty' /tmp/read.json)"
          durable_stt="$(jq -r '.stt_seconds_charged // 0' /tmp/read.json)"
          durable_error="$(jq -r '.error.code // empty' /tmp/read.json)"

          [[ "$durable_status" == "$status" ]]
          [[ "$(jq -r '.retrieval_credits_charged // 0' /tmp/read.json)" == 0 ]]

          segments_http=not_applicable
          if [[ "$durable_status" == COMPLETED ]]; then
            segments_http="$(curl -sS --max-time 60 -o /tmp/segments.json -w '%{http_code}' \
              -H "Authorization: Bearer ${ACTION_TOKEN}" \
              "${BASE_URL}/api/v1/media/managed/transcriptions/${job_id}/segments?cursor=0&limit=5")"
            [[ "$segments_http" == 200 ]]
          fi

          {
            echo "job_id=$job_id"
            echo "status=$status"
            echo "provider=$provider"
            echo "provider_mode=$provider_mode"
            echo "retrieval_provider=$retrieval_provider"
            echo "retrieval_credits=$retrieval_credits"
            echo "stt_seconds=$stt_seconds"
            echo "segment_count=$segment_count"
            echo "chars=$chars"
            echo "error_code=$error_code"
            echo "reused=$reused"
            echo "durable_status=$durable_status"
            echo "durable_segments=$durable_segments"
            echo "durable_chars=$durable_chars"
            echo "durable_retrieval=$durable_retrieval"
            echo "durable_stt=$durable_stt"
            echo "durable_error=$durable_error"
            echo "segments_http=$segments_http"
          } >> "$GITHUB_OUTPUT"

      - name: Report A9.7-H1 result
        if: always()
        env:
          START_HTTP: ${{ steps.run.outputs.start_http }}
          JOB_ID: ${{ steps.run.outputs.job_id }}
          STATUS: ${{ steps.run.outputs.status }}
          PROVIDER: ${{ steps.run.outputs.provider }}
          MODE: ${{ steps.run.outputs.provider_mode }}
          RETRIEVAL_PROVIDER: ${{ steps.run.outputs.retrieval_provider }}
          RETRIEVAL_CREDITS: ${{ steps.run.outputs.retrieval_credits }}
          STT_SECONDS: ${{ steps.run.outputs.stt_seconds }}
          SEGMENTS: ${{ steps.run.outputs.segment_count }}
          CHARS: ${{ steps.run.outputs.chars }}
          ERROR_CODE: ${{ steps.run.outputs.error_code }}
          REUSED: ${{ steps.run.outputs.reused }}
          DURABLE_STATUS: ${{ steps.run.outputs.durable_status }}
          DURABLE_RETRIEVAL: ${{ steps.run.outputs.durable_retrieval }}
          DURABLE_STT: ${{ steps.run.outputs.durable_stt }}
          DURABLE_SEGMENTS: ${{ steps.run.outputs.durable_segments }}
          DURABLE_CHARS: ${{ steps.run.outputs.durable_chars }}
          DURABLE_ERROR: ${{ steps.run.outputs.durable_error }}
          SEGMENTS_HTTP: ${{ steps.run.outputs.segments_http }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == success ]]; then result=PASS; else result=FAIL; fi
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.7-H1 one real Facebook Cobalt acceptance: **${result}**. target=\`facebook reel 1114235920664408\`; start_http=\`${START_HTTP:-unknown}\`; job=\`${JOB_ID:-unknown}\`; status=\`${STATUS:-unknown}\`; provider=\`${PROVIDER:-unknown}\`; mode=\`${MODE:-unknown}\`; retrieval_provider=\`${RETRIEVAL_PROVIDER:-none}\`; retrieval_credits=\`${RETRIEVAL_CREDITS:-unknown}\`; stt_seconds=\`${STT_SECONDS:-unknown}\`; segments=\`${SEGMENTS:-unknown}\`; transcript_chars=\`${CHARS:-unknown}\`; error=\`${ERROR_CODE:-none}\`; reused=\`${REUSED:-unknown}\`; durable_status=\`${DURABLE_STATUS:-unknown}\`; durable_retrieval=\`${DURABLE_RETRIEVAL:-none}\`; durable_stt=\`${DURABLE_STT:-unknown}\`; durable_segments=\`${DURABLE_SEGMENTS:-unknown}\`; durable_chars=\`${DURABLE_CHARS:-unknown}\`; durable_error=\`${DURABLE_ERROR:-none}\`; segments_read=\`${SEGMENTS_HTTP:-not_applicable}\`. Exactly one start endpoint was invoked; no paid Facebook continuation, ScrapeCreators, Supadata, production, main, or merge action was executed. AssemblyAI could run only if Cobalt returned media."
