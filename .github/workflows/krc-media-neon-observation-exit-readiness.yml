name: KRC MEDIA Neon Observation Exit Readiness

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/krc-media-neon-observation-exit-readiness.yml

permissions:
  contents: read

concurrency:
  group: krc-media-neon-observation-exit-readiness
  cancel-in-progress: false

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  SOURCE_DB_NAME: voicebridge-krc-media-beta-db
  REQUIRED_BRANCH: agent/krc-media-transcript
  BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  POSTGRES_IMAGE: postgres:18
  REGRESSION_JOB_ID: KRCM_f56f322d-5eda-4295-b29c-548a51bde251

jobs:
  readiness:
    name: Read-only rollback-source and observation exit readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      KRC_NEON_DATABASE_URL: ${{ secrets.KRC_NEON_DATABASE_URL }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Verify current Render target remains Neon
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"
          test -n "${KRC_NEON_DATABASE_URL:-}"
          echo "::add-mask::$RENDER_API_KEY"
          echo "::add-mask::$KRC_NEON_DATABASE_URL"
          [[ "$KRC_NEON_DATABASE_URL" == *".neon.tech"* ]]
          [[ "$KRC_NEON_DATABASE_URL" != *"-pooler."* ]]
          [[ "$KRC_NEON_DATABASE_URL" == *"sslmode=require"* ]]

          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == "200" ]]
          [[ "$(jq -r '.name // empty' "$tmp")" == "$SERVICE_NAME" ]]
          [[ "$(jq -r '.branch // empty' "$tmp")" == "$REQUIRED_BRANCH" ]]
          rm -f "$tmp"

          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_DATABASE_URL" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == "200" ]]
          current_db="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
          rm -f "$tmp"
          test -n "$current_db"
          echo "::add-mask::$current_db"
          [[ "$current_db" == "$KRC_NEON_DATABASE_URL" ]]
          echo "Current isolated runtime still targets Neon."

      - name: Verify original Render PostgreSQL rollback source is recoverable
        shell: bash
        run: |
          set -euo pipefail
          pg_tmp="$(mktemp)"
          pg_code="$(curl -sS -G -o "$pg_tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/postgres" \
            --data-urlencode "name=${SOURCE_DB_NAME}" \
            --data-urlencode 'limit=20' \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$pg_code" == "200" ]]
          source_pg_id="$(jq -r '[.[] | (.postgres // .) | select(.name == "voicebridge-krc-media-beta-db")][0].id // empty' "$pg_tmp")"
          rm -f "$pg_tmp"
          test -n "$source_pg_id"

          conn_tmp="$(mktemp)"
          conn_code="$(curl -sS -o "$conn_tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/postgres/${source_pg_id}/connection-info" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$conn_code" == "200" ]]
          jq -e '.. | strings | select(startswith("postgres://") or startswith("postgresql://"))' "$conn_tmp" >/dev/null
          rm -f "$conn_tmp"
          echo "Original Render PostgreSQL rollback source is still recoverable."

      - name: Load masked Action bearer and verify capability
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == "200" ]]
          action_token="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
          rm -f "$tmp"
          test -n "$action_token"
          echo "::add-mask::$action_token"

          code="$(curl -sS --max-time 60 -o /tmp/krc-capability.json -w '%{http_code}' \
            "${BASE_URL}/api/v1/media/managed" \
            -H 'Accept: application/json' -H "Authorization: Bearer ${action_token}")"
          [[ "$code" == "200" ]]
          jq -e '.mode=="zero_client_managed_beta" and .configured==true and .durable_store=="postgres" and .restart_resilient_jobs==true and .facebook_automatic_paid_retrieval==false and .telegram_retrieval_credits==0 and .local_attachment_retrieval_provider=="openai_attachment"' /tmp/krc-capability.json >/dev/null
          echo "Managed capability remains healthy."

      - name: Verify Neon durable state remains stable
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$POSTGRES_IMAGE" >/dev/null
          nonterminal="$(docker run --rm -e KRC_NEON_DATABASE_URL="$KRC_NEON_DATABASE_URL" "$POSTGRES_IMAGE" \
            psql -X -A -t -v ON_ERROR_STOP=1 --dbname "$KRC_NEON_DATABASE_URL" \
            -c "SELECT count(*) FROM public.krc_managed_media_jobs WHERE status NOT IN ('COMPLETED','FAILED');")"
          [[ "$nonterminal" == "0" ]]

          regression_ok="$(docker run --rm -e KRC_NEON_DATABASE_URL="$KRC_NEON_DATABASE_URL" "$POSTGRES_IMAGE" \
            psql -X -A -t -v ON_ERROR_STOP=1 --dbname "$KRC_NEON_DATABASE_URL" \
            -c "SELECT count(*) FROM public.krc_managed_media_jobs WHERE job_id='${REGRESSION_JOB_ID}' AND status='COMPLETED' AND COALESCE((payload->>'segment_count')::int,0)>0;")"
          [[ "$regression_ok" == "1" ]]
          echo "nonterminal=$nonterminal" >> "$GITHUB_ENV"
          echo "Neon durable state remains stable."

      - name: Publish sanitized readiness summary
        shell: bash
        run: |
          {
            echo '# KRC MEDIA Neon observation exit readiness'
            echo
            echo '- Release state: `RELEASE_HOLD_OWNER_TESTING`'
            echo '- Active durable store: `Neon PostgreSQL 18`'
            echo '- Current Render target still Neon: `PASS`'
            echo '- Original Render PostgreSQL rollback source recoverable: `PASS`'
            echo '- Managed capability: `PASS`'
            echo '- Non-terminal managed jobs: `'$nonterminal'`'
            echo '- Prior regression durable row: `PASS`'
            echo '- Provider-consuming work requested: `NO`'
            echo '- Render environment mutation: `NONE`'
            echo '- Database mutation: `NONE`'
            echo '- Observation exit readiness: `PASS`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary runner material
        if: always()
        shell: bash
        run: sudo rm -f /tmp/krc-* >/dev/null 2>&1 || true
