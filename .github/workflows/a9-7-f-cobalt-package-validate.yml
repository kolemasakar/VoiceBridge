name: A9.7-F Cobalt Package Validate

on:
  pull_request:
    paths:
      - deploy/cobalt-a9-7-f/**
      - .github/workflows/a9-7-f-cobalt-package-validate.yml
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - deploy/cobalt-a9-7-f/**
      - .github/workflows/a9-7-f-cobalt-package-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package invariants
        shell: bash
        run: |
          set -euo pipefail
          blueprint=deploy/cobalt-a9-7-f/render.cobalt-beta.yaml
          keys=deploy/cobalt-a9-7-f/cobalt-keys.json.example
          wiring=deploy/cobalt-a9-7-f/voicebridge.env.example

          grep -Fq 'plan: free' "$blueprint"
          grep -Fq 'region: frankfurt' "$blueprint"
          grep -Fq 'ghcr.io/imputnet/cobalt@sha256:63186dd68afd57ce3bb1f62cc4c139f5fa95b9c3e87a3cf5c6e4c7a570523f62' "$blueprint"
          grep -Fq 'value: "1"' "$blueprint"
          grep -Fq 'file:///etc/secrets/cobalt-keys.json' "$blueprint"
          grep -Fq 'REPLACE_WITH_GENERATED_UUID_V4' "$keys"
          grep -Fq 'allowedServices": ["facebook"]' "$keys"
          grep -Fq 'KRC_MEDIA_COBALT_ENDPOINT=https://krc-cobalt-media-beta-kolemasakar.onrender.com' "$wiring"
          grep -Fq 'KRC_MEDIA_COBALT_API_KEY=REPLACE_WITH_THE_SAME_GENERATED_UUID_V4' "$wiring"

          if grep -RIEq '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' deploy/cobalt-a9-7-f; then
            echo 'A real-looking UUIDv4 must not be committed in the Cobalt package.' >&2
            exit 1
          fi
          if grep -RIEq 'SCRAPECREATORS_API_KEY|SUPADATA_API_KEY|ASSEMBLYAI_API_KEY' deploy/cobalt-a9-7-f/render.cobalt-beta.yaml deploy/cobalt-a9-7-f/voicebridge.env.example; then
            echo 'Paid/provider credentials must not be wired by A9.7-F.' >&2
            exit 1
          fi

      - name: Validate against public Render Blueprint schema
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pyyaml jsonschema
          curl -fsSL https://render.com/schema/render.yaml.json -o /tmp/render-schema.json
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator

          blueprint = yaml.safe_load(Path('deploy/cobalt-a9-7-f/render.cobalt-beta.yaml').read_text())
          schema = json.loads(Path('/tmp/render-schema.json').read_text())
          errors = sorted(Draft202012Validator(schema).iter_errors(blueprint), key=lambda e: list(e.path))
          if errors:
              for error in errors:
                  path = '.'.join(str(part) for part in error.path) or '<root>'
                  print(f'{path}: {error.message}')
              raise SystemExit(1)
          print('A9.7-F Render Blueprint schema: PASS')
          PY
