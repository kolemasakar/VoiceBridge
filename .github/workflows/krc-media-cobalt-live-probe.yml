name: KRC MEDIA Cobalt Live Probe

on:
  push:
    branches:
      - agent/krc-media-gemini-migration
    paths:
      - .github/workflows/krc-media-cobalt-live-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Cobalt instance and one YouTube retrieval response
        shell: bash
        run: |
          set -euo pipefail

          endpoint='https://krc-cobalt-media-beta-kolemasakar.onrender.com'
          source_url='https://www.youtube.com/watch?v=5i-4Pk5Idb4'

          echo '=== COBALT GET / ==='
          get_code=$(curl -sS --max-time 90 -D get-headers.txt -o get-body.txt -w '%{http_code}' "$endpoint/")
          get_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/\r$/,"",$0); print substr($0,index($0,":")+2); exit}' get-headers.txt || true)
          get_bytes=$(wc -c < get-body.txt | tr -d ' ')
          echo "http_code=$get_code"
          echo "content_type=${get_type:-missing}"
          echo "body_bytes=$get_bytes"
          if jq -e . get-body.txt >/dev/null 2>&1; then
            echo 'json_valid=true'
            jq -r '"cobalt_version=" + (.cobalt.version // ""), "service_count=" + ((.cobalt.services // []) | length | tostring)' get-body.txt
          else
            echo 'json_valid=false'
          fi

          echo '=== COBALT POST / YOUTUBE AUDIO ==='
          post_code=$(curl -sS --max-time 120 -D post-headers.txt -o post-body.txt -w '%{http_code}' \
            -X POST "$endpoint/" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg url "$source_url" '{url:$url,downloadMode:"audio",audioFormat:"mp3",disableMetadata:true}')")
          post_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/\r$/,"",$0); print substr($0,index($0,":")+2); exit}' post-headers.txt || true)
          post_bytes=$(wc -c < post-body.txt | tr -d ' ')
          echo "http_code=$post_code"
          echo "content_type=${post_type:-missing}"
          echo "body_bytes=$post_bytes"
          if jq -e . post-body.txt >/dev/null 2>&1; then
            echo 'json_valid=true'
            jq -r '"status=" + (.status // ""), "error_code=" + (.error.code // "")' post-body.txt
          else
            echo 'json_valid=false'
          fi

          # Deliberately do not print or follow any returned media/tunnel URL.
          # Deliberately do not call AssemblyAI or any other STT provider.
