name: A9.6 Supadata Nested Result Commit

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-supadata-nested-result-commit.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  commit_fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/krc-media-transcript
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/cloud/package-lock.json

      - name: Apply verified parser remediation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/a9_6_supadata_nested_result_patch.py

      - name: Re-run full cloud checks
        working-directory: src/cloud
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check

      - name: Commit and push verified remediation
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloud/src/supadata_provider.ts src/cloud/tests/supadata_provider.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "A9.6: accept nested Supadata async transcript results"
          git pull --rebase origin agent/krc-media-transcript
          git push origin HEAD:agent/krc-media-transcript
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report commit remediation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" && -n "${SHA:-}" ]]; then
            gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Supadata nested-result remediation commit: **PASS**. Full Node 24 cloud check is green (89 tests including nested async result coverage). Feature SHA: \`${SHA}\`; committed_changes=\`${CHANGED}\`. No provider transcript, metadata, or AI start request was executed. Production/main were not targeted."
          else
            gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Supadata nested-result remediation commit: **FAILURE**. No provider transcript, metadata, or AI start request was executed. Production/main were not targeted."
          fi
