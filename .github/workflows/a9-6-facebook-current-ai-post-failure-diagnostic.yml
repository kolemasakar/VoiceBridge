name: A9.6 Facebook Current AI Post-Failure Diagnostic

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-facebook-current-ai-post-failure-diagnostic.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  FACEBOOK_URL: https://www.facebook.com/reel/1114235920664408
  JOB_ID: KRCM_1e99b074-fdf6-4144-9278-0e66e9a79713

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read current state only
        id: d
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$RENDER_API_KEY"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" \
            -H 'Accept: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]]
          token="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
          rm -f "$tmp"
          test -n "$token"
          echo "::add-mask::$token"

          payload="$(jq -nc --arg url "$FACEBOOK_URL" '{url:$url,language_hint:"auto"}')"
          balance_http="$(curl -sS --max-time 60 -o /tmp/balance.json -w '%{http_code}' \
            -X POST "${BETA_BASE_URL}/api/v1/media/managed/preflight" \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${token}" --data "$payload")"
          lookup_http="$(curl -sS --max-time 60 -o /tmp/lookup.json -w '%{http_code}' \
            -X POST "${BETA_BASE_URL}/api/v1/media/managed/lookup" \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${token}" --data "$payload")"
          job_http="$(curl -sS --max-time 60 -o /tmp/job.json -w '%{http_code}' \
            "${BETA_BASE_URL}/api/v1/media/managed/transcriptions/${JOB_ID}" \
            -H 'Accept: application/json' -H "Authorization: Bearer ${token}")"

          balance="$(jq -r '.credits_available // "unknown"' /tmp/balance.json 2>/dev/null || echo unknown)"
          src=/tmp/job.json
          if [[ "$job_http" != 200 ]]; then src=/tmp/lookup.json; fi
          status="$(jq -r '.status // "unknown"' "$src" 2>/dev/null || echo unknown)"
          mode="$(jq -r '.provider_mode // "unknown"' "$src" 2>/dev/null || echo unknown)"
          credits="$(jq -r '.credits_charged // "unknown"' "$src" 2>/dev/null || echo unknown)"
          metadata="$(jq -r '.metadata_credits_charged // "unknown"' "$src" 2>/dev/null || echo unknown)"
          uncertain="$(jq -r '.credit_charge_uncertain // "unknown"' "$src" 2>/dev/null || echo unknown)"
          segments="$(jq -r '.segment_count // "unknown"' "$src" 2>/dev/null || echo unknown)"
          chars="$(jq -r '.transcript_characters // "unknown"' "$src" 2>/dev/null || echo unknown)"
          error_code="$(jq -r '.error.code // "none"' "$src" 2>/dev/null || echo none)"
          error_message="$(jq -r '.error.message // "none"' "$src" 2>/dev/null | tr '\n\r' '  ' | cut -c1-180 || echo none)"
          updated="$(jq -r '.updated_at // "unknown"' "$src" 2>/dev/null || echo unknown)"

          echo "balance_http=$balance_http" >> "$GITHUB_OUTPUT"
          echo "balance=$balance" >> "$GITHUB_OUTPUT"
          echo "lookup_http=$lookup_http" >> "$GITHUB_OUTPUT"
          echo "job_http=$job_http" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "credits=$credits" >> "$GITHUB_OUTPUT"
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"
          echo "uncertain=$uncertain" >> "$GITHUB_OUTPUT"
          echo "segments=$segments" >> "$GITHUB_OUTPUT"
          echo "chars=$chars" >> "$GITHUB_OUTPUT"
          echo "error_code=$error_code" >> "$GITHUB_OUTPUT"
          echo "error_message=$error_message" >> "$GITHUB_OUTPUT"
          echo "updated=$updated" >> "$GITHUB_OUTPUT"

      - name: Report
        env:
          BH: ${{ steps.d.outputs.balance_http }}
          B: ${{ steps.d.outputs.balance }}
          LH: ${{ steps.d.outputs.lookup_http }}
          JH: ${{ steps.d.outputs.job_http }}
          S: ${{ steps.d.outputs.status }}
          M: ${{ steps.d.outputs.mode }}
          C: ${{ steps.d.outputs.credits }}
          MC: ${{ steps.d.outputs.metadata }}
          U: ${{ steps.d.outputs.uncertain }}
          SG: ${{ steps.d.outputs.segments }}
          CH: ${{ steps.d.outputs.chars }}
          EC: ${{ steps.d.outputs.error_code }}
          EM: ${{ steps.d.outputs.error_message }}
          UP: ${{ steps.d.outputs.updated }}
        shell: bash
        run: |
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.6 Facebook current AI post-failure diagnostic: balance_http=\`${BH}\`, provider_balance=\`${B}\`, lookup_http=\`${LH}\`, job_http=\`${JH}\`, status=\`${S}\`, provider_mode=\`${M}\`, cumulative_credits=\`${C}\`, metadata_credits=\`${MC}\`, credit_charge_uncertain=\`${U}\`, segments=\`${SG}\`, transcript_characters=\`${CH}\`, error_code=\`${EC}\`, error_message=\`${EM}\`, updated_at=\`${UP}\`. Read-only job/lookup plus free balance preflight only; no AI/native/metadata start or retry was executed."
