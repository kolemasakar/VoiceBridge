name: MEDIA BETA PO Provider Diagnostic

# One-shot beta diagnostic. No secrets required.
on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/media-beta-pot-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/krc-media-transcript

      - name: Build beta image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t voicebridge-media-beta-diag src/cloud

      - name: Verify provider and yt-dlp plugin
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh voicebridge-media-beta-diag -c '
            set -eu
            node /opt/bgutil/build/main.js --port 4416 >/tmp/bgutil.log 2>&1 &
            provider_pid=$!
            trap "kill $provider_pid 2>/dev/null || true" EXIT
            i=0
            while [ $i -lt 20 ]; do
              if node -e "fetch(\"http://127.0.0.1:4416/ping\").then(r=>{if(!r.ok)process.exit(1);return r.text()}).then(t=>console.log(\"PROVIDER_PING=\"+t)).catch(()=>process.exit(1))"; then
                break
              fi
              i=$((i+1))
              sleep 0.5
            done
            if [ $i -ge 20 ]; then
              echo "PROVIDER_START=FAILED"
              cat /tmp/bgutil.log || true
              exit 2
            fi
            echo "YTDLP_VERSION=$(yt-dlp --version)"
            set +e
            yt-dlp -v --no-playlist --skip-download --simulate \
              --extractor-args "youtube:player_client=mweb" \
              --js-runtimes node \
              "https://www.youtube.com/watch?v=DZLzmQ2kwaA" \
              >/tmp/ytdlp.out 2>/tmp/ytdlp.err
            rc=$?
            set -e
            echo "YTDLP_RC=$rc"
            grep -E "PO Token Providers|bgutil|Sign in to confirm|player_client|JS runtimes|Extracting URL|Downloading webpage|ERROR:" /tmp/ytdlp.err /tmp/ytdlp.out || true
            echo "--- PROVIDER LOG TAIL ---"
            tail -n 40 /tmp/bgutil.log || true
            exit 0
          '
