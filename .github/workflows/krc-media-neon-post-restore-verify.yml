name: KRC MEDIA Neon Post Restore Verify

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/krc-media-neon-post-restore-verify.yml

permissions:
  contents: read

jobs:
  verify:
    name: Read-only Neon post-restore verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KRC_NEON_DATABASE_URL: ${{ secrets.KRC_NEON_DATABASE_URL }}
      POSTGRES_IMAGE: postgres:18
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Verify protected Neon target
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KRC_NEON_DATABASE_URL:-}" || { echo "KRC_NEON_DATABASE_URL is not configured"; exit 1; }
          echo "::add-mask::$KRC_NEON_DATABASE_URL"
          [[ "$KRC_NEON_DATABASE_URL" != *"-pooler."* ]]
          [[ "$KRC_NEON_DATABASE_URL" == *"sslmode=require"* ]]
          docker pull "$POSTGRES_IMAGE" >/dev/null
          docker run --rm -i \
            -e KRC_NEON_DATABASE_URL="$KRC_NEON_DATABASE_URL" \
            "$POSTGRES_IMAGE" \
            psql -X -A -t -F '|' -v ON_ERROR_STOP=1 --dbname "$KRC_NEON_DATABASE_URL" \
            < scripts/krc-media-neon-fingerprint.sql \
            > /tmp/krc-neon-fingerprint.txt
          db_meta="$(docker run --rm \
            -e KRC_NEON_DATABASE_URL="$KRC_NEON_DATABASE_URL" \
            "$POSTGRES_IMAGE" \
            bash -lc 'psql -X -A -t -F "|" -v ON_ERROR_STOP=1 --dbname "$KRC_NEON_DATABASE_URL" -c "SELECT current_database(), current_setting('"'"'server_version_num'"'"');"')"
          IFS='|' read -r db version <<< "$db_meta"
          [[ "$db" == "krc_media_beta" ]]
          [[ "$version" -ge 180000 && "$version" -lt 190000 ]]
          schema_fp="$(awk -F'|' '$1=="schema_fingerprint" {print $2}' /tmp/krc-neon-fingerprint.txt)"
          managed_count="$(awk -F'|' '$1=="managed_count" {print $2}' /tmp/krc-neon-fingerprint.txt)"
          client_count="$(awk -F'|' '$1=="client_count" {print $2}' /tmp/krc-neon-fingerprint.txt)"
          stt_count="$(awk -F'|' '$1=="stt_charge_count" {print $2}' /tmp/krc-neon-fingerprint.txt)"
          combined_sha="$(sha256sum /tmp/krc-neon-fingerprint.txt | awk '{print $1}')"
          [[ "$schema_fp" == "3ec31bd757e74b958c1a5a0226fab9bb" ]]
          [[ "$combined_sha" == "dd6cfd92a6a667c6b8632ed3b2723179e56038599ace0dd3a1088bbb3931cbd5" ]]
          [[ "$managed_count" == "1" ]]
          [[ "$client_count" == "0" ]]
          [[ "$stt_count" == "0" ]]
          echo "schema_fp=$schema_fp" >> "$GITHUB_OUTPUT"
          echo "combined_sha=$combined_sha" >> "$GITHUB_OUTPUT"
          echo "managed_count=$managed_count" >> "$GITHUB_OUTPUT"
          echo "client_count=$client_count" >> "$GITHUB_OUTPUT"
          echo "stt_count=$stt_count" >> "$GITHUB_OUTPUT"
          echo "Read-only Neon post-restore verification PASS."

      - name: Publish sanitized verification summary
        shell: bash
        run: |
          {
            echo "# KRC MEDIA Neon post-restore verification"
            echo
            echo "- Database: \`krc_media_beta\`"
            echo "- PostgreSQL major: \`18\`"
            echo "- Structural fingerprint: \`${{ steps.verify.outputs.schema_fp }}\`"
            echo "- Combined fingerprint SHA256: \`${{ steps.verify.outputs.combined_sha }}\`"
            echo "- krc_managed_media_jobs rows: \`${{ steps.verify.outputs.managed_count }}\`"
            echo "- krc_media_client_jobs rows: \`${{ steps.verify.outputs.client_count }}\`"
            echo "- krc_media_stt_charges rows: \`${{ steps.verify.outputs.stt_count }}\`"
            echo "- Database writes requested by this workflow: \`false\`"
            echo "- Render environment changed: \`false\`"
            echo "- Cutover performed: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary runner material
        if: always()
        shell: bash
        run: rm -f /tmp/krc-neon-fingerprint.txt
