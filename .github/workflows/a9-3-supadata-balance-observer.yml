name: A9.3 Supadata Balance Observer

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-3-supadata-balance-observer.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  observe:
    runs-on: ubuntu-latest
    env:
      SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read Supadata account only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPADATA_API_KEY:-}"
          echo "::add-mask::$SUPADATA_API_KEY"
          code="$(curl -sS --max-time 60 -o /tmp/me.json -w '%{http_code}' \
            https://api.supadata.ai/v1/me \
            -H 'Accept: application/json' \
            -H "x-api-key: ${SUPADATA_API_KEY}")"
          [[ "$code" == 200 ]]
          max="$(jq -r '.maxCredits' /tmp/me.json)"
          used="$(jq -r '.usedCredits' /tmp/me.json)"
          plan="$(jq -r '.plan // "unknown"' /tmp/me.json)"
          [[ "$max" =~ ^[0-9]+$ && "$used" =~ ^[0-9]+$ ]]
          available=$((max-used))
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "A9.3 direct Supadata balance observer: **SUCCESS**. Plan: \`${plan}\`; available credits: \`${available}\`. This observer called account \`/me\` only; it did not call transcript APIs or mutate Render."

