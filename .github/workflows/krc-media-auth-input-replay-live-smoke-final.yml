name: KRC MEDIA Auth Input Replay Live Smoke Final

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/krc-media-auth-input-replay-live-smoke-final.yml

permissions:
  contents: read

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  HARDENED_SHA: e83a13a09b9bbcf293fb4f2d705f4ea7f15712b7

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      KRC_NEON_DATABASE_URL: ${{ secrets.KRC_NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify isolated target and protected Neon store
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}"; test -n "${KRC_NEON_DATABASE_URL:-}"
          echo "::add-mask::$RENDER_API_KEY"; echo "::add-mask::$KRC_NEON_DATABASE_URL"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}" -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]]; [[ "$(jq -r '.name' "$tmp")" == "$SERVICE_NAME" ]]; [[ "$(jq -r '.branch' "$tmp")" == "$REQUIRED_BRANCH" ]]; rm -f "$tmp"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_DATABASE_URL" -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]]; current_db="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"; rm -f "$tmp"
          test -n "$current_db"; echo "::add-mask::$current_db"; [[ "$current_db" == "$KRC_NEON_DATABASE_URL" ]]
          max_body=32768
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/MAX_REQUEST_BODY_BYTES" -H "Authorization: Bearer ${RENDER_API_KEY}" || true)"
          if [[ "$code" == 200 ]]; then v="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"; [[ "$v" =~ ^[0-9]+$ ]] && max_body="$v" || true; fi
          rm -f "$tmp"; [[ "$max_body" -ge 1024 && "$max_body" -le 1048576 ]]; printf '%s' "$max_body" >/tmp/max-body-bytes

      - name: Deploy exact hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"; payload="$(jq -nc --arg commitId "$HARDENED_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" -H 'Content-Type: application/json' -H "Authorization: Bearer ${RENDER_API_KEY}" --data "$payload")"
          [[ "$code" == 201 || "$code" == 202 ]]; deploy_id="$(jq -r '(.deploy // .).id // empty' "$tmp")"; rm -f "$tmp"; test -n "$deploy_id"
          live=0
          for i in $(seq 1 150); do
            tmp="$(mktemp)"; code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${deploy_id}" -H "Authorization: Bearer ${RENDER_API_KEY}")"; [[ "$code" == 200 ]]
            status="$(jq -r '(.deploy // .).status // "unknown"' "$tmp")"; commit="$(jq -r '(.deploy // .).commit.id // (.deploy // .).commitId // "unknown"' "$tmp")"; rm -f "$tmp"
            if [[ "$status" == live ]]; then [[ "$commit" == "$HARDENED_SHA" ]]; live=1; break; fi
            case "$status" in build_failed|update_failed|canceled|deactivated) exit 1;; esac; sleep 5
          done
          [[ "$live" == 1 ]]

      - name: Load masked Action bearer
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"; code="$(curl -sS -o "$tmp" -w '%{http_code}' "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" -H "Authorization: Bearer ${RENDER_API_KEY}")"; [[ "$code" == 200 ]]
          token="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"; rm -f "$tmp"; test -n "$token"; echo "::add-mask::$token"; umask 077; printf '%s' "$token" >/tmp/krc-token

      - name: Run no-spend negative matrix
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/krc-token)"; echo "::add-mask::$token"
          printf '%s' '{"url":"https://www.youtube.com/watch?v=dQw4w9WgXcQ"}' >/tmp/good.json
          printf '%s' '{not-json' >/tmp/bad.json
          python - "$(cat /tmp/max-body-bytes)" <<'PY'
          import json,sys
          with open('/tmp/large.json','w') as f: json.dump({'url':'https://www.youtube.com/watch?v=dQw4w9WgXcQ','padding':'x'*(int(sys.argv[1])+2048)},f)
          PY
          check(){ label="$1"; method="$2"; path="$3"; auth="$4"; file="$5"; want_http="$6"; want_code="$7"; out="/tmp/${label}.json"; args=(curl -sS --max-time 60 -o "$out" -w '%{http_code}' -X "$method" "${BASE_URL}${path}" -H 'Accept: application/json'); [[ -n "$auth" ]] && args+=(-H "Authorization: $auth"); [[ -n "$file" ]] && args+=(-H 'Content-Type: application/json' --data-binary "@$file"); got_http="$("${args[@]}")"; got_code="$(jq -r '.error.code // empty' "$out" 2>/dev/null || true)"; echo "$label HTTP=$got_http CODE=${got_code:-NON_JSON_OR_EMPTY}"; [[ "$got_http" == "$want_http" && "$got_code" == "$want_code" ]]; }
          check missing POST /api/v1/media/managed/preflight '' /tmp/good.json 401 AUTHENTICATION_REQUIRED
          check invalid POST /api/v1/media/managed/preflight 'Bearer definitely-wrong-token' /tmp/good.json 401 AUTHENTICATION_FAILED
          check malformed POST /api/v1/media/managed/preflight "Bearer $token" /tmp/bad.json 400 INVALID_REQUEST
          check oversized POST /api/v1/media/managed/preflight "Bearer $token" /tmp/large.json 413 REQUEST_BODY_TOO_LARGE
          check wrongmethod GET /api/v1/media/managed/preflight "Bearer $token" '' 404 NOT_FOUND
          check badjob GET /api/v1/media/managed/transcriptions/not-a-job "Bearer $token" '' 404 NOT_FOUND
          check range GET '/api/v1/media/managed/transcriptions/KRCM_safe123/segments?limit=51' "Bearer $token" '' 400 INVALID_PAGINATION
          out=/tmp/injection.out
          got_http="$(curl -sS --max-time 60 -o "$out" -w '%{http_code}' "${BASE_URL}/api/v1/media/managed/transcriptions/KRCM_safe123/segments?cursor=0%20OR%201%3D1" -H "Authorization: Bearer $token")"
          got_code="$(jq -r '.error.code // empty' "$out" 2>/dev/null || true)"
          if [[ "$got_http" == 400 && "$got_code" == INVALID_PAGINATION ]]; then echo 'pagination-injection APP_BLOCKED'; elif [[ "$got_http" == 403 ]]; then echo 'pagination-injection EDGE_BLOCKED'; else echo "pagination-injection unexpected HTTP=$got_http CODE=${got_code:-NON_JSON_OR_EMPTY}"; exit 1; fi
          echo 'AUTH_INPUT_REPLAY_LIVE_NEGATIVE_MATRIX=PASS'

      - name: Sanitized summary
        shell: bash
        run: |
          {
            echo '# KRC MEDIA auth/input/replay live negative matrix'
            echo '- exact hardened runtime: `PASS`'
            echo '- Neon target unchanged: `PASS`'
            echo '- missing/invalid bearer: `PASS`'
            echo '- malformed/oversized JSON: `PASS`'
            echo '- wrong method/malformed job id: `PASS`'
            echo '- pagination bounds: `PASS`'
            echo '- injection-shaped pagination: `FAIL-CLOSED` (application validation or upstream edge denial)'
            echo '- provider-consuming work: `NONE`'
            echo '- database mutation requested: `NONE`'
            echo '- Render environment mutation: `NONE`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        shell: bash
        run: sudo rm -f /tmp/krc-token /tmp/max-body-bytes /tmp/good.json /tmp/bad.json /tmp/large.json /tmp/*.json /tmp/injection.out >/dev/null 2>&1 || true
