name: A9.6 Instagram AI Acceptance Once

on:
  push:
    branches:
      - agent/krc-media-transcript
    paths:
      - .github/workflows/a9-6-instagram-ai-acceptance-once.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: a9-6-instagram-ai-acceptance-once
  cancel-in-progress: false

env:
  RENDER_API_BASE: https://api.render.com/v1
  SERVICE_ID: srv-da1kic5bedkc73d6fk60
  SERVICE_NAME: voicebridge-krc-media-beta-kolemasakar
  REQUIRED_BRANCH: agent/krc-media-transcript
  BETA_BASE_URL: https://voicebridge-krc-media-beta-kolemasakar.onrender.com
  ACCEPTANCE_JOB_ID: KRCM_9f692330-87f6-4581-a0c4-6d51767aca54
  APPROVED_AI_MAX_CREDITS: "40"
  PRIOR_NATIVE_CREDITS: "1"

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Enforce isolated target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}" || { echo "RENDER_API_KEY missing" >&2; exit 1; }
          [[ "${GITHUB_REF_NAME}" == "${REQUIRED_BRANCH}" ]] || { echo "Unexpected branch" >&2; exit 1; }
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]] || { echo "Service lookup failed HTTP $code" >&2; rm -f "$tmp"; exit 1; }
          name="$(jq -r '.name // empty' "$tmp")"
          branch="$(jq -r '.branch // empty' "$tmp")"
          rm -f "$tmp"
          [[ "$name" == "$SERVICE_NAME" ]] || { echo "Isolation guard failed" >&2; exit 1; }
          [[ "$branch" == "$REQUIRED_BRANCH" ]] || { echo "Branch guard failed" >&2; exit 1; }
          echo "Isolated target verified."

      - name: Deploy exact approved feature commit
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg commitId "$GITHUB_SHA" '{commitId:$commitId,clearCache:"do_not_clear"}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            -X POST "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            --data "$payload")"
          [[ "$code" == 201 || "$code" == 202 ]] || { echo "Deploy failed HTTP $code" >&2; rm -f "$tmp"; exit 1; }
          deploy_id="$(jq -r '(.deploy // .).id // empty' "$tmp")"
          rm -f "$tmp"
          test -n "$deploy_id" || { echo "Deploy ID missing" >&2; exit 1; }
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for isolated deploy
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 72); do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              "${RENDER_API_BASE}/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${RENDER_API_KEY}")"
            [[ "$code" == 200 ]] || { rm -f "$tmp"; echo "Deploy status HTTP $code" >&2; exit 1; }
            status="$(jq -r '(.deploy // .).status // "unknown"' "$tmp")"
            rm -f "$tmp"
            case "$status" in
              live) echo "Deploy live."; exit 0 ;;
              build_failed|update_failed|canceled|deactivated) echo "Deploy failed: $status" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo "Deploy timeout" >&2
          exit 1

      - name: Read and mask Action bearer
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            "${RENDER_API_BASE}/services/${SERVICE_ID}/env-vars/KRC_MEDIA_ACTION_TOKEN" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${RENDER_API_KEY}")"
          [[ "$code" == 200 ]] || { rm -f "$tmp"; echo "Action token lookup HTTP $code" >&2; exit 1; }
          token="$(jq -r '(.envVar.value // .value // empty)' "$tmp")"
          rm -f "$tmp"
          test -n "$token" || { echo "Action token missing" >&2; exit 1; }
          echo "::add-mask::$token"
          printf '%s' "$token" > /tmp/krc-action-token
          chmod 600 /tmp/krc-action-token

      - name: Revalidate exact second-consent quote
        id: quote
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/krc-action-token)"
          code="$(curl -sS --max-time 90 -o /tmp/ai-quote.json -w '%{http_code}' \
            "${BETA_BASE_URL}/api/v1/media/managed/transcriptions/${ACCEPTANCE_JOB_ID}/ai-preflight" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${token}")"
          [[ "$code" == 200 ]] || { echo "AI preflight HTTP $code" >&2; exit 1; }
          jq -e --argjson approved "$APPROVED_AI_MAX_CREDITS" '
            .provider == "supadata" and
            .mode == "generate" and
            .maximum_credits == $approved and
            .estimated_credits == $approved and
            .credits_per_minute == 2 and
            .maximum_duration_minutes == 20 and
            .conservative_maximum == true and
            .consent_required == true and
            .can_continue == true and
            .credits_available >= $approved
          ' /tmp/ai-quote.json >/dev/null
          available="$(jq -r '.credits_available' /tmp/ai-quote.json)"
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "Second-consent quote still valid: available=$available, hard max=$APPROVED_AI_MAX_CREDITS."

      - name: Execute exactly one approved AI generation request
        id: ai
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/krc-action-token)"
          body="$(jq -nc --argjson max "$APPROVED_AI_MAX_CREDITS" '{credit_consent:{provider:"supadata",mode:"generate",max_credits:$max}}')"
          code="$(curl -sS --max-time 420 -o /tmp/ai-result.json -w '%{http_code}' \
            -X POST "${BETA_BASE_URL}/api/v1/media/managed/transcriptions/${ACCEPTANCE_JOB_ID}/ai" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${token}" \
            --data "$body")"
          [[ "$code" == 200 ]] || { echo "AI execution HTTP $code" >&2; jq -c '{error}' /tmp/ai-result.json >&2 || true; exit 1; }
          jq -e '
            .job_id == env.ACCEPTANCE_JOB_ID and
            (.status == "COMPLETED" or .status == "FAILED") and
            .provider == "supadata" and
            (.provider_mode == "generate" or .provider_mode == "native") and
            .credits_charged >= 1 and
            .credit_charge_uncertain == false
          ' /tmp/ai-result.json >/dev/null
          status="$(jq -r '.status' /tmp/ai-result.json)"
          total="$(jq -r '.credits_charged' /tmp/ai-result.json)"
          ai_charge="$(jq -n --argjson total "$total" --argjson native "$PRIOR_NATIVE_CREDITS" '$total - $native')"
          segments="$(jq -r '.segment_count' /tmp/ai-result.json)"
          language="$(jq -r '.detected_language // "unknown"' /tmp/ai-result.json)"
          mode="$(jq -r '.provider_mode' /tmp/ai-result.json)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "ai_charge=$ai_charge" >> "$GITHUB_OUTPUT"
          echo "segments=$segments" >> "$GITHUB_OUTPUT"
          echo "language=$language" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [[ "$status" != "COMPLETED" ]]; then
            jq -c '{status,provider_mode,credits_charged,credit_charge_uncertain,error}' /tmp/ai-result.json >&2
            exit 1
          fi
          [[ "$mode" == "generate" ]] || { echo "Completed result did not record generate mode" >&2; exit 1; }
          jq -e --argjson max "$APPROVED_AI_MAX_CREDITS" --argjson native "$PRIOR_NATIVE_CREDITS" '
            .segment_count > 0 and
            .credits_charged >= $native and
            (.credits_charged - $native) <= $max
          ' /tmp/ai-result.json >/dev/null
          echo "AI request completed within approved hard cap."

      - name: Verify timestamped segments are retrievable
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/krc-action-token)"
          code="$(curl -sS --max-time 90 -o /tmp/segments.json -w '%{http_code}' \
            "${BETA_BASE_URL}/api/v1/media/managed/transcriptions/${ACCEPTANCE_JOB_ID}/segments?cursor=0&limit=50" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${token}")"
          [[ "$code" == 200 ]] || { echo "Segments HTTP $code" >&2; exit 1; }
          jq -e '
            .status == "COMPLETED" and
            (.segments | length) > 0 and
            (.segments[0].text | type == "string") and
            (.segments[0].start_ms | type == "number") and
            (.segments[0].end_ms | type == "number")
          ' /tmp/segments.json >/dev/null
          echo "Timestamped segment retrieval: PASS."

      - name: Report approved A9.6 AI acceptance
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AVAILABLE: ${{ steps.quote.outputs.available }}
          STATUS: ${{ steps.ai.outputs.status }}
          TOTAL: ${{ steps.ai.outputs.total }}
          AI_CHARGE: ${{ steps.ai.outputs.ai_charge }}
          SEGMENTS: ${{ steps.ai.outputs.segments }}
          LANGUAGE: ${{ steps.ai.outputs.language }}
          MODE: ${{ steps.ai.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then
            body="A9.6 Instagram AI fallback acceptance: **SUCCESS**. User explicitly approved the second consent with hard maximum \`${APPROVED_AI_MAX_CREDITS}\` credits. Isolated target only. Existing job \`${ACCEPTANCE_JOB_ID}\`: status=\`${STATUS}\`, provider_mode=\`${MODE}\`, detected_language=\`${LANGUAGE}\`, segments=\`${SEGMENTS}\`, cumulative_credits=\`${TOTAL}\`, AI_credits=\`${AI_CHARGE}\`, credits_available_before_AI=\`${AVAILABLE}\`. One AI generation request was executed; its AI charge did not exceed the approved hard maximum. Production/main were not targeted."
          else
            body="A9.6 Instagram AI fallback acceptance: **FAILURE** after explicit second consent. Isolated target only; approved hard maximum=\`${APPROVED_AI_MAX_CREDITS}\`. Automatic retry is forbidden. Inspect the durable job before any further billable request. Production/main were not targeted."
          fi
          gh pr comment 28 --repo kolemasakar/VoiceBridge --body "$body"
